# The studio's own tests, on every push and pull request.
#
# This checks the Python that builds a mission - quick, so it can run on every
# commit. The bundled server, the installer and the portable zip are built by
# release.yml when a tag is pushed; repeating that whole build here would take
# tens of minutes for no more certainty.
name: Test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest          # where the studio runs, and where its paths are tested
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Run the tests
        run: python -m unittest discover -v

      - name: Check every module still compiles
        run: python -m compileall -q studio tests
