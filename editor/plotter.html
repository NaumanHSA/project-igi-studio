/* ---------------- live view ---------------- */
// Where you are in the running game, on the plan. The server reads the
// player's position out of IGI.exe (studio/server/live_pos.py): it finds it by looking
// for the level's start position while you stand there, then keeps the copy
// that moves when you walk.
var LIVE={on:false,state:null,timer:0,trail:[],follow:true,trailOn:true,pos:null,heading:null};
// A run: while the live view follows you in an open mission, where you went is
// kept (every 0.4 m, with the time) and saved to the mission's runs/ now and then.

var REC={on:true,run:null,saved:0,mid:null},REPLAY={runs:null,run:null,t:0,playing:false,raf:0,last:0};
function recordPoint(p){
  if(!REC.on||!M||!Store||Store.local)return;
  if(!REC.run||REC.mid!==M.id){if(REC.run)saveRun();REC.run={started:Date.now(),pts:[]};REC.mid=M.id}
  var t=(Date.now()-REC.run.started)/1000;
  REC.run.pts.push([+t.toFixed(2),+p.x.toFixed(2),+p.y.toFixed(2),+(p.z||0).toFixed(2)]);
  if(Date.now()-REC.saved>20000)saveRun();
}
function saveRun(){
  var r=REC.run,mid=REC.mid;REC.saved=Date.now();
  if(!r||!mid||r.pts.length<3)return Promise.resolve();
  return fetch("api/missions/"+mid+"/runs",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(r)})
    .then(function(){REPLAY.runs=null}).catch(function(){});
}
function loadRuns(){
  if(!M||!Store||Store.local)return;
  fetch("api/missions/"+M.id+"/runs").then(function(r){return r.json()}).then(function(j){REPLAY.runs=j.runs||[];renderLive()}).catch(function(){});

function playRun(id){
  fetch("api/missions/"+M.id+"/runs/"+id).then(function(r){return r.json()}).then(function(j){
    if(!j.ok)return;
    REPLAY.run=j.run;REPLAY.t=0;REPLAY.playing=true;REPLAY.last=performance.now();
    var p=j.run.pts[0];if(p)jumpTo(p[1],p[2],Math.max(view.k,2.5));
    tickReplay();renderLive();

function tickReplay(){
  cancelAnimationFrame(REPLAY.raf);
  if(!REPLAY.run||!REPLAY.playing)return;
  REPLAY.raf=requestAnimationFrame(function(now){
    var pts=REPLAY.run.pts,end=pts.length?pts[pts.length-1][0]:0;
    REPLAY.t=Math.min(end,REPLAY.t+(now-REPLAY.last)/1000*(REPLAY.speed||4));REPLAY.last=now;
    if(REPLAY.t>=end)REPLAY.playing=false;
    var sl=$("rp-t");if(sl)sl.value=REPLAY.t;
    present();tickReplay();

}
function replayAt(t){
  var pts=REPLAY.run.pts,i=0;
  while(i+1<pts.length&&pts[i+1][0]<=t)i++;

}
function drawReplay(){
  if(!REPLAY.run)return;
  var pts=REPLAY.run.pts;if(pts.length<2)return;
  var at=replayAt(REPLAY.t),m=TERR&&TERR.meta,seen=COVER.img&&!COVER.job?COVER.count:null;
  ctx.save();ctx.lineWidth=2.6;ctx.lineCap="round";
  for(var i=1;i<=at.i;i++){
    var a=w2s(pts[i-1][1],pts[i-1][2]),b=w2s(pts[i][1],pts[i][2]),k=-1;
    if(seen&&m){var ci=Math.round((pts[i][1]-m.x0)/m.cell),cj=Math.round((pts[i][2]-m.y0)/m.cell);k=cj*m.w+ci}
    ctx.strokeStyle=k>=0&&seen[k]?css("--danger"):"#ffb13b";
    ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);ctx.stroke();
  }
  var p=w2s(at.p[1],at.p[2]);
  ctx.fillStyle="#ffb13b";ctx.strokeStyle="rgba(3,16,6,.9)";ctx.lineWidth=2;
  ctx.beginPath();ctx.arc(p[0],p[1],6,0,6.2832);ctx.fill();ctx.stroke();
  ctx.restore();
}

function livePoll(){

  liveApi("GET","api/live").then(function(st){
    if(!LIVE.on)return;
    var was=LIVE.state&&LIVE.state.status;
    LIVE.state=st;
    var moved=false;
    if(st.pos&&(st.status==="live"||st.status==="waiting")){
      var p={x:st.pos[0],y:st.pos[1],z:st.pos[2]},last=LIVE.trail[LIVE.trail.length-1];
      if(!last||Math.hypot(p.x-last.x,p.y-last.y)>0.4){LIVE.trail.push(p);if(LIVE.trail.length>400)LIVE.trail.shift();moved=true;
        if(st.status==="live")recordPoint(p)}
      LIVE.pos=p;LIVE.heading=st.heading;

    if(was!==st.status||!$("livepop").hidden)renderLive();

    if(moved&&LIVE.follow&&st.status==="live"){view.cx=LIVE.pos.x;view.cy=LIVE.pos.y;draw()}
    else present();
    LIVE.timer=setTimeout(livePoll,st.status==="no-game"?1500:st.status==="failed"||st.status==="lost"?3000:350);
  }).catch(function(){LIVE.timer=setTimeout(livePoll,2000)});
}

// Plans before 2026-09-18 kept a lying weapon's alpha as its heading, which
// turned the other way from every other heading. The server converts them
// (missions.py ccw_lying); this does the same for a plan from the browser's own
// storage or a file. Shipped pickups' edits are converted once the level is in.
function ccwLying(p){
  if(!p||p.ccwLying)return;
  var tau=Math.PI*2,flat={WEAPON_ID_GRENADE:1,WEAPON_ID_PROXIMITYMINE:1};
  (p.placements||[]).forEach(function(q){
    var id=q.pickupId||q.model||"";
    if(q.type==="pickup"&&q.gamma&&id&&!/^AMMO_ID_/.test(id)&&!flat[id])q.gamma=+(((-q.gamma)%tau+tau)%tau).toFixed(5);
  });
  var eds=(p.edits||[]).filter(function(e){return e.type==="pickup"&&e.gamma!=null});
  p.ccwLying=true;
  if(!eds.length)return;
  var lv=(p.base&&p.base.level)||(M&&M.base&&M.base.level);
  fetch("data/level"+lv+".json").then(function(r){return r.json()}).then(function(d){
    var by={};(d.objects||[]).forEach(function(o){if(o.ref)by[o.ref]=o});
    eds.forEach(function(e){
      var o=by[e.ref],a=o&&o.orient;
      if(!a||Math.abs(a[1]-1.5708)>=0.05)return;
      var g=+((((2*(o.gamma||0)-e.gamma)%tau)+tau)%tau).toFixed(5),live=edits[e.ref]===e?objByRef(e.ref):null;
      e.gamma=g;if(live)live.gamma=g;

  }).catch(function(){});
}

    view.cx=(b.minX+b.maxX)/2;view.cy=(b.minY+b.maxY)/2;
    groundCv=null;
    renderScene();
    return c.toDataURL("image/png");
  }catch(e){return null}
  finally{
    W=keep.W;H=keep.H;DPR=keep.DPR;ctx=keep.ctx;view.cx=keep.cx;view.cy=keep.cy;view.k=keep.k;sel=keep.sel;tool=keep.tool;
    groundCv=null;
  }
}
// A patch of the map for the 3D view's corner: `metres` across round (cx, cy),
// north up, drawn by the map itself the way the cover is, into px x px
function mapPatch(cx,cy,metres,px){
  if(!LEVEL||!W)return null;
  var c=document.createElement("canvas");c.width=px;c.height=px;
  var keep={W:W,H:H,DPR:DPR,ctx:ctx,cx:view.cx,cy:view.cy,k:view.k,sel:sel,tool:tool};
  try{
    W=px;H=px;DPR=1;ctx=c.getContext("2d");sel=null;tool=null;
    view.cx=cx;view.cy=cy;view.k=px/metres;
    groundCv=null;
    renderScene();
    return c;
  }catch(e){return null}
  finally{
    W=keep.W;H=keep.H;DPR=keep.DPR;ctx=keep.ctx;view.cx=keep.cx;view.cy=keep.cy;view.k=keep.k;sel=keep.sel;tool=keep.tool;
    groundCv=null;
  }
}
var PLAN_KEYS=["placements","nodes","nodeEdits","edits","removeRefs","removals","objectives","ground","brush","sculpt","events","paint"];
function makeStore(serverOk){
  function api(method,url,body){
    return fetch(url,{method:method,headers:body?{"Content-Type":"application/json"}:{},
      body:body?JSON.stringify(body):undefined})
      .then(function(r){return r.json().then(function(j){if(!j.ok)throw new Error(j.error||("HTTP "+r.status));return j})});
  }
  if(serverOk)return {
    local:false,
    library:function(){return api("GET","api/library")},
    get:function(id){return api("GET","api/missions/"+id).then(function(j){return j.mission})},
    create:function(b){return api("POST","api/missions",b).then(function(j){return j.mission})},
    save:function(id,b){return api("PUT","api/missions/"+id,b).then(function(j){return j.mission})},
    duplicate:function(id,name){return api("POST","api/missions/"+id+"/duplicate",{name:name}).then(function(j){return j.mission})},
    remove:function(id,fromGame){return api("DELETE","api/missions/"+id,{removeFromGame:!!fromGame})},
    apply:function(id){return fetch("api/missions/"+id+"/apply",{method:"POST",headers:{"Content-Type":"application/json"},body:"{}"})
      .then(function(r){return r.json()})},
    // the same build, in the background: a job to poll for its stage and log
    applyJob:function(id,body){return fetch("api/missions/"+id+"/applyjob",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body||{})})
      .then(function(r){return r.ok?r.json():null}).catch(function(){return null})},
    job:function(jid){return api("GET","api/jobs/"+jid)},
    uninstall:function(id){return api("POST","api/missions/"+id+"/uninstall",{})},
    // the game's missions past its fourteen: their order, and the ones no mission here holds
    orderSlots:function(order){return api("POST","api/slots/order",{order:order})},
    removeSlot:function(n){return api("POST","api/slots/"+n+"/remove",{})},
    recover:function(ids){return api("POST","api/recover",{ids:ids})},
    trash:function(){return api("GET","api/trash").then(function(j){return j.trash})},
    restore:function(tid){return api("POST","api/trash/"+tid+"/restore",{}).then(function(j){return j.mission})},
    trashDelete:function(tid){return api("DELETE","api/trash/"+tid)},
    trashEmpty:function(){return api("DELETE","api/trash").then(function(j){return j.gone})},
    cleanup:function(id){return api("GET","api/missions/"+id+"/cleanup")},
    check:function(id){return api("GET","api/missions/"+id+"/check")},
    coverUrl:function(m){return m.cover?"api/missions/"+m.id+"/cover.png?v="+(m.updated||0):null}
  };
  // no server (the published page): missions are kept in this browser
  var K="studio:mission:",T="studio:trash:";
  function ls(){try{return window.localStorage}catch(e){return null}}
  function keys(prefix){var s=ls(),out=[];if(!s)return out;for(var i=0;i<s.length;i++){var k=s.key(i);if(k&&k.indexOf(prefix)===0)out.push(k)}return out}
  function read(k){try{return JSON.parse(ls().getItem(k))}catch(e){return null}}
  function write(k,v){var s=ls();if(!s)throw new Error("this browser does not allow saving");s.setItem(k,JSON.stringify(v))}
  function summary(m){
    var p=m.plan||{},n=0;PLAN_KEYS.forEach(function(k){n+=k==="brush"||k==="sculpt"?((p[k]||[]).length?1:0):(p[k]||[]).length});
    return {id:m.id,name:m.name,description:m.description||"",base:m.base,slot:null,created:m.created,updated:m.updated,
      changes:n,guards:(p.placements||[]).filter(function(x){return x.type==="soldier"}).length,
      cover:!!m.coverData,coverData:m.coverData||null,installed:null,upToDate:false};
  }
  function newId(name){return slug(name).slice(0,32)+"-"+Math.random().toString(36).slice(2,8)}
  return {
    local:true,
    library:function(){
      return fetch("data/builtins.json?v="+DATAV).then(function(r){return r.json()}).then(function(b){
        return {builtins:b.missions,groups:b.groups,slots:[],trash:keys(T).length,
          missions:keys(K).map(read).filter(Boolean).map(summary).sort(function(a,c){return (c.updated||0)-(a.updated||0)})};
      });
    },
    get:function(id){return Promise.resolve(read(K+id))},
    create:function(b){
      var t=Date.now(),src=b.from?read(K+b.from):null;
      var m={id:newId(b.name),name:(b.name||"Untitled mission").slice(0,60),description:b.description||(src&&src.description)||"",
        base:src?src.base:{level:+b.base.level,kind:b.base.kind||"copy"},created:t,updated:t,
        plan:src?JSON.parse(JSON.stringify(src.plan)):{placements:[],nodes:[],nodeEdits:[],edits:[],removeRefs:[],removals:[]},
        coverData:src?src.coverData:null};
      write(K+m.id,m);return Promise.resolve(m);
    },
    save:function(id,b){
      var m=read(K+id);if(!m)return Promise.reject(new Error("mission not found"));
      if(b.plan)m.plan=b.plan;if(b.name!=null)m.name=b.name;if(b.description!=null)m.description=b.description;
      if(b.cover)m.coverData=b.cover;m.updated=Date.now();
      write(K+id,m);return Promise.resolve(summary(m));
    },
    duplicate:function(id,name){return this.create({name:name,from:id})},
    remove:function(id){var m=read(K+id);if(m){write(T+id+"--"+Date.now(),m);ls().removeItem(K+id)}return Promise.resolve({ok:true})},
    apply:function(){return Promise.resolve({ok:false,error:"Apply needs the local server (python tools\\serve.py)"})},
    uninstall:function(){return Promise.reject(new Error("needs the local server"))},
    trash:function(){return Promise.resolve(keys(T).map(function(k){var m=read(k);return m&&{trashId:k.slice(T.length),id:m.id,name:m.name,base:m.base,deleted:+k.split("--").pop()}}).filter(Boolean))},
    restore:function(tid){var m=read(T+tid);if(!m)return Promise.reject(new Error("not in the trash"));write(K+m.id,m);ls().removeItem(T+tid);return Promise.resolve(m)},
    trashDelete:function(tid){ls().removeItem(T+tid);return Promise.resolve({ok:true})},
    trashEmpty:function(){var n=keys(T);n.forEach(function(k){ls().removeItem(k)});return Promise.resolve(n.length)},
    cleanup:function(){return Promise.reject(new Error("needs the local server"))},
    check:function(){return Promise.reject(new Error("needs the local server"))},
    coverUrl:function(m){return m.coverData||null}
  };
}

function loadLevel(n,then){
  LV=n;
  Promise.all([
    fetch("data/level"+n+".json?v="+DATAV).then(function(r){return r.json()}),
    fetch("data/graphs"+n+".json?v="+DATAV).then(function(r){return r.json()}).catch(function(){return {}}),
    MODELS?Promise.resolve(MODELS)
          :fetch("data/models.json?v="+DATAV).then(function(r){return r.json()}).catch(function(){return null}),
    CATALOG?Promise.resolve(CATALOG)
          :fetch("data/catalog.json?v="+DATAV).then(function(r){return r.json()}).catch(function(){return null}),
    NAVT?Promise.resolve(NAVT)
        :fetch("data/navtemplates.json?v="+DATAV).then(function(r){return r.json()}).catch(function(){return null}),
    DOORS?Promise.resolve(DOORS)
        :fetch("data/doors.json?v="+DATAV).then(function(r){return r.json()}).catch(function(){return null})
  ]).then(function(res){
    LEVEL=res[0];GRAPHS=res[1];MODELS=res[2]||MODELS;CATALOG=res[3]||CATALOG;NAVT=res[4]||NAVT;DOORS=res[5]||DOORS;
    // an empty map: the terrain and navmesh stay, of the level only its player -
    // none of its objectives, alarm systems or map computer markers
    if(MODE==="empty"){
      LEVEL.objects=LEVEL.objects.filter(function(o){return o.type==="player"});
      LEVEL.objectiveSets=[];LEVEL.alarms=[];LEVEL.hilights={total:0,numbered:0};LEVEL.levelFlow=null;
    }
    surfMemo={};labelPlaces=null;placeMemo={};
    loadTerrain(n).then(function(t){if(t&&LV===n){applyGround();draw();buildLegend()}});
    if(window.MapFX)MapFX.glitch(1);
    hiddenGraphs={};nodeVer++;
    applyEditsToLevel();
    resetHistory();
    BASE_LEVEL=n>14?1:n;   // a custom slot reuses a shipped level's labels
    wallCache=null;
    buildPalette();renderSide();fit(false);draw();
    if(then)then();
  }).catch(function(){
    LEVEL={bounds:{minX:0,maxX:1,minY:0,maxY:1},objects:[],graphs:{}};GRAPHS={};
    draw();$("ro-hov").textContent="level data unavailable";
  });
}

function slug(s){return (s||"mission").toLowerCase().replace(/[^a-z0-9]+/g,"-")
  .replace(/^-|-$/g,"").slice(0,40)||"mission"}
function builtin(level){return ((LIB&&LIB.builtins)||[]).filter(function(b){return b.level===+level})[0]||null}
function envText(b){return b?b.environment.label+" · "+b.environment.when:""}

function gameStatus(m){
  if(!m)return "";

  if(!m.installed)return "Mission "+m.slot+" · not applied";
  var pend=m===M?pendingChanges():null;

// changes not in the game yet, counted against the last Apply (null: never applied)
// is this one of the things the game does not have yet? (for the check list:
// what is already in the game was looked at when it went in)
function pendingObj(o){
  var AS=appliedState();
  if(!AS.ix||!o)return true;
  if(o.own)return !AS.placements[o.uid];
  if(o.ref&&edits[o.ref])return !AS.edits[o.ref];
  if(o.type==="navnode")return !AS.nodes[o.uid];
  return false;
}
function pendingGroup(g){
  var AS=appliedState(),IX=AS.ix;
  if(!IX)return true;
  if(g==="Ground")return groundEdits.some(function(a){return !AS.ground[a.uid]})||(hasBrush()&&!AS.brush)||(hasSculpt()&&!AS.sculpt)||(hasPaint()&&!AS.paint)||
    Object.keys(IX.groundObj).some(function(u){return !groundEdits.some(function(a){return a.uid===u})});
  if(g==="Objectives")return objectives.some(function(o){return !AS.objectives[o.uid]})||(settingsText()&&!AS.settings)||!!IX.src.failOnAlarm!==!!failOnAlarm;
  if(g==="Events")return events.some(function(v){return !AS.events[v.uid]})||Object.keys(edits).some(function(r){return !AS.edits[r]});
  return true;
}
function pendingChanges(){
  var AS=appliedState(),IX=AS.ix;
  if(!IX)return null;
  var total=placements.length+Object.keys(edits).length+removeRefs.length+navNodes.length+Object.keys(nodeEdits).length+
    objectives.length+groundEdits.length+(hasBrush()?1:0)+(hasSculpt()?1:0)+(hasPaint()?1:0)+(settingsText()?1:0)+events.length;
  var gone=Object.keys(IX.placementObj).filter(function(u){return !placements.some(function(q){return q.uid===u})}).length+
    Object.keys(IX.groundObj).filter(function(u){return !groundEdits.some(function(g){return g.uid===u})}).length+
    (IX.settings!=="{}"&&!settingsText()?1:0)+(!!IX.src.failOnAlarm!==!!failOnAlarm?1:0)+
    Object.keys(IX.eventObj).filter(function(u){return !events.some(function(v){return v.uid===u})}).length;
  return total-AS.n+gone;
}

// a plan file or an old save: missions based on a custom slot were built on level 1
function importPlanData(d,name){
  var base=d.base||{level:(+d.level||1)>14?1:(+d.level||1),kind:"copy"};
  var plan={};PLAN_KEYS.forEach(function(k){plan[k]=((d.plan||d)[k])||[]});
  // and its switches: the alarm fails it, the level's objectives taken over, lying weapons' headings
  ["failOnAlarm","objBase","ccwLying"].forEach(function(k){plan[k]=!!(d.plan||d)[k]});

    .then(function(m){return Store.save(m.id,{plan:plan}).then(function(){return m})});

/* ---------------- events ---------------- */
function bind(){
  window.addEventListener("resize",resize);
  cv.addEventListener("mousemove",function(e){
    var r=cv.getBoundingClientRect();
    mouse.x=e.clientX-r.left;mouse.y=e.clientY-r.top;
    var w=s2w(mouse.x,mouse.y);mouse.wx=w[0];mouse.wy=w[1];
    var tz=terrainZ(w[0],w[1]),sl=tz!=null?terrainSlope(w[0],w[1]):null;
    $("ro-cur").textContent=num(w[0])+",  "+num(w[1])+(tz!=null?"   ground "+tz.toFixed(1)+(sl!=null?" · "+Math.round(sl)+"° slope":""):"");
    mouse.inside=true;mouse.alt=e.altKey;
    if(AIPICK){if(mouse.down&&AIPICK.d){AIPICK.d.x1=w[0];AIPICK.d.y1=w[1];mouse.panned=true;present()}cv.style.cursor="crosshair";return}
    if(SKETCH&&!mouse.mid){
      if(mouse.down&&SKETCH.cur){var lp=SKETCH.cur.pts[SKETCH.cur.pts.length-1];if(Math.hypot(w[0]-lp[0],w[1]-lp[1])*view.k>3){SKETCH.cur.pts.push([w[0],w[1]]);present()}mouse.panned=true}
      cv.style.cursor="crosshair";return;
    }
    if(mouse.down&&GPAINT){if(GPAINT.paint)paintMatTo(w[0],w[1]);else paintTo(w[0],w[1]);mouse.panned=true;present();return}
    if(mouse.down&&GDRAW){GDRAW.x1=w[0];GDRAW.y1=w[1];mouse.panned=true;present();return}
    if(mouse.down&&mouse.garea){
      // the outline follows the pointer; the ground catches up when it is let go
      var mg=mouse.garea;mg.a.x+=w[0]-mg.last[0];mg.a.y+=w[1]-mg.last[1];mg.last=[w[0],w[1]];
      mouse.panned=true;present();return;
    }
    if(mouse.down&&mouse.box){mouse.box.x1=mouse.x;mouse.box.y1=mouse.y;mouse.panned=true;present();return}
    if(mouse.down&&mouse.drag&&mouse.drag.group){
      moveGroup(w[0]-mouse.drag.last[0],w[1]-mouse.drag.last[1]);
      mouse.drag.last=[w[0],w[1]];mouse.panned=true;renderSide();draw();return;
    }
    if(mouse.down&&mouse.drag){
      mouse.panned=true;
      if(mouse.drag.type==="graphnode"){
        // moving a shipped node: keep it on the floor it was on
        var gn=mouse.drag,o={x:w[0],y:w[1],z:gn.z};settleZ(o);
        gn.x=o.x;gn.y=o.y;gn.z=o.z;
        setNodeEdit(gn.graph,gn.id,{graph:gn.graph,id:gn.id,action:"move",x:+o.x.toFixed(2),y:+o.y.toFixed(2),z:+o.z.toFixed(2)});
        if(sel&&sel.type==="graphnode"){sel.x=o.x;sel.y=o.y;sel.z=o.z}
      }else if(!mouse.drag.own&&mouse.drag.ref){
        // moved on the map: the height a close-up set no longer holds; what rests on it comes along
        var rs=ridersOf(mouse.drag,true),mdx=+w[0].toFixed(2)-mouse.drag.x,mdy=+w[1].toFixed(2)-mouse.drag.y;
        editShipped(mouse.drag,{x:+w[0].toFixed(2),y:+w[1].toFixed(2),z:mouse.drag.z,exact:false});
        carry(rs,mdx,mdy,0);
      }else if(mouse.drag.type==="camera"){
        var cmt=camMount(w[0],w[1],mouse.drag.turn||0),cd=mouse.drag;
        cd.x=+cmt.x.toFixed(3);cd.y=+cmt.y.toFixed(3);cd.z=+cmt.z.toFixed(3);cd.gamma=cmt.gamma;cd.mount=cmt.on||"";
      }else{
        var rs2=mouse.drag.type==="navnode"?[]:ridersOf(mouse.drag,true);
        carry(rs2,w[0]-mouse.drag.x,w[1]-mouse.drag.y,0);
        mouse.drag.x=w[0];mouse.drag.y=w[1];delete mouse.drag.exact;
        syncDoorsOf(mouse.drag);        // a building's doors and lift come along
        if(mouse.drag.type==="navnode"){settleZ(mouse.drag);rehome(mouse.drag)}
      }
      touch();renderSide();draw();return;
    }
    if(mouse.down){
      view.cx-=e.movementX/view.k;view.cy+=e.movementY/view.k;
      mouse.panned=true;cv.classList.add("panning");draw();return;
    }
    var nd=pickNode(mouse.x,mouse.y)||pickGraphNode(mouse.x,mouse.y);
    if(navTool())draw();else if(tool||measure.on)present();
    var key=function(n){return n?(n.graph||"")+":"+n.id:""};
    if(key(nd)!==key(mouse.hoverNode)){mouse.hoverNode=nd;draw()}
    var h=nd?null:pick(mouse.x,mouse.y);
    var nodeText=nd?(nd.plan?stopLabel(nd.id):"node "+nd.id+(nd.graph?" · graph "+nd.graph:"")+(nd.c?" · "+nd.c.replace("NODECRITERIA_","").toLowerCase():"")):"";
    var inB=(!tool&&LEVEL)?buildingUnder(mouse.wx,mouse.wy):null;
    if(inB!==mouse.inBuilding){mouse.inBuilding=inB;if(h===mouse.hover)draw()}
    mapHover(nd?null:h);
    if(h!==mouse.hover){
      mouse.hover=h;
      $("ro-hov").textContent=nd?nodeText:h
        ?(displayName(h)+"   "+num(h.x)+", "+num(h.y)+", "+num(h.z))
        :"-";
      draw();
    }else if(nd){$("ro-hov").textContent=nodeText}
    // a hand over anything you can grab or pick, the crosshair over open ground
    cv.style.cursor=(nd&&!patrolMode&&isSelNode(nd.graph,nd.id))?"move":"";
    if(groundTool()){
      var gs=groundSel();
      cv.style.cursor=GMODE.mode!=="brush"&&GMODE.mode!=="paint"&&gs&&inArea(gs,w[0],w[1],Math.max(1,6/view.k))?"move":"crosshair";
      if(GMODE.mode==="brush"||GMODE.mode==="paint")present();       // the brush follows the pointer
    }
    cv.classList.toggle("over",!!(h||nd)&&!tool&&!mouse.down);
  });
  cv.addEventListener("mousedown",function(e){
    // the middle button pans, whatever tool is in hand
    if(e.button===1){e.preventDefault();mouse.down=true;mouse.mid=true;mouse.panned=false;mouse.drag=null;mapHover(null);return}
    if(e.button!==0)return;
    mouse.down=true;mouse.panned=false;mouse.drag=null;mapHover(null);
    lastChangeAt=0;         // a drag is one undo step, separate from what came before
    if(AIPICK){AIPICK.d={x0:mouse.wx,y0:mouse.wy,x1:mouse.wx,y1:mouse.wy,sx:mouse.x,sy:mouse.y};return}
    if(SKETCH){SKETCH.cur={c:SKETCH.color,pts:[[mouse.wx,mouse.wy]]};SKETCH.strokes.push(SKETCH.cur);present();return}
    if(measure.on)return;
    if(groundTool()&&canEdit()){
      if(GMODE.mode==="paint"){
        if(!materials().length){toast("This level's ground materials are not loaded");return}
        GPAINT={last:[mouse.wx,mouse.wy],n:1,paint:true};paintMatAt(mouse.wx,mouse.wy);present();return;
      }
      if(GMODE.mode==="brush"){
        // a stroke: one undo step; the relief catches up when it ends
        if(TERR&&!TERR.h0)TERR.h0=TERR.h.slice(0);
        if(TERR&&!TERR.ha)applyGround();
        GPAINT={last:[mouse.wx,mouse.wy],n:1,seed:(Math.random()*65535)|0,target:terrainZ(mouse.wx,mouse.wy)};
        paintAt(mouse.wx,mouse.wy);present();return;
      }
      // on an area: pick it up; anywhere else: start drawing one
      var ga=groundSel();
      if(ga&&inArea(ga,mouse.wx,mouse.wy,Math.max(1,6/view.k))){mouse.garea={a:ga,last:[mouse.wx,mouse.wy]};present();return}
      if(GSEL){GSEL=null;renderGround();renderList();buildGroundBar()}
      GDRAW={x0:mouse.wx,y0:mouse.wy,x1:mouse.wx,y1:mouse.wy,sx:mouse.x,sy:mouse.y};
      return;
    }
    // Shift: a box (drag) or add/drop one (click)
    if(e.shiftKey&&!tool&&!patrolMode){mouse.box={x0:mouse.x,y0:mouse.y,x1:mouse.x,y1:mouse.y,shipped:e.altKey};return}
    if(!tool&&!patrolMode){
      // a shipped node moves only once it is selected, so a stray drag across
      // the map never edits the navmesh by accident
      var gn=pickGraphNode(mouse.x,mouse.y);
      if(gn&&isSelNode(gn.graph,gn.id)&&graphEditable(gn.graph)&&M&&!READONLY){mouse.drag=gn;return}
      if(gn)return;
    }
    var h=(!navTool()&&!patrolMode&&pickNavNode(mouse.x,mouse.y))||pick(mouse.x,mouse.y);
    if(h&&inMulti(h)&&!tool&&!patrolMode&&M&&!READONLY){mouse.drag={group:true,last:[mouse.wx,mouse.wy]};return}
    // your own things drag straight away; shipped ones only once selected, so a
    // stray drag across the map never moves part of the level
    mouse.drag=(h&&!patrolMode&&M&&!READONLY&&(h.own||(h===sel&&canMove(h))))?h:null;
  });
  window.addEventListener("mouseup",function(){
    if(mouse.mid){mouse.mid=false;mouse.down=false;cv.classList.remove("panning");return}
    if(SKETCH&&SKETCH.cur){SKETCH.cur=null;mouse.down=false;present();return}
    if(AIPICK&&AIPICK.d){
      var ad=AIPICK.d,aclick=Math.hypot(mouse.x-ad.sx,mouse.y-ad.sy)<6;AIPICK.d=null;mouse.down=false;
      var tag=aiTagOf(ad,aclick);
      if(tag.kind==="area"&&(tag.x1-tag.x0<2||tag.y1-tag.y0<2)){toast("Too small: drag an area at least 2 m across, or click");present();return}
      aiPickEnd(tag);return;
    }
    if(GPAINT){GPAINT=null;mouse.down=false;areaChanged();return}
    if(GDRAW){
      var gd=GDRAW,click=Math.hypot(mouse.x-gd.sx,mouse.y-gd.sy)<5;GDRAW=null;mouse.down=false;
      if(GMODE.mode==="ramp"){
        if(click||!addRamp(gd.x0,gd.y0,gd.x1,gd.y1)){toast("Drag from the bottom of the slope to the top");present()}
        return;
      }
      // a click is a 12 m patch; a drag is the area drawn
      if(click)addArea(gd.x0-6,gd.y0-6,gd.x0+6,gd.y0+6);
      else if(!addArea(gd.x0,gd.y0,gd.x1,gd.y1)){toast("Too small: draw an area at least 1.5 m across");present()}
      return;
    }
    if(mouse.garea){
      mouse.garea=null;mouse.down=false;
      if(mouse.panned)areaChanged();
      return;
    }
    if(mouse.box){
      var bx=mouse.box;mouse.box=null;mouse.down=false;
      if(Math.hypot(bx.x1-bx.x0,bx.y1-bx.y0)<4){
        var hit=pickNavNode(mouse.x,mouse.y)||pick(mouse.x,mouse.y);
        if(hit){toggleInGroup(hit);renderSide();draw()}
      }else boxSelect(bx.x0,bx.y0,bx.x1,bx.y1,true,bx.shipped);
      present();return;
    }
    if(mouse.drag&&mouse.drag.group){
      if(mouse.panned)settleGroup(multi.slice());
      mouse.down=false;mouse.drag=null;cv.classList.remove("panning");return;
    }
    if(mouse.down&&!mouse.panned){
      var nd=pickNode(mouse.x,mouse.y);
      if(patrolMode&&sel&&sel.type==="soldier"&&nd){
        setPatrol(sel,(sel.patrol||[]).concat([nd.id]));renderSide();draw();
      }else if(OBJPICK){objectivePick(mouse.x,mouse.y)}
      else if(EVPICK){eventPick(mouse.x,mouse.y)}
      else if(DOORPICK){doorPick(mouse.x,mouse.y)}
      else if(measure.on){measureClick(mouse.wx,mouse.wy)}
      else if(tool){addPlacement(mouse.wx,mouse.wy)}
      else{
        sel=pickNavNode(mouse.x,mouse.y)||pickGraphNode(mouse.x,mouse.y)||pick(mouse.x,mouse.y);
        multi=[];
        renderSide();draw();
      }
    }
    if(mouse.drag&&mouse.panned&&mouse.drag.type==="graphnode")renderNavSection();
    else if(mouse.drag&&mouse.panned&&mouse.drag.type!=="navnode")settle(mouse.drag,true);
    mouse.down=false;mouse.drag=null;cv.classList.remove("panning");
  });
  cv.addEventListener("wheel",function(e){
    mapHover(null);
    e.preventDefault();zoomAt(e.deltaY<0?1.14:1/1.14,mouse.x,mouse.y);
  },{passive:false});
  cv.addEventListener("mouseleave",function(){
    mouse.hover=null;mouse.hoverNode=null;mouse.inside=false;mouse.inBuilding=null;$("ro-hov").textContent="-";mapHover(null);draw();
  });
  document.addEventListener("keydown",onKey);
  $("zin").addEventListener("click",function(){zoomAt(1.3,W/2,H/2)});
  $("zout").addEventListener("click",function(){zoomAt(1/1.3,W/2,H/2)});
  $("tab-inv").addEventListener("click",function(){showPanel(PANEL==="inv"?"":"inv")});
  $("tab-nav").addEventListener("click",function(){showPanel(PANEL==="nav"?"":"nav")});
  $("tab-sec").addEventListener("click",function(){showPanel(PANEL==="sec"?"":"sec")});
  $("tab-ev").addEventListener("click",function(){showPanel(PANEL==="ev"?"":"ev")});
  $("tab-obj").addEventListener("click",function(){showPanel(PANEL==="obj"?"":"obj")});
  bindLegend();
  var searchT=null;
  $("invq").addEventListener("input",function(){
    clearTimeout(searchT);searchT=setTimeout(buildPalette,120);
  });
  $("mname").addEventListener("input",function(){if(!M||READONLY)return;MISSION=$("mname").value;touch()});
  bindMenus();

// One small menu model drives both the Mission menu and the right-click menu:
// items are {label, kbd, act, disabled, danger, sub:[...]}, "-" for a separator,
// {head:"..."} for a group title.
function renderMenu(host,items,close){
  host.innerHTML="";
  items.forEach(function(it){
    if(!it)return;
    if(it==="-"){var s=document.createElement("div");s.className="sep";host.appendChild(s);return}
    if(it.head){var h=document.createElement("div");h.className="mh";h.textContent=it.head;host.appendChild(h);return}
    var b=document.createElement("button");b.type="button";b.className="mi"+(it.danger?" danger":"");
    b.setAttribute("role","menuitem");
    b.appendChild(document.createTextNode(it.label));
    if(it.title)b.title=it.title;
    if(it.disabled)b.disabled=true;
    if(it.sub&&it.sub.length){
      var wrap=document.createElement("div");wrap.className="has-sub";
      var ar=document.createElement("span");ar.className="arrow";ar.textContent="›";b.appendChild(ar);
      wrap.appendChild(b);
      var sm=document.createElement("div");sm.className="menu";sm.setAttribute("role","menu");
      renderMenu(sm,it.sub,close);wrap.appendChild(sm);
      host.appendChild(wrap);
      return;
    }
    if(it.kbd){var k=document.createElement("span");k.className="k";k.textContent=it.kbd;b.appendChild(k)}
    b.addEventListener("click",function(e){
      e.stopPropagation();
      if(it.disabled)return;
      close();
      it.act&&it.act();
    });
    host.appendChild(b);
  });
}

function importPlan(file){
  var r=new FileReader();
  r.onload=function(){
    try{
      var d=JSON.parse(r.result);
      if(d&&d.format==="igi-mission-studio-pack"&&Array.isArray(d.missions)){
        var items=d.missions.slice(),n=0,cp=d.campaign&&d.campaign.name?d.campaign:null,k=0;
        (function next(){
          if(!items.length){
            showLibrary();
            if(cp)sheet("Campaign: "+cp.name,(cp.briefing?'<p style="white-space:pre-wrap;margin:0 0 10px">'+esc(cp.briefing)+'</p>':'')+
              '<p class="hint">'+n+' mission'+(n===1?'':'s')+' added to your library, numbered in the campaign\'s order.</p>');
            else toast(n+" mission"+(n===1?"":"s")+" added from the pack");
            return;
          }
          var it=items.shift();k++;
          importPlanData(it,cp?cp.name+" "+k+": "+it.name:it.name).then(function(){n++}).catch(function(e){toast("Could not add “"+(it.name||"a mission")+"”: "+e.message)}).then(next);
        })();
        return;
      }
      if(!d||!(d.plan||Array.isArray(d.placements)))throw new Error("not a Project IGI Studio mission file");
      importPlanData(d,d.name).then(function(m){openMission(m.id);toast("Imported “"+m.name+"”")})
        .catch(function(e){toast("Could not import: "+e.message)});
    }catch(e){toast("Could not import: "+e.message)}
  };
  r.readAsText(file);
}

function quickAdd(sx,sy,wx,wy){
  closeMenus();
  var stage=cv.parentElement,box=document.createElement("div");
  box.className="quickadd";box.id="quickadd";
  box.innerHTML='<input placeholder="Building, object, weapon or enemy…" aria-label="What to add"><div class="res" role="listbox"></div>';
  stage.appendChild(box);
  var r=stage.getBoundingClientRect();
  box.style.left=Math.max(4,Math.min(sx,r.width-304))+"px";box.style.top=Math.max(4,Math.min(sy,r.height-360))+"px";
  var input=box.querySelector("input"),res=box.querySelector(".res"),hits=[],cur=0;
  var pool=[];
  ((CATALOG&&CATALOG.structures)||[]).forEach(function(s){pool.push({t:{group:"obj",id:s.model,label:s.name},name:s.name,meta:s.model,thumb:function(){return thumbFor(s.model,s.kind,s.raw)},k:s.name+" "+s.raw+" "+s.model})});
  ((CATALOG&&CATALOG.weapons)||[]).forEach(function(w){pool.push({t:{group:"pickup",id:w.id,label:w.label,count:w.count},name:w.label,meta:w.group,thumb:function(){return markerSwatch("pickup",PlanIcons.weaponIcon(w.id),css("--pickup"),20)},k:w.label+" "+w.id})});
  ((CATALOG&&CATALOG.enemies)||[]).forEach(function(e){pool.push({t:{group:"ai",id:e.id,label:e.label,model:(e.models||[])[0],weapon:(e.weapons||[])[0]},name:e.label,meta:"enemy",thumb:function(){return markerSwatch("soldier",PlanIcons.soldierIcon(e.id),css("--enemy"),20)},k:e.label+" "+e.id})});
  function paint(){
    var q=input.value.trim().toLowerCase();
    hits=pool.filter(function(p){return !q||p.k.toLowerCase().indexOf(q)>=0}).slice(0,14);
    cur=Math.min(cur,Math.max(0,hits.length-1));
    res.innerHTML="";
    hits.forEach(function(p,i){
      var b=document.createElement("button");b.type="button";b.className="item";b.setAttribute("role","option");
      b.setAttribute("aria-selected",String(i===cur));
      var th=document.createElement("span");th.className="thumb";th.appendChild(p.thumb());
      var tx=document.createElement("span");tx.className="t";tx.innerHTML="<b>"+esc(p.name)+"</b><span>"+esc(p.meta)+"</span>";
      b.appendChild(th);b.appendChild(tx);
      b.addEventListener("click",function(){choose(i)});
      res.appendChild(b);
    });
    if(!hits.length)res.innerHTML='<p class="hint" style="margin:6px">Nothing matches.</p>';
  }
  function choose(i){var p=hits[i];if(!p)return;box.remove();placeAt(p.t,wx,wy)}
  input.addEventListener("input",function(){cur=0;paint()});
  input.addEventListener("keydown",function(e){
    if(e.key==="ArrowDown"){cur=Math.min(hits.length-1,cur+1);paint();e.preventDefault()}
    else if(e.key==="ArrowUp"){cur=Math.max(0,cur-1);paint();e.preventDefault()}
    else if(e.key==="Enter"){choose(cur);e.preventDefault()}
    else if(e.key==="Escape"){box.remove()}
  });
  paint();input.focus();
}

// A submenu opens when you mean it: a moment's hover, not the instant the menu
// lands under the pointer. It is also kept on screen - the enemy list is long.
function armSubmenus(root){
  root.querySelectorAll(".has-sub").forEach(function(it){
    var sub=it.querySelector(".menu"),t=0;
    if(!sub)return;
    function open(){
      it.classList.add("open");
      var r=it.getBoundingClientRect(),avail=window.innerHeight-r.top-12;
      sub.style.maxHeight=Math.max(220,Math.min(window.innerHeight-24,avail))+"px";
      var h=sub.offsetHeight;
      if(r.top+h>window.innerHeight-12)sub.style.top=Math.min(0,window.innerHeight-12-h-r.top)+"px";
      else sub.style.top="-5px";
    }
    it.addEventListener("mouseenter",function(){clearTimeout(t);t=setTimeout(open,160)});
    it.addEventListener("mouseleave",function(){clearTimeout(t);it.classList.remove("open")});
    it.addEventListener("focusin",open);
    it.addEventListener("click",function(e){if(e.target===it||e.target.parentNode===it){clearTimeout(t);open()}});
  });
}

function rotateBy(deg){
  if(!tool&&multi.length>1)return rotateGroup(deg);
  if(tool&&!navTool()){
    var g=tool.gamma!=null?tool.gamma:(tool.group==="ai"?Math.PI:0);
    tool.gamma=+(((g+deg*Math.PI/180)%(Math.PI*2)+Math.PI*2)%(Math.PI*2)).toFixed(5);
    renderPlaceBar();present();return true;
  }
  if(sel&&canMove(sel)&&sel.type!=="navnode"&&sel.type!=="graphnode"){
    setProp(sel,{gamma:+((((sel.gamma||0)+deg*Math.PI/180)%(Math.PI*2)+Math.PI*2)%(Math.PI*2)).toFixed(5)});
    renderSide();draw();return true;
  }
  return false;
}
function nudge(dx,dy){
  if(!sel)return false;
  if(sel.type==="graphnode"){
    if(!graphEditable(sel.graph))return false;
    var o={x:sel.x+dx,y:sel.y+dy,z:sel.z};settleZ(o);
    sel.x=o.x;sel.y=o.y;sel.z=o.z;
    setNodeEdit(sel.graph,sel.id,{graph:sel.graph,id:sel.id,action:"move",x:+o.x.toFixed(2),y:+o.y.toFixed(2),z:+o.z.toFixed(2)});
  }else if(sel.type==="navnode"){
    sel.x+=dx;sel.y+=dy;settleZ(sel);rehome(sel);
  }else if(canMove(sel)){
    setProp(sel,{x:+(sel.x+dx).toFixed(2),y:+(sel.y+dy).toFixed(2),z:sel.z});
    settleSoon(sel);
  }else return false;
  touch();renderSide();draw();
  return true;
}
function changeFloor(dir){
  if(!sel||!(canMove(sel)||sel.type==="navnode"||sel.type==="graphnode"))return false;
  var lv=(sel.type==="graphnode"||sel.type==="navnode")?nearbyLevels(sel.x,sel.y):standOptions(sel);
  if(!lv.length)return false;
  var cur=0,bd=1e9;
  lv.forEach(function(l,i){var d=Math.abs(l.z-sel.z);if(d<bd){bd=d;cur=i}});
  var nx=Math.max(0,Math.min(lv.length-1,cur+dir));
  if(nx===cur&&bd<1.2)return false;
  var z=lv[nx].z;
  if(sel.type==="graphnode"){sel.z=z;setNodeEdit(sel.graph,sel.id,{graph:sel.graph,id:sel.id,action:"move",x:sel.x,y:sel.y,z:z})}
  else if(sel.type==="navnode"){sel.z=z;rehome(sel)}
  else setProp(sel,{x:sel.x,y:sel.y,z:z});
  touch();renderSide();draw();
  return true;
}
function duplicateSel(){
  if(sel&&!canEdit())return false;
  if(!sel||sel.type==="graphnode"||sel.type==="navnode")return false;
  var c;
  if(sel.own){c=JSON.parse(JSON.stringify(sel));}
  else{
    // a shipped object duplicates into a placement of the same model
    if(sel.type==="soldier")c={type:"soldier",kind:"soldier",ai:sel.ai,model:sel.model,weapon:sel.weapon,
      name:displayName(sel),graph:sel.graph!=null?String(sel.graph):graphOf(null),patrol:(sel.patrol||[]).slice()};
    else if(sel.type==="pickup")c={type:"pickup",kind:"pickup",pickupId:sel.model,name:displayName(sel)};
    else if(sel.model)c={type:"building",kind:"object",model:sel.model,name:displayName(sel)};
    else return false;
    c.z=sel.z;c.gamma=sel.gamma||0;
  }
  c.uid=uid();c.own=true;c.x=sel.x+2;c.y=sel.y-2;
  placements.push(c);sel=c;touch();renderSide();draw();
  settle(c,true);
  return true;
}
function panBy(dx,dy){view.cx+=dx/view.k;view.cy+=dy/view.k;draw()}
function onKey(e){
  var k=e.key,ctrl=e.ctrlKey||e.metaKey;
  // the close-up has the keys while it is open (undo and redo still work)
  if(window.View3D&&View3D.isOpen()&&!(ctrl&&/^[zZyYsS]$/.test(k)))return;
  if(ctrl&&(k==="s"||k==="S")){e.preventDefault();saveNow();return}
  if(/^(INPUT|SELECT|TEXTAREA)$/.test(e.target.tagName))return;
  if(!$("sheet").hidden&&k!=="Escape")return;
  if(ctrl&&!e.shiftKey&&(k==="z"||k==="Z")){e.preventDefault();undo();return}
  if(ctrl&&((k==="y"||k==="Y")||(e.shiftKey&&(k==="z"||k==="Z")))){e.preventDefault();redo();return}
  if(ctrl&&(k==="d"||k==="D")){e.preventDefault();if(!duplicateGroup())duplicateSel();return}
  if(ctrl&&(k==="c"||k==="C")){if(String(window.getSelection&&window.getSelection()||""))return;e.preventDefault();copyGroup();return}
  if(ctrl&&(k==="v"||k==="V")){e.preventDefault();pasteClipboard();return}
  if(ctrl&&(k==="a"||k==="A")){
    e.preventDefault();
    multi=placements.concat(navNodes);sel=multi[multi.length-1]||null;if(multi.length<2)multi=[];
    renderSide();draw();return;
  }
  if(k.indexOf("Arrow")===0){
    var dir={ArrowUp:[0,1],ArrowDown:[0,-1],ArrowLeft:[-1,0],ArrowRight:[1,0]}[k];
    e.preventDefault();
    if(ctrl||!sel||tool){panBy(dir[0]*80*(e.shiftKey?4:1),dir[1]*80*(e.shiftKey?4:1));return}
    var step=e.shiftKey?5:e.altKey?0.1:0.5;
    if(multi.length>1){moveGroup(dir[0]*step,dir[1]*step);settleGroup(multi.slice());renderSide();draw();return}
    nudge(dir[0]*step,dir[1]*step);
    return;
  }
  if(ctrl||e.altKey&&k!=="Alt")return;
  switch(k){
    case "Delete":case "Backspace":if(!deleteGroup())removeSel();e.preventDefault();return;
    case "Escape":
      if(!$("sheet").hidden){$("sheet").hidden=true;return}
      if(AIPICK){aiPickEnd(null);return}
      if(SKETCH){sketchEnd(false);return}
      if(FLY.el&&!FLY.el.hidden){flyClose();return}
      if(OBJPICK){OBJPICK=null;$("banner").hidden=true;renderObjectives();return}
      if(EVPICK){EVPICK=null;$("banner").hidden=true;renderEvents();return}
      if(DOORPICK){DOORPICK=null;$("banner").hidden=true;renderSide();return}
      if(!$("legendpop").hidden){closeLegend();return}
      if(!$("livepop").hidden){toggleLivePanel();return}
      if(!$("sightpop").hidden){toggleSightPanel();return}
      if(MAPCOMP){toggleMapComputer();return}
      if(!$("groundpop").hidden){toggleGroundPanel();return}
      if(measure.on){measureOff();return}
      if(tool||patrolMode){tool=null;patrolMode=false}else{sel=null;multi=[]}
      document.querySelectorAll("#inv [aria-pressed],[data-tool]").forEach(function(c){c.setAttribute("aria-pressed","false")});
      renderNavSection();renderSide();buildToggles();renderPlaceBar();draw();return;
    case "r":case "R":if(rotateBy(e.shiftKey?-15:15))e.preventDefault();return;
    case "t":case "T":if(rotateBy(90))e.preventDefault();return;
    case "c":case "C":if(tool){tool.chain=null;renderPlaceBar();present()}return;
    case "a":case "A":selectTool(navTool()?null:{group:"nav",id:"NAVNODE",label:"Patrol node"},null);return;
    case "v":case "V":if(sel&&sel.x!=null&&sel.type!=="navnode"&&sel.type!=="graphnode")open3d(sel);return;
    case "f":case "F":fit(false);return;
    case "0":fit(true);return;
    case "+":case "=":zoomAt(1.25,W/2,H/2);return;
    case "-":case "_":zoomAt(1/1.25,W/2,H/2);return;
    case "n":case "N":toggleLayer("nodes");saveLayers();buildToggles();buildLegend();renderNavSection();draw();return;
    case "b":case "B":toggleLayer("buildable");saveLayers();buildToggles();buildLegend();draw();return;
    case "h":case "H":case "Home":jumpToSpawn();return;
    case "z":case "Z":zoomToSelection();return;
    case "j":case "J":nextChange();return;
    case "m":case "M":if(measure.on)measureOff();else measureOn();return;
    case "l":case "L":layers.labels=!layers.labels;saveLayers();buildToggles();draw();return;
    case " ":e.preventDefault();setAnim(!layers.anim);buildToggles();draw();return;
    case "[":changeFloor(-1);return;
    case "]":changeFloor(1);return;
    case "p":case "P":
      if(sel&&sel.type==="soldier"){patrolMode=!patrolMode;renderSide();draw()}
      return;
    case "g":case "G":
      if(multi.length>1){dropGroup();return}
      if(sel&&!sel.own&&canMove(sel)){editShipped(sel,{settle:true});touch();renderSide();toast("Will rest on the ground when applied")}
      else if(sel&&sel.own&&canMove(sel)){
        if(SRV)settle(sel,false);
        else{var gz=groundAt(sel.x,sel.y);if(gz!=null){setProp(sel,{z:+gz.toFixed(3)});renderSide();draw()}}
      }
      return;
    case "?":showShortcuts();return;
  }
}

/* ---------------- undo / redo ---------------- */
// Snapshots of the plan, taken as it changes. Changes less than half a second
// apart (a drag, a run of arrow presses) collapse into one step.
var undoStack=[],redoStack=[],lastState=null,lastChangeAt=0,restoring=false;
function planState(){
  return JSON.stringify({placements:placements,navNodes:navNodes,nodeEdits:nodeEdits,textures:MTEX,
    edits:edits,removeRefs:removeRefs,removals:removals,objectives:objectives,failOnAlarm:failOnAlarm,settings:MSET,events:events,
    ground:groundEdits.map(function(a){var c=Object.assign({},a);delete c._seed;return c}),brush:groundBrush,paint:groundPaint});
}
function resetHistory(){undoStack=[];redoStack=[];lastState=planState();lastChangeAt=0}
function recordChange(){
  if(restoring)return;
  var now=Date.now(),cur=planState();
  if(lastState===null){lastState=cur;return}
  if(cur===lastState)return;
  if(now-lastChangeAt>500){
    undoStack.push(lastState);
    if(undoStack.length>200)undoStack.shift();
  }
  redoStack=[];
  lastState=cur;lastChangeAt=now;
}
function restoreState(json){
  var d=JSON.parse(json);
  restoring=true;
  try{

    placements=d.placements||[];navNodes=d.navNodes||[];nodeEdits=d.nodeEdits||{};

// a stroke's turning points (Ramer-Douglas-Peucker, to within eps metres)
function simplifyPts(pts,eps){
  if(pts.length<3)return pts.map(function(q){return [+q[0].toFixed(1),+q[1].toFixed(1)]});
  var keep=new Uint8Array(pts.length);keep[0]=keep[pts.length-1]=1;
  (function rdp(a,b){
    var ax=pts[a][0],ay=pts[a][1],bx=pts[b][0],by=pts[b][1],L=Math.hypot(bx-ax,by-ay)||1e-9,md=0,mi=-1;

  })(0,pts.length-1);

function sketchEnd(ok){

function captureMap(){
  if(!W||!H)return null;
  present();
  var k=Math.min(1,1400/W),cw=Math.round(W*k),ch=Math.round(H*k),c=document.createElement("canvas");
  c.width=cw;c.height=ch;

  var a=s2w(0,0),b=s2w(W,H),B={x0:+a[0].toFixed(1),x1:+b[0].toFixed(1),y0:+b[1].toFixed(1),y1:+a[1].toFixed(1)};
  var span=Math.max(B.x1-B.x0,B.y1-B.y0),G=[5,10,20,25,50,100,200,250,500,1000].filter(function(v){return span/v<=12})[0]||2000;
  function X(x){return (x-B.x0)/(B.x1-B.x0)*cw}
  function Y(y){return (B.y1-y)/(B.y1-B.y0)*ch}
  g.save();g.font="600 12px 'IBM Plex Mono',monospace";g.textBaseline="top";
  function lab(t,x,y){var w=g.measureText(t).width+6;g.fillStyle="rgba(0,0,0,.72)";g.fillRect(x,y,w,15);g.fillStyle="#fff";g.fillText(t,x+3,y+1)}
  g.strokeStyle="rgba(255,255,255,.42)";g.lineWidth=1;
  for(var x=Math.ceil(B.x0/G)*G;x<=B.x1;x+=G){var sx=Math.round(X(x))+0.5;g.beginPath();g.moveTo(sx,0);g.lineTo(sx,ch);g.stroke()}
  for(var y=Math.ceil(B.y0/G)*G;y<=B.y1;y+=G){var sy=Math.round(Y(y))+0.5;g.beginPath();g.moveTo(0,sy);g.lineTo(cw,sy);g.stroke()}
  for(x=Math.ceil(B.x0/G)*G;x<=B.x1;x+=G)lab("x "+Math.round(x),X(x)+2,2);
  for(y=Math.ceil(B.y0/G)*G;y<=B.y1;y+=G)lab("y "+Math.round(y),2,Y(y)+2);

/* ---------------- placing: rotation, fence chains, the placement bar ---------------- */
// Fence and wall panels are straight segments. With one in hand, each click
// adds a panel that starts where the last one ended and points at the cursor
// (in 15° steps; hold Alt for any angle). A new run snaps its start onto the
// end of an existing fence or wall nearby.
// A fence or wall panel as a segment in its own space, end to end as the game
// draws it: from the render mesh once the meshes are in. The sizes come from
// the collision box, which is longer (16.31 m for a chain-link panel whose
// posts stand 15.84 m apart, 20.39 m for a 20 m wall), and panels laid end to
// end by it left a gap of about half a metre at every joint in the game (found
// 2026-09-19). Now a fence's end post stands where the next panel's first post
// does, and walls meet edge to edge.
function segInfo(model){
  var s=MODELS&&MODELS.sizes&&MODELS.sizes[model];
  if(!s||!s.w||!s.d)return null;
  var lo=Math.min(s.w,s.d),hi=Math.max(s.w,s.d);
  if(lo>1.2||hi<3*lo||hi<2)return null;
  var mb=window.MeshSprites&&MeshSprites.ready()&&MeshSprites.has(model)?MeshSprites.bounds(model):null;
  if(mb){
    var ex=mb.maxx-mb.minx,ey=mb.maxy-mb.miny,thin=Math.min(ex,ey);
    if(Math.max(ex,ey)>=2&&thin<=1.2){
      var e=thin<0.2?thin/2:0,mx=(mb.minx+mb.maxx)/2,my=(mb.miny+mb.maxy)/2;   // posts: overlap them
      return ex>=ey?{a:[mb.minx+e,my],b:[mb.maxx-e,my],off:0,len:ex-2*e,mesh:true}
                   :{a:[mx,mb.miny+e],b:[mx,mb.maxy-e],off:-Math.PI/2,len:ey-2*e,mesh:true};
    }
  }
  var cx=s.cx||0,cy=s.cy||0;
  return s.w>=s.d?{a:[cx-s.w/2,cy],b:[cx+s.w/2,cy],off:0,len:hi}
                 :{a:[cx,cy-s.d/2],b:[cx,cy+s.d/2],off:-Math.PI/2,len:hi};
}
function rot2(p,g){var c=Math.cos(g),s=Math.sin(g);return [p[0]*c-p[1]*s,p[0]*s+p[1]*c]}
// Joints of your fence and wall runs with a gap between them: a panel whose
// start is 0.15 to 1 m from where another ends, in line with it.
function fenceGaps(){
  var segs=[];
  placements.forEach(function(p){
    if(p.type!=="building")return;
    var si=segInfo(p.model);if(!si||!si.mesh)return;
    var a=rot2(si.a,p.gamma||0),b=rot2(si.b,p.gamma||0);
    segs.push({o:p,a:[p.x+a[0],p.y+a[1]],b:[p.x+b[0],p.y+b[1]],dir:Math.atan2(b[1]-a[1],b[0]-a[0])});
  });
  var out=[];
  segs.forEach(function(s){
    segs.forEach(function(t){
      if(s===t)return;
      // along the run: a gap is ahead of the end, an overlap (a run's last panel
      // set back to finish at its corner) behind it
      var ux=Math.cos(s.dir),uy=Math.sin(s.dir),vx=t.a[0]-s.b[0],vy=t.a[1]-s.b[1];
      var d=vx*ux+vy*uy,side=Math.abs(-vx*uy+vy*ux);
      if(d<0.15||d>1||side>0.3)return;
      var da=Math.abs(((t.dir-s.dir+Math.PI*3)%(Math.PI*2))-Math.PI);
      if(da>0.12)return;                  // a corner, not a joint in a straight run
      var mid=[s.b[0]+ux*d/2,s.b[1]+uy*d/2];
      if(segs.some(function(q){
        if(q===s||q===t)return false;
        var qx=q.b[0]-q.a[0],qy=q.b[1]-q.a[1],ql=Math.hypot(qx,qy)||1,wx=mid[0]-q.a[0],wy=mid[1]-q.a[1];
        var along=(wx*qx+wy*qy)/ql,off=Math.abs(-wx*qy+wy*qx)/ql;
        return off<0.3&&along>-0.02&&along<ql+0.02;
      }))return;                          // another panel of the run covers it
      out.push({from:s,to:t,d:d,o:t.o,x:t.a[0],y:t.a[1]});
    });
  });
  return out;
}
// close them: along each straight run, every panel after a gap moves back by
// the gaps before it, so the run is continuous from its first panel
function closeFenceGaps(){
  if(!canEdit())return;
  function end(o,k){var si=segInfo(o.model),q=rot2(si[k],o.gamma||0);return [o.x+q[0],o.y+q[1]]}
  var gaps=fenceGaps(),next=new Map(),has=new Set(),moved=0;
  gaps.forEach(function(g){if(!next.has(g.from.o))next.set(g.from.o,g.to.o);has.add(g.to.o)});
  next.forEach(function(q,p){
    if(has.has(p))return;               // not where a run starts
    for(var n=0;q&&n<300;n++){
      var e=end(p,"b"),st=end(q,"a");
      q.x=+(q.x+e[0]-st[0]).toFixed(3);q.y=+(q.y+e[1]-st[1]).toFixed(3);moved++;
      p=q;q=next.get(p);
    }
  });
  if(!moved)return;
  lastChangeAt=0;touch();renderSide();renderList();draw();
  toast("Closed "+moved+" joint"+(moved>1?"s":"")+". Each run now runs on from its first panel, so its far end moved in a little");
}
function snapEndpoint(wx,wy){
  var best=null,bd=1.5;
  walls().forEach(function(sg){
    if(!wallShown(sg))return;
    [sg.a,sg.b].forEach(function(p){var d=Math.hypot(p[0]-wx,p[1]-wy);if(d<bd){bd=d;best=p}});
  });
  placements.forEach(function(p){
    var si=p.type==="building"&&segInfo(p.model);if(!si)return;
    [si.a,si.b].forEach(function(q){
      var r=rot2(q,p.gamma||0),e=[p.x+r[0],p.y+r[1]],d=Math.hypot(e[0]-wx,e[1]-wy);
      if(d<bd){bd=d;best=e}
    });
  });
  return best;
}
function placementPose(wx,wy){
  var g=tool.gamma!=null?tool.gamma:(tool.group==="ai"?Math.PI:0);
  var pose={x:wx,y:wy,gamma:g};
  if(tool.group!=="obj")return pose;
  var seg=segInfo(tool.id);if(!seg)return pose;
  var start=tool.chain;
  if(start&&Math.hypot(wx-start[0],wy-start[1])>seg.len*3)start=null;   // wandered off: new run
  var snapped=false;
  if(!start){start=snapEndpoint(wx,wy);snapped=!!start}
  if(!start)return pose;
  var far=Math.hypot(wx-start[0],wy-start[1]);
  var th=far<0.6?g-seg.off:Math.atan2(wy-start[1],wx-start[0]);
  if(far>=0.6&&!mouse.alt){var st=Math.PI/12;th=Math.round(th/st)*st}
  var gg=((th+seg.off)%(Math.PI*2)+Math.PI*2)%(Math.PI*2);
  var ra=rot2(seg.a,gg),rb=rot2(seg.b,gg);
  return {x:start[0]-ra[0],y:start[1]-ra[1],gamma:+gg.toFixed(5),start:start,snapped:snapped,
          end:[start[0]-ra[0]+rb[0],start[1]-ra[1]+rb[1]]};
}
function renderPlaceBar(){
  var b=$("placebar");if(!b)return;
  if(!tool||groundTool()){b.hidden=true;return}      // the ground panel says it all
  b.hidden=false;
  if(navTool()){
    b.innerHTML='<b>Adding nodes</b><span class="sep"></span><span class="k">Click the map to add · Esc to stop</span>';
    return;
  }
  var g=tool.gamma!=null?tool.gamma:(tool.group==="ai"?Math.PI:0),seg=tool.group==="obj"&&segInfo(tool.id);
  var deg=Math.round(g*180/Math.PI)%360;
  b.innerHTML='<b>'+esc(tool.label)+'</b><span class="sep"></span>'+
    '<span class="mono">'+deg+'°</span>'+
    '<button class="btn" data-pr="-15" title="Rotate 15° clockwise (Shift+R)">↻ 15°</button>'+
    '<button class="btn" data-pr="15" title="Rotate 15° anticlockwise (R)">↺ 15°</button>'+
    '<button class="btn" data-pr="90" title="Rotate 90° (T)">↺ 90°</button>'+
    (tool.group==="prefab"?'<span class="sep"></span><button class="btn" id="pb-delgrp" title="Delete this saved group">Delete saved group</button>':'')+
    (seg?'<span class="sep"></span>'+(tool.chain
        ?'<span class="chain on">Chained: the next panel continues the run</span><button class="btn" id="pb-break" title="C">Break (C)</button>'
        :'<span class="chain">Click to start a run. It snaps to fence ends nearby</span>'):'')+

  b.querySelectorAll("[data-pr]").forEach(function(x){

// Objects that hover over bare ground, and objects placed twice in the same
// spot - found by the local server from the real terrain (studio/build/surface.py).
function showCleanup(){

  sheet("Tidy up “"+MISSION+"”",'<p class="empty">Checking the ground under every object…</p>');
  if(saveTimer){clearTimeout(saveTimer);saveTimer=null}
  Store.save(M.id,{plan:planOf(),name:MISSION}).then(function(){return Store.cleanup(M.id)}).then(function(res){
    var fl=res.floating||[],dp=res.duplicates||[];

/* ---------------- check list before Apply ---------------- */
// Everything worth knowing before a build, in one list: errors stop Apply,
// warnings don't. Most checks run here; the server adds what only it can tell

function editedSoldiers(){
  return Object.keys(edits).map(objByRef).filter(function(o){return o&&o.type==="soldier"&&edits[o.ref]&&edits[o.ref].patrol});
}
function buildVerdict(){return BUILDV&&M&&BUILDV.id===M.id&&BUILDV.ver===planVer?BUILDV:null}
// a dry run of the build on the plan as it is now: from the last one if it was
// on this version, else a new one (the plan saved first); null if it can't be had
function freshVerdict(ms){
  if(!SRV||!M||READONLY||!Store||Store.local)return Promise.resolve(null);
  if(buildVerdict())return Promise.resolve(buildVerdict());
  var t0=Date.now();
  if(!HSYNC.busy)heightsSoon();
  return new Promise(function(res){
    (function wait(){
      if(buildVerdict())return res(buildVerdict());
      if(Date.now()-t0>(ms||150000))return res(null);
      setTimeout(wait,500);
    })();
  });
}
function localChecks(){
  var rows=[];
  function add(level,group,text,o,fix,meta){rows.push({level:level,group:group,text:text,o:o||null,fix:fix||null,meta:meta||""})}
  // the build's own answer, from its last dry run on this very plan
  var bv=buildVerdict();
  if(bv){
    bv.errors.forEach(function(t){add("error","Build","Apply would refuse this: "+t,null,null,"a dry run of the build")});
    bv.warnings.forEach(function(t){add("warn","Build",t,null,null,"a dry run of the build")});
    bv.notes.forEach(function(t){add("info","Build",t,null,null,"a dry run of the build")});

    (v.do||[]).forEach(function(a){

      if(a.kind==="alarm"&&!alarmByKey(a.alarmId||""))add("warn","Events","Event "+(i+1)+": no alarm picked to raise");
    });

  placements.filter(function(p){return p.type==="soldier"}).concat(editedSoldiers()).forEach(function(o){
    patrolIssues(o).forEach(function(is){
      add("error","Patrols",displayName(o)+": "+is.msg,o,{label:"Remove the stop",fn:function(){

      }});

  navNodes.forEach(function(pn,i){

  });
  Object.keys(GRAPHS||{}).forEach(function(gid){

    if(c&&c.used>GRAPH_MAX)
      add("error","Navigation","Graph "+gid+" needs "+c.used+" nodes; a walkway graph holds at most "+GRAPH_MAX,null,null,
        "remove "+(c.used-GRAPH_MAX)+" node"+(c.used-GRAPH_MAX===1?"":"s")+" from it");
  });
  placements.filter(function(p){return p.type==="building"&&!segInfo(p.model)}).forEach(function(p){
    var c=placeCheck(p);if(!c||c.level==="ok")return;
    add(c.level==="bad"?"warn":"info","Buildings",displayName(p)+": "+c.why+(c.off?" (its ground height can't be checked)":""),
      p,null,num(p.x)+", "+num(p.y));
  });
  placements.filter(function(p){return p.type==="soldier"&&!p.arriveOn}).concat(editedSoldiers()).forEach(function(p){
    var g=p.graph||graphOf(p),near=g?guardWalkway(p,String(g)):null;
    if(!g||!near){
      add("error","Guards",displayName(p)+" has no walkways near him: in the game he walks to his walkway graph when the mission starts, and there is none he can stand on. Lay walkways where he stands",p,null,
        "Walkways tool, or the AI designer's add_walkways");
      return;
    }
    if(near.dz>SAME_FLOOR)
      add("error","Guards",displayName(p)+" stands "+near.dz.toFixed(1)+" m "+(near.n.z>p.z?"below":"above")+" his walkways (graph "+g+
        "): in the game he walks to them and ends up in the air. Lay walkways where he stands, or put him where they are",p,null,
        "the nearest walkway point is "+Math.round(near.d)+" m away");

      add("warn","Guards",displayName(p)+" stands "+Math.round(near.d)+" m from his walkways: in the game he walks off to them",p,null,"graph "+g);
  });
  placements.filter(function(p){return p.type==="soldier"&&!p.graph&&!graphOf(p)}).forEach(function(p){
    add("error","Guards",displayName(p)+" has no navigation graph to walk",p);
  });
  objectives.forEach(function(ob,i){
    var pr=objProblem(ob);
    if(pr)add("error","Objectives","Objective "+(i+1)+" ("+objKind(ob.kind)[1].toLowerCase()+"): "+pr,objTarget(ob),
      {label:"Remove it",fn:function(){objectives.splice(objectives.indexOf(ob),1);renderObjectives()}});
  });

  // the map computer holds 32 markers and labels in all - a 33rd kills the level

    var labs=placements.filter(function(p){return p.type==="building"&&p.label&&(p.label.title||"").trim()}).length;
    var need=HL.total+Math.max(0,marks-HL.numbered)+labs;
    if(need>HILIGHT_MAX)
      add("warn","Objectives","The map computer holds "+HILIGHT_MAX+" markers and labels; this mission needs "+need+
        ". The last "+(need-HILIGHT_MAX)+" label"+(need-HILIGHT_MAX===1?"":"s")+" will be left out",null,null,
        (LEVEL.level<=14?"level "+LEVEL.level:"this level")+" already uses "+HL.total);
  }
  // A weapon on a crate or a roof reads well on the plan, but the player picks
  // things up by walking into them: out of reach, the objective never completes.
  objectives.forEach(function(ob,i){

      o.own?{label:"Set it on the ground",fn:function(){setProp(o,{x:o.x,y:o.y,z:gz})}}:null,num(o.x)+", "+num(o.y));
  });
  if(GRIDE.things.length)add("warn","Ground",ridersText());
  // the terrain the big changes rebuild has to fit the game's node indices
  if(TBUDGET&&TBUDGET.over)
    add("error","Ground","The shaped ground needs "+TBUDGET.nodes.toLocaleString()+" terrain nodes; the game holds "+
      TBUDGET.limit.toLocaleString()+" (the level's own use "+TBUDGET.was.toLocaleString()+"). Make the biggest shapes smaller or fewer");
  else if(TBUDGET&&TBUDGET.nodes>0.9*TBUDGET.limit)
    add("warn","Ground","The shaped ground uses "+TBUDGET.nodes.toLocaleString()+" of the game's "+TBUDGET.limit.toLocaleString()+
      " terrain nodes: there is little room left for more big shapes");
  // fence and wall runs laid before the panels were measured from their meshes
  // (2026-09-19) leave a gap at each joint in the game
  var gaps=fenceGaps();
  if(gaps.length)add("warn","Structures",gaps.length+" fence or wall joint"+(gaps.length>1?"s leave":" leaves")+" a gap of about "+
    (gaps.reduce(function(a,g){return a+g.d},0)/gaps.length).toFixed(1)+" m in the game (laid before panels were measured from their models). "+
    "Close them moves each panel after a gap back along its run",gaps[0].o,
    {label:"Close them",fn:closeFenceGaps},num(gaps[0].x)+", "+num(gaps[0].y));
  if(failOnAlarm&&!objectives.length)add("info","Objectives","“Fails if the alarm goes off” only applies with objectives");
  var any=placements.length||navNodes.length||Object.keys(edits).length||removeRefs.length||removals.length||Object.keys(nodeEdits).length||objectives.length;
  if(!any)add("info","Mission","No changes yet: the game gets "+(M&&M.base&&M.base.kind==="empty"?"the empty map":"the base mission")+" as it is");
  return rows;
}
function serverChecks(res){
  var rows=[];
  if(!res)return rows;
  if(res.error){rows.push({level:"warn",group:"Server",text:"The server's checks did not run: "+res.error});return rows}
  function byUid(u){return placements.filter(function(p){return p.uid===u})[0]||null}
  (res.floating||[]).forEach(function(f){
    var o=byUid(f.uid);
    rows.push({level:"warn",group:"Ground",text:f.name+" hovers "+f.gap.toFixed(2)+" m above the ground",o:o,
      meta:num(f.x)+", "+num(f.y),fix:o?{label:"Set it down",fn:function(){setProp(o,{x:o.x,y:o.y,z:f.rest})}}:null});
  });
  (res.duplicates||[]).forEach(function(d){
    var o=byUid(d.uid);
    rows.push({level:"warn",group:"Ground",text:d.name+" is placed twice in the same spot",o:o,meta:num(d.x)+", "+num(d.y),
      fix:o?{label:"Remove the copy",fn:function(){placements=placements.filter(function(p){return p!==o});if(sel===o)sel=null}}:null});
  });
  var im=res.imports;
  if(im&&im.models&&im.models.length){
    im.models.forEach(function(r){
      if(!r.source)rows.push({level:"error",group:"Models",text:"No level ships model "+r.model});
    });
    var ok=im.models.filter(function(r){return r.source});
    if(ok.length)rows.push({level:"info",group:"Models",
      text:ok.length+" model famil"+(ok.length===1?"y":"ies")+" will be copied into "+im.into+": "+(im.bytes/1048576).toFixed(1)+" MB, "+im.textures+" texture"+(im.textures===1?"":"s"),
      meta:ok.map(function(r){return r.model+" from "+r.source+" ("+(r.bytes/1048576).toFixed(1)+" MB)"}).join(" · ")});
  }
  return rows;
}
var CHECK_GROUPS=[["error","Must fix before applying"],["warn","Worth a look"],["info","Good to know"]];
// What this Apply will put in the game, in a line per kind, so the dialogue
// says what is about to happen before it happens.
// What this Apply adds to what the game already has, a line per kind
function pendingSummary(){
  var AS=appliedState(),IX=AS.ix,out=[],by={};
  if(!IX)return changeSummary();
  placements.forEach(function(p){
    if(AS.placements[p.uid])return;
    var was=IX.placementObj[p.uid],k=p.type==="soldier"?"guard":p.type==="camera"?"camera":p.type==="pickup"?"pickup":
      segInfo(p.model)?"fence or wall panel":"building or object";
    var key=(was?"changed ":"new ")+k;by[key]=(by[key]||0)+1;
  });
  Object.keys(by).forEach(function(k){var n=by[k],w=k.split(" "),what=w.slice(1).join(" ");
    out.push({cat:w[0]==="new"?"added":"edited",n:n,text:n+" "+what+(n>1?"s":"")+(w[0]==="new"?" placed":" changed")})});
  var gone=Object.keys(IX.placementObj).filter(function(u){return !placements.some(function(q){return q.uid===u})}).length;
  if(gone)out.push({cat:"removed",n:gone,text:gone+" of yours taken out"});
  var ed=Object.keys(edits).filter(function(r){return !AS.edits[r]}).length;
  if(ed)out.push({cat:"edited",n:ed,text:ed+" of the level's own object"+(ed>1?"s":"")+" changed"});
  var rm=removeRefs.filter(function(r){return !AS.removeRefs[r]}).length;
  if(rm)out.push({cat:"removed",n:rm,text:rm+" of the level's own object"+(rm>1?"s":"")+" removed"});
  var nn=navNodes.filter(function(n){return !AS.nodes[n.uid]}).length+Object.keys(nodeEdits).filter(function(k){return !AS.nodeEdits[k]}).length;
  if(nn)out.push({cat:"nav",n:nn,text:nn+" change"+(nn>1?"s":"")+" to the navigation"});
  var ob=objectives.filter(function(o){return !AS.objectives[o.uid]}).length;
  if(ob)out.push({cat:"obj",n:ob,text:ob+" objective"+(ob>1?"s":"")+" new or changed"});
  if(!!IX.src.failOnAlarm!==!!failOnAlarm)out.push({cat:"obj",n:1,text:failOnAlarm?"the mission now fails on the alarm":"the alarm no longer fails the mission"});
  if(settingsText()&&!AS.settings)out.push({cat:"obj",n:1,text:settingsText()});
  var ev=events.filter(function(v){return !AS.events[v.uid]}).length;
  if(ev)out.push({cat:"obj",n:ev,text:ev+" event"+(ev>1?"s":"")+" new or changed"});
  var ga=groundEdits.filter(function(a){return !AS.ground[a.uid]}).length;
  if(ga)out.push({cat:"added",n:ga,text:ga+" ground area"+(ga>1?"s":"")+" new or changed"});
  if(hasBrush()&&!AS.brush)out.push({cat:"added",n:1,text:"brush strokes changed"});
  if(hasPaint()&&!AS.paint)out.push({cat:"added",n:1,text:"painted ground changed"});
  return out;
}
function changeSummary(){
  var out=[],by={};
  placements.forEach(function(p){
    var k=p.type==="soldier"?"guard":p.type==="camera"?"camera":p.type==="pickup"?"pickup":
      segInfo(p.model)?"fence or wall panel":"building or object";
    by[k]=(by[k]||0)+1;
  });
  Object.keys(by).forEach(function(k){out.push({cat:"added",n:by[k],text:by[k]+" "+k+(by[k]>1?"s":"")+" placed"})});
  var nEd=Object.keys(edits).length;
  if(nEd)out.push({cat:"edited",n:nEd,text:nEd+" of the level's own object"+(nEd>1?"s":"")+" changed"});
  var nRm=removeRefs.length+(removals.length?1:0);
  if(nRm)out.push({cat:"removed",n:nRm,text:removeRefs.length+" of the level's own object"+(removeRefs.length===1?"":"s")+" removed"});
  var nNode=navNodes.length,nNe=Object.keys(nodeEdits).length;
  if(nNode)out.push({cat:"nav",n:nNode,text:nNode+" navigation node"+(nNode>1?"s":"")+" added"});
  if(nNe)out.push({cat:"nav",n:nNe,text:nNe+" shipped node"+(nNe>1?"s":"")+" moved or removed"});
  var own=objectives.filter(function(o){return o.kind!=="level"}).length,lvl=objectives.length-own;
  if(objectives.length)out.push({cat:"obj",n:objectives.length,
    text:objectives.length+" objective"+(objectives.length>1?"s":"")+" on the map computer"+
      (lvl?" ("+lvl+" from the level"+(own?", "+own+" of yours":"")+")":"")+
      (objectives.length>6?". Only the first 6 are listed":"")});
  if(failOnAlarm)out.push({cat:"obj",n:1,text:"the mission fails if the alarm goes off"});
  if(settingsText())out.push({cat:"obj",n:1,text:settingsText()});
  if(events.length)out.push({cat:"obj",n:events.length,text:events.length+" event"+(events.length>1?"s":"")});
  var flat=placements.filter(function(p){return p.type==="building"&&flattens(p)}).length;
  if(flat)out.push({cat:"added",n:flat,text:"the ground is levelled under "+flat+" building"+(flat>1?"s":"")});
  return out;
}

          '<button class="btn" id="g-setup" title="Checks and setup\nThe reference copy, the level data, and a check of the original missions">Checks and setup</button></div>';
        $("g-setup").addEventListener("click",function(){setupSheet({title:"The game"})});
      }else if(r.usable){
        f.innerHTML='<p class="hint" style="margin:12px 0 0">Connecting copies this game\'s levels into the studio\'s own folder and reads them: a minute or two. '+
          'Your missions stay yours: each one shows as in the game only in the copy of the game it was applied to.</p>'+
          '<div class="set-foot"><button class="btn primary" id="g-connect">Connect this game</button></div>';
        $("g-connect").addEventListener("click",function(){useGame(p)});
      }else f.innerHTML="";
    }).catch(function(e){$("g-check").innerHTML='<div class="su-list">'+suRow("bad","The folder could not be checked",esc(String(e)))+'</div>'});

// The job view: a radar, a glitching title, the progress bar, the steps as
// they tick off, how long it has been, and a word now and then.
function runSetupJob(jobId,o){
  var t0=Date.now(),tip=Math.floor(Math.random()*SU_TIPS.length),lastTip=Date.now(),stopped=false;
  $("sheet-body").innerHTML=
    '<div class="su-head"><div class="su-radar" id="su-radar"></div><div>'+
      '<div class="su-title glitch" id="su-title" data-text="'+esc(o.title)+'">'+esc(o.title)+'</div>'+
      '<div class="su-sub">'+esc(o.sub||"")+'</div></div></div>'+
    '<div class="su-prog" id="su-prog"><i id="su-bar"></i></div>'+
    '<div class="su-meta"><span id="su-now">Starting...</span><span><b id="su-pct">0%</b> &middot; <span id="su-time">0:00</span></span></div>'+
    '<ul class="su-steps" id="su-steps"></ul>'+
    '<div class="su-tip" id="su-tip"><small>Please wait</small>'+esc(SU_TIPS[tip])+'</div>'+
    '<div id="su-after"></div>';
  function paint(job){
    var pct=Math.max(0,Math.min(100,job.pct||0));
    $("su-bar").style.width=pct+"%";$("su-pct").textContent=Math.round(pct)+"%";
    $("su-time").textContent=mmss(job.elapsed!=null?job.elapsed:(Date.now()-t0)/1000);
    var steps=job.steps||[],now=steps.filter(function(s){return s.state==="now"})[0];
    $("su-now").textContent=now?now.label+(now.detail?" ("+now.detail+")":""):(job.done?"":"Working...");
    $("su-steps").innerHTML=steps.map(function(s){
      return '<li class="'+s.state+'"><span class="d">'+(s.state==="done"?"&#10003;":"")+'</span>'+esc(s.label)+
        '<span class="x">'+esc(s.state==="done"?s.detail:(s.state==="now"?s.detail:""))+'</span></li>';
    }).join("");
    if(Date.now()-lastTip>6500){
      lastTip=Date.now();tip=(tip+1)%SU_TIPS.length;var el=$("su-tip");el.style.opacity=0;
      setTimeout(function(){if(!stopped){el.innerHTML='<small>Please wait</small>'+esc(SU_TIPS[tip]);el.style.opacity=1}},450);
    }
  }
  (function poll(){
    fetch("api/jobs/"+jobId).then(function(r){return r.json()}).then(function(j){
      var job=j.job||j;
      if(!$("su-bar"))return;                         // the sheet was closed or replaced
      paint(job);
      if(!job.done)return setTimeout(poll,500);
      stopped=true;
      var res=job.result||{};
      $("su-title").classList.remove("glitch");
      if(res.ok){
        $("su-radar").classList.add("done");$("su-prog").classList.add("done");
        $("su-title").textContent=o.doneTitle||"Done";$("su-now").textContent="Finished";
        $("su-tip").style.display="none";
        if(o.done)o.done(res);
      }else{
        $("su-radar").classList.add("fail");$("su-prog").classList.add("fail");
        $("su-title").textContent="Stopped";$("su-tip").style.display="none";
        $("su-after").innerHTML='<div class="su-panel">'+suRow("bad",esc(o.failed||"It could not finish"),
            esc(String(res.error||"").split("\n").slice(-2).join(" ")))+'</div>'+
          '<div class="su-actions"><button class="btn" id="su-back">Back</button></div>';
        $("su-back").addEventListener("click",function(){setupSheet({find:true})});
      }
    }).catch(function(){setTimeout(poll,1500)});
  })();
}
function startJob(url,body,o){
  fetch(url,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body||{})})
    .then(function(r){return r.json()}).then(function(d){
      if(!d.ok){
        if(o.onRefused)return o.onRefused(d);
        $("sheet-body").innerHTML='<div class="su-panel">'+suRow("bad",esc(d.error||"It could not start"))+'</div>';
        return;
      }
      runSetupJob(d.job&&d.job.id?d.job.id:d.job,o);
    });

function applyToGame(opts){
  opts=opts||{};
  if(!canEdit())return;
  if(!Store||Store.local){toast("Apply needs the local server");return}
  if(saveTimer){clearTimeout(saveTimer);saveTimer=null}
  var id=M.id,t0=Date.now(),poll=null,shown=-1;
  sheet((opts.test?"Test “":"Apply “")+MISSION+(opts.test?"” from here":"” to the game"),
    '<div class="apbar run" id="ap-bar"><div class="ap-stage"><b id="ap-stage">Saving the mission</b><em id="ap-pct">0%</em></div>'+
    '<div class="ap-track"><div class="ap-fill" id="ap-fill"></div></div><div class="ap-detail" id="ap-detail">writing the plan to disk…</div></div>'+
    '<div id="ap-result"></div>'+
    '<details class="aplog" id="ap-logbox"><summary>Details</summary><pre class="applylog" id="ap-log"></pre>'+
    '<div class="ap-logbar"><button class="btn ghost" id="ap-copy">Copy details</button></div></details>');
  // the whole log, headed by the version, ready for a bug report
  $("ap-copy").addEventListener("click",function(){
    var t=$("ap-log").textContent;
    if(!t.trim()){toast("Nothing to copy yet");return}
    navigator.clipboard.writeText((SRV&&SRV.version?"Project IGI Studio "+SRV.version+"\n":"")+t)
      .then(function(){toast("Details copied")}).catch(function(){toast("Copy failed")});
  });
  function set(stage,pct,detail){
    if(!$("ap-bar"))return;
    if(stage!=null)$("ap-stage").textContent=stage;
    if(pct!=null){$("ap-fill").style.width=Math.max(2,Math.min(100,pct))+"%";$("ap-pct").textContent=Math.round(pct)+"%"}
    if(detail!=null)$("ap-detail").textContent=detail;
  }
  function logTo(lines){
    var el=$("ap-log");if(!el||lines.length===shown)return;
    shown=lines.length;el.innerHTML=logLines(lines);el.scrollTop=el.scrollHeight;
  }
  function finish(res){
    if(poll){clearTimeout(poll);poll=null}
    var bar=$("ap-bar");if(!bar)return;
    var lines=(res.log||[]).slice(),secs=((Date.now()-t0)/1000).toFixed(1);
    if(res.mission)refreshOpen(res.mission);
    if(res.ok&&res.applied&&M&&res.mission&&res.mission.id===M.id){M.applied=res.applied;renderList();paintStatus();draw()}
    bar.classList.remove("run");
    if(res.error){
      bar.classList.add("fail");
      set("Failed",null,res.error);
      lines.push("","FAILED: "+res.error);
      $("ap-result").innerHTML='<p class="ap-done">The game was '+(res.installed?'changed, but the check afterwards found a problem':'not changed')+
        '. Your mission is saved as it is. The details below say what went wrong.</p>';
      $("ap-logbox").open=true;
    }else{
      set("Installed as mission "+res.slot,100,"done in "+secs+" s");
      var L=res.launched;
      $("ap-result").innerHTML=res.test?
        '<p class="ap-done">'+(L&&L.started?'The game is starting. ':L&&L.running?'The game is already running: leave the mission and pick it again. ':'')+
        'Pick <b>'+esc(MISSION)+'</b> (mission '+res.slot+'): the player starts where you chose. Apply again to go back to the plan\'s own start.</p>'+
        (L&&L.error?'<p class="ap-done">'+esc(L.error)+'</p>':''):
        '<p class="ap-done">Launch the game and pick <b>'+esc(MISSION)+'</b> (mission '+res.slot+'). '+
        'The mission stays here as it is: change it and apply again whenever you like.</p>';
    }
    logTo(lines);
    $("ap-logbox").open=true;               // what it did, without asking for it
  }
  Store.save(id,{plan:planOf(),name:MISSION}).then(function(s){
    refreshOpen(s);
    set("Starting the build",4,"saved; building “"+MISSION+"” from "+baseLabel(M.base).toLowerCase());
    return Store.applyJob(id,opts.test?{test:opts.test}:null);
  }).then(function(j){
    // a server from before jobs: the one long request, without progress
    if(!j||!j.job){
      set("Building and installing",30,"this takes a few seconds…");
      return Store.apply(id).then(finish);
    }
    (function tick(){
      Store.job(j.job).then(function(st){
        if(!$("ap-bar"))return;             // the sheet was closed: the build goes on regardless
        logTo(st.lines||[]);
        if(st.done){finish(st.result||{ok:false,error:"no result"});return}
        set(st.stage.charAt(0).toUpperCase()+st.stage.slice(1),st.pct,st.detail||("working… "+st.elapsed+" s"));
        poll=setTimeout(tick,350);
      }).catch(function(e){
        set(null,null,"lost touch with the server: "+(e.message||e));poll=setTimeout(tick,1500);
      });
    })();
  }).catch(function(e){
    finish({ok:false,error:"could not apply: "+(e.message||e)});
  });
}

/* ---------------- one look for tooltips and dropdowns ---------------- */
// The browser's own tooltip and its <select> popup are the only parts of the
// page the map computer's look never reached: a white box in a system font and
// a blue highlight. Both are replaced here, once, for everything - a title
// anywhere becomes a themed tip, and every <select> gets a listbox of our own
// while the real element stays underneath, so all the change handlers still work.
var TIP=null,TIP_T=0,TIP_EL=null;
function tipFor(el){
  var t=el.getAttribute("data-tip");
  if(t==null){
    t=el.getAttribute("title");
    if(t==null)return null;
    el.setAttribute("data-tip",t);
    el.setAttribute("data-tipped","1");          // ours, not the toolbar's CSS one
    el.removeAttribute("title");                 // the native one must not show
    if(!el.getAttribute("aria-label")&&!el.textContent.trim())el.setAttribute("aria-label",t);
  }
  return t;
}
function showTip(el){
  var t=tipFor(el);
  if(!t){hideTip();return}
  if(!TIP){TIP=document.createElement("div");TIP.className="tip";TIP.setAttribute("role","tooltip");document.body.appendChild(TIP)}
  TIP_EL=el;
  // "Name\nwhat it does" reads as a title and a line under it
  var cut=t.indexOf("\n");
  TIP.innerHTML=cut>0?"<b>"+esc(t.slice(0,cut))+"</b>"+esc(t.slice(cut+1)):esc(t);
  TIP.hidden=false;
  var r=el.getBoundingClientRect(),w=TIP.offsetWidth,h=TIP.offsetHeight;
  var x=Math.min(window.innerWidth-w-8,Math.max(8,r.left+r.width/2-w/2));
  var y=r.top-h-7;
  if(y<8)y=Math.min(window.innerHeight-h-8,r.bottom+7);
  TIP.style.left=x+"px";TIP.style.top=y+"px";
  TIP.classList.add("on");
}
function hideTip(){if(TIP){TIP.classList.remove("on");TIP.hidden=true}TIP_EL=null;clearTimeout(TIP_T)}
document.addEventListener("mouseover",function(e){
  var el=e.target.closest?e.target.closest("[title],[data-tipped]"):null;
  if(!el||el===TIP_EL)return;
  clearTimeout(TIP_T);
  var wait=TIP&&TIP.classList.contains("on")?60:350;
  TIP_T=setTimeout(function(){showTip(el)},wait);
});
document.addEventListener("mouseout",function(e){
  var el=e.target.closest?e.target.closest("[title],[data-tipped]"):null;
  if(el&&el===TIP_EL&&!el.contains(e.relatedTarget))hideTip();
  else if(el)clearTimeout(TIP_T);
});
document.addEventListener("mousedown",hideTip,true);
window.addEventListener("blur",hideTip);

var CHEV='<svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 4.5 6 8l3.5-3.5"/></svg>';
function enhanceSelect(sel){
  if(sel.dataset.themed)return;
  sel.dataset.themed="1";
  var wrap=document.createElement("span");wrap.className="sel";
  sel.parentNode.insertBefore(wrap,sel);wrap.appendChild(sel);
  var btn=document.createElement("button");btn.type="button";btn.className="sel-btn";
  btn.setAttribute("aria-haspopup","listbox");
  var label=document.createElement("span");
  btn.appendChild(label);btn.insertAdjacentHTML("beforeend",CHEV);
  wrap.appendChild(btn);
  var pop=null;
  function paint(){
    var o=sel.options[sel.selectedIndex];
    label.textContent=o?o.textContent:"";
    btn.disabled=sel.disabled;
    var t=sel.getAttribute("title")||sel.getAttribute("data-tip");
    if(t)btn.setAttribute("title",t);
  }
