<meta charset="utf-8">
<title>Project IGI Studio</title>
<link rel="icon" type="image/png" href="icon.png">
<link rel="stylesheet" href="vendor/fonts/fonts.css">
<style>
/* One look: the in-game map computer. Dark phosphor ground, buildings as lit
   green shapes, contacts and labels in red. */
:root{
  color-scheme:dark;
  --ground:#08180a; --surface:#0e2a12; --sunken:#0b210e;
  --ink:#d6ffda; --muted:#84d98d; --faint:#57a862;
  --line:#2a6b33; --grid:#1b4a22; --gridmaj:#27632e;
  --accent:#ffd24a; --accent-ink:#1d1600; --accent-soft:#2a2408;
  --enemy:#ff5546; --player:#8dff9a; --prop:#6fbf78;
  --build:#7fd98a; --pickup:#c9f59a; --node:#3f8c49;
  --wall:#a6f0ad; --climb:#6fdcec; --electric:#ff7ae0;
  --ok:#5fd46f; --warn:#ffb13b; --danger:#ff6b5a;
  --shadow:0 1px 2px rgba(0,0,0,.45),0 8px 24px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
/* scrollbars in the map computer's green, no arrow buttons */
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track,::-webkit-scrollbar-corner{background:transparent}
::-webkit-scrollbar-thumb{background:#2c7437;border-radius:8px;border:2px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background:#43a84f;border:2px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-thumb:active{background:#5fd46f;border:2px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-button{display:none;width:0;height:0}
@supports not selector(::-webkit-scrollbar){*{scrollbar-color:#2c7437 transparent;scrollbar-width:thin}}
html,body{height:100%}
body{margin:0;background:var(--ground);color:var(--ink);overflow:hidden;
  font:14px/1.5 "IBM Plex Sans",system-ui,-apple-system,Segoe UI,sans-serif}
.mono{font-family:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;font-variant-numeric:tabular-nums}
.lbl{font-family:"Barlow Condensed","IBM Plex Sans",sans-serif;font-weight:600;
  letter-spacing:.09em;text-transform:uppercase;font-size:12px;color:var(--muted)}
#app{display:flex;flex-direction:column;height:100%}

.topbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 16px;
  background:var(--surface);border-bottom:1px solid var(--line);
  padding-top:calc(10px + env(safe-area-inset-top,0px))}
.brand{display:flex;align-items:baseline;gap:9px}
.brand b{font-family:"Barlow Condensed",sans-serif;font-weight:600;font-size:19px;letter-spacing:.03em}
.brand span{font-size:11px;color:var(--faint);letter-spacing:.06em;text-transform:uppercase}
.mission-name{background:var(--sunken);border:1px solid var(--line);color:var(--ink);
  border-radius:4px;padding:5px 9px;font:inherit;font-weight:500;min-width:180px}
.mission-name:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.spacer{flex:1}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:4px;
  padding:6px 12px;font:inherit;font-weight:500;cursor:pointer}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07);color:var(--accent-ink)}
.btn.ghost{background:transparent}
.btn.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.savechip{font-size:11px;color:var(--faint);letter-spacing:.05em;text-transform:uppercase;
  font-family:"Barlow Condensed",sans-serif;font-weight:600;white-space:nowrap}

.workspace{flex:1;display:flex;min-height:0}
.rail{width:206px;flex:none;background:var(--surface);border-right:1px solid var(--line);
  overflow-y:auto;padding:14px 12px;display:flex;flex-direction:column;gap:15px}
.rail.right{border-right:none;border-left:1px solid var(--line);width:var(--rw,292px);padding:0;gap:0;overflow:hidden;position:relative}
/* ---- right panel: the selection on top, the change log docked under it ---- */
.rsec-sel{flex:1 1 auto;min-height:0;overflow-y:auto;padding:12px 12px 14px}
.rsec-t{margin:0 0 8px}
.rsec-log{flex:none;display:flex;flex-direction:column;max-height:42%;min-height:0;border-top:1px solid var(--line);background:var(--sunken)}
.rsec-log[data-open="false"] .log,.rsec-log[data-open="false"] #phint{display:none}
.logh{display:flex;align-items:center;gap:7px;width:100%;padding:9px 12px;border:none;background:transparent;color:var(--muted);cursor:pointer;text-align:left}
.logh svg{width:11px;height:11px;flex:none;fill:none;stroke:currentColor;stroke-width:2;transition:transform .15s}
.logh[aria-expanded="false"] svg{transform:rotate(-90deg)}
.logh:hover{color:var(--ink)}
.logh:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.logn{margin-left:auto;min-width:22px;padding:0 6px;border-radius:9px;background:var(--surface);border:1px solid var(--line);
  font:11px/17px "IBM Plex Mono",monospace;text-align:center;color:var(--ink)}
.log{overflow-y:auto;min-height:0;padding:0 8px 4px}
.rsec-log #phint{margin:0;padding:6px 12px 10px;border-top:1px solid color-mix(in srgb,var(--line) 55%,transparent)}
.lg-cat{--cat:var(--ok);margin:0 0 6px}
.lg-ch{display:flex;align-items:center;gap:7px;width:100%;padding:4px 4px;border:none;background:transparent;cursor:pointer;
  font-family:"Barlow Condensed",sans-serif;font-weight:600;letter-spacing:.08em;text-transform:uppercase;font-size:11.5px;color:var(--cat)}
.lg-ch svg{width:10px;height:10px;flex:none;fill:none;stroke:currentColor;stroke-width:2;transition:transform .15s}
.lg-ch[aria-expanded="false"] svg{transform:rotate(-90deg)}
.lg-ch .n{margin-left:auto;font:10.5px "IBM Plex Mono",monospace;letter-spacing:0;color:var(--faint)}
.lg-ch:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.lg-dot{width:7px;height:7px;border-radius:50%;background:var(--cat);flex:none}
.lg-row{display:flex;align-items:stretch;margin:0 0 3px;border-radius:5px;border:1px solid transparent;border-left:3px solid var(--cat);
  background:var(--surface)}
.lg-row:hover{border-color:color-mix(in srgb,var(--cat) 45%,var(--line));border-left-color:var(--cat)}
.lg-row.on{border-color:var(--accent);border-left-color:var(--cat);background:var(--accent-soft)}
.lg-main{flex:1;min-width:0;display:flex;align-items:center;gap:8px;padding:5px 7px;border:none;background:transparent;color:var(--ink);
  cursor:pointer;text-align:left;font:inherit;border-radius:4px}
.lg-main:disabled{cursor:default}
.lg-main:focus-visible,.lg-undo:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.lg-ic{flex:none;width:20px;display:grid;place-items:center}
.lg-tx{min-width:0;display:flex;flex-direction:column;line-height:1.3}
.lg-tx b{font-weight:500;font-size:12.5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
.lg-tx span{font:10.5px "IBM Plex Mono",monospace;color:var(--faint);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lg-row.bad .lg-tx span{color:var(--danger)}
.lg-undo{flex:none;width:30px;display:grid;place-items:center;border:none;border-left:1px solid color-mix(in srgb,var(--line) 60%,transparent);
  background:transparent;color:var(--muted);cursor:pointer;border-radius:0 4px 4px 0}
.lg-undo:hover{color:var(--accent);background:var(--accent-soft)}
.lg-undo svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.lg-empty{margin:4px 6px 10px;font-size:12px;color:var(--faint)}
/* ---- inspector ---- */
.ins-head{display:flex;align-items:center;gap:10px;margin:0 0 10px}
.ins-thumb{flex:none;width:36px;height:36px;display:grid;place-items:center;border:1px solid var(--line);border-radius:6px;background:var(--sunken)}
.ins-t{min-width:0;display:flex;flex-direction:column;gap:3px}
.ins-t b{font-size:14px;font-weight:600;line-height:1.25;word-break:break-word}
.ins-t .mh-tag{align-self:flex-start}
#insp :not(.field)>.lbl{display:flex;align-items:center;gap:8px}
#insp :not(.field)>.lbl::after{content:"";flex:1;height:1px;background:var(--line);opacity:.55}
.btnrow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:7px}
.btnrow .btn,.optgrid .btn{display:flex;align-items:center;justify-content:center;gap:5px;padding:5px 4px;font-size:12.5px;white-space:nowrap;min-width:0}
.btnrow svg,.btn.act svg{width:15px;height:15px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.optgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:5px;margin-top:6px}
.optgrid .btn{overflow:hidden;text-overflow:ellipsis;display:block;text-align:center}
.ins-acts{display:grid;gap:6px;margin-top:14px;padding-top:12px;border-top:1px solid color-mix(in srgb,var(--line) 60%,transparent)}
.btn.act{display:flex;align-items:center;gap:9px;width:100%;padding:7px 11px;font-size:13px;text-align:left}
.btn.danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 55%,var(--line))}
.btn.danger:hover{color:var(--danger);border-color:var(--danger);background:color-mix(in srgb,var(--danger) 12%,transparent)}
/* ---- form controls in the map computer's green ---- */
input[type=checkbox]{appearance:none;-webkit-appearance:none;width:16px;height:16px;flex:none;margin:0;display:inline-grid;place-content:center;
  border:1.5px solid var(--line);border-radius:4px;background:var(--sunken);cursor:pointer;vertical-align:-3px;transition:border-color .12s,background .12s}
input[type=checkbox]::before{content:"";width:10px;height:10px;transform:scale(0);transition:transform .12s;background:var(--ok);
  clip-path:polygon(12% 50%,0 64%,40% 100%,100% 22%,86% 9%,39% 72%)}
input[type=checkbox]:hover{border-color:var(--ok)}
input[type=checkbox]:checked{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 18%,var(--sunken))}
input[type=checkbox]:checked::before{transform:scale(1)}
input[type=checkbox]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input[type=checkbox]:disabled{opacity:.5;cursor:default}
input[type=radio],input[type=range],progress{accent-color:var(--ok)}
select option{background:var(--surface);color:var(--ink)}
.group{display:flex;flex-direction:column;gap:6px}
.chiprow{display:flex;flex-direction:column;gap:3px}
.chip{display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:1px solid transparent;
  background:transparent;color:var(--ink);border-radius:4px;padding:5px 7px;font:inherit;
  cursor:pointer;font-size:13px}
.chip:hover{background:var(--sunken)}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.chip:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.hint{font-size:12px;color:var(--faint);line-height:1.45}

.stage{flex:1;position:relative;min-width:0;background:var(--sunken)}
canvas{display:block}
#plan{width:100%;height:100%;cursor:crosshair}
#plan.panning{cursor:grabbing}
#plan.over{cursor:pointer}
.readout{position:absolute;left:12px;bottom:12px;background:var(--surface);border:1px solid var(--line);
  border-radius:5px;padding:7px 10px;box-shadow:var(--shadow);pointer-events:none;font-size:12px;line-height:1.7;z-index:2}
.readout .k{color:var(--faint);margin-right:7px}
.zoombar{position:absolute;right:12px;bottom:12px;display:flex;gap:5px;z-index:2}
.zoombar .btn{padding:4px 10px;box-shadow:var(--shadow)}

/* ---- map toolbar: what to show, as icon toggles ---- */
.mapbar{position:absolute;left:12px;top:12px;right:12px;display:flex;gap:8px;flex-wrap:wrap;
  align-items:flex-start;pointer-events:none;z-index:9}
.mapbar>*{pointer-events:auto}
.toggles{position:relative;display:flex;align-items:center;gap:2px;background:var(--surface);border:1px solid var(--line);
  border-radius:6px;padding:3px;box-shadow:var(--shadow)}
.tgmore[aria-expanded="true"]{background:var(--sunken);color:var(--accent)}
.tgpop{position:absolute;top:calc(100% + 6px);right:0;min-width:250px;max-height:min(70vh,560px);overflow-y:auto;
  background:var(--surface);border:1px solid var(--line);border-radius:6px;box-shadow:var(--shadow);padding:4px;z-index:12;
  display:flex;flex-direction:column;gap:1px}
.tgpop[hidden]{display:none}
#toggles>.tgpop{left:0;right:auto}
.tgm-row{display:flex;align-items:center;gap:8px;padding:1px 10px 1px 1px;border-radius:4px;cursor:pointer;font-size:12.5px;color:var(--ink);white-space:nowrap}
.tgm-row:hover{background:var(--sunken)}
.tgm-l{flex:1}
.tgm-row.on::after{content:"✓";color:var(--ok);font-size:12px}
.tgm-row .tg{flex:none}
.tgm-row .tg.wide{width:30px;padding:0}.tgm-row .tg.wide .tg-txt{display:none}
.tgm-sep{height:1px;background:var(--line);margin:3px 4px}
/* ---- a mission's own textures ---- */
.tex-sec .sec-b{display:none}
.tex-sec.open .sec-b{display:block}
.tex-row{display:grid;grid-template-columns:44px 1fr auto;gap:8px;align-items:center;padding:4px 2px;border-top:1px solid var(--line)}
.tex-row:first-child{border-top:none}
.tex-row img{width:44px;height:44px;object-fit:cover;border:1px solid var(--line);border-radius:4px;background:var(--sunken);image-rendering:pixelated}
.tex-row b{display:block;font:11.5px "IBM Plex Mono",monospace;font-weight:500;color:var(--ink);overflow-wrap:anywhere}
.tex-own{font:600 10px "Barlow Condensed",sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.tex-acts{display:flex;gap:4px}
.tex-acts .btn{padding:2px 8px;font-size:11.5px}
.trash-foot{display:flex;justify-content:flex-end;margin-top:10px}
.btn.danger.sure{background:var(--danger);color:#fff;border-color:var(--danger)}
.tg{position:relative;width:30px;height:30px;display:grid;place-items:center;border:none;border-radius:4px;
  background:transparent;color:var(--ink);cursor:pointer;padding:0;font:inherit}
.tg svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tg[aria-pressed="true"]{background:var(--sunken)}
.tg[aria-pressed="false"]{color:var(--faint)}
.tg[aria-pressed="false"] svg{opacity:.5}
.tg:hover{color:var(--accent)}
.tg:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.tg .spd{font:600 10.5px "IBM Plex Mono",monospace}
.tg.wide{width:auto;display:flex;gap:5px;padding:0 8px 0 6px}
.tg-txt{font:600 11.5px "Barlow Condensed",sans-serif;letter-spacing:.1em;text-transform:uppercase}
.tg.on-air .tg-txt{color:var(--ok)}
.tg.on-air svg{color:var(--ok)}
.lv-steps{margin:6px 0 10px;padding:0 0 0 18px;font-size:12px;line-height:1.45;color:var(--muted)}
.lv-steps li{margin:0 0 3px}
.lv-steps b{color:var(--ink);font-weight:500}
.tgsep{width:1px;height:20px;background:var(--line);margin:0 4px;flex:none}
.placebar{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);display:flex;align-items:center;gap:7px;
  flex-wrap:wrap;justify-content:center;max-width:calc(100% - 330px);background:var(--surface);border:1px solid var(--accent);
  border-radius:6px;padding:5px 10px;box-shadow:var(--shadow);font-size:12.5px;z-index:3}
.placebar[hidden]{display:none}
.placebar b{font-weight:600}
.placebar .btn{padding:2px 8px;font-size:12px}
.placebar .sep{width:1px;height:16px;background:var(--line)}
.placebar .k{color:var(--faint);font-size:11.5px}
.placebar .chain{color:var(--muted);font-size:12px}
.placebar .chain.on{color:var(--accent)}
.btn.addnode{display:flex;align-items:center;gap:6px;padding:4px 10px;font-size:13px;white-space:nowrap}
.btn.addnode svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.8}
.tg[data-tip]:hover::after,.tg[data-tip]:focus-visible::after{content:attr(data-tip);position:absolute;
  top:calc(100% + 7px);left:50%;transform:translateX(-50%);white-space:nowrap;background:var(--ink);
  color:var(--surface);font-size:11.5px;font-weight:500;padding:3px 8px;border-radius:4px;pointer-events:none;z-index:6}

/* ---- inventory ---- */
.sec{border-bottom:1px solid var(--line)}
.sec-h{display:flex;align-items:center;gap:8px;width:100%;padding:10px 12px;background:transparent;border:none;
  color:var(--muted);font:inherit;cursor:pointer;text-align:left}
.sec-h:hover{color:var(--ink)}
.sec-h:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.sec-h .lbl{flex:1;color:inherit}
.sec-h .count{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--faint);background:var(--sunken);
  border-radius:9px;padding:0 7px;line-height:18px}
.sec-h svg{width:12px;height:12px;flex:none;fill:none;stroke:currentColor;stroke-width:2;transition:transform .15s}
.sec[data-open="false"] .sec-h svg{transform:rotate(-90deg)}
.sec-b{padding:0 8px 10px}
.sub{font:600 11px "Barlow Condensed",sans-serif;letter-spacing:.07em;text-transform:uppercase;color:var(--faint);margin:8px 5px 4px}
.item{display:flex;align-items:center;gap:8px;width:100%;border:1px solid transparent;background:transparent;
  color:var(--ink);border-radius:4px;padding:2px 5px;font:inherit;font-size:12.5px;cursor:pointer;text-align:left}
.item:hover{background:var(--sunken)}
.item:focus-visible{outline:2px solid var(--accent);outline-offset:-1px}
.item[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.item .thumb{width:28px;height:28px;flex:none;border-radius:3px;background:var(--sunken);display:grid;place-items:center;overflow:hidden}
.item .thumb img,.item .thumb canvas{display:block}
.item .t{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.2}
.item .t b{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .t span{font-size:10.5px;color:var(--faint);font-family:"IBM Plex Mono",monospace;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item.na{opacity:.42}
.item.na:hover{opacity:.72}
.more{border:none;background:transparent;color:var(--accent);font:inherit;font-size:12px;cursor:pointer;padding:4px 6px}
.graphs{display:flex;flex-direction:column;gap:2px;margin-top:8px}
.graphrow{display:grid;grid-template-columns:14px 1fr auto auto;gap:3px 7px;align-items:center;padding:5px 6px;
  border-radius:4px;border:1px solid transparent;background:transparent;color:var(--ink);font:inherit;font-size:12.5px;
  width:100%;text-align:left;cursor:pointer}
.graphrow:hover{background:var(--sunken)}
.graphrow:focus-visible{outline:2px solid var(--accent);outline-offset:-1px}
.graphrow.off{opacity:.45}
.graphrow .eye{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.8}
.graphrow .cap{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--muted)}
.graphrow .zoom{border:none;background:transparent;color:var(--faint);cursor:pointer;padding:0 2px;font-size:13px;line-height:1}
.graphrow .zoom:hover{color:var(--accent)}
.graphrow .bar{grid-column:2/-1;height:3px;border-radius:2px;background:var(--sunken);overflow:hidden}
.graphrow .bar i{display:block;height:100%;background:var(--node)}
.graphrow .bar i.full{background:var(--danger)}
/* ---- menus: mission menu, right-click menu, quick add ---- */
.menuwrap{position:relative}
.menubtn{display:flex;align-items:center;gap:6px}
.menubtn svg{width:12px;height:12px;fill:none;stroke:currentColor;stroke-width:2}
.menu{position:absolute;min-width:220px;background:var(--surface);border:1px solid var(--line);border-radius:6px;
  box-shadow:var(--shadow);padding:4px;z-index:40;font-size:13px}
.menu[hidden]{display:none}
.menu .mi{display:flex;align-items:center;gap:10px;width:100%;border:none;background:transparent;color:var(--ink);
  font:inherit;text-align:left;padding:6px 10px;border-radius:4px;cursor:pointer;white-space:nowrap;position:relative}
.menu .mi:hover,.menu .mi:focus-visible{background:var(--sunken);outline:none}
.menu .mi[disabled]{color:var(--faint);cursor:default;background:transparent}
.menu .mi.danger{color:var(--danger)}
.menu .mi .k{margin-left:auto;padding-left:18px;font:11px "IBM Plex Mono",monospace;color:var(--faint)}
.menu .mi .arrow{margin-left:auto;padding-left:18px;color:var(--faint)}
.menu .sep{height:1px;background:var(--line);margin:4px 2px}
.menu .mh{font:600 11px "Barlow Condensed",sans-serif;letter-spacing:.07em;text-transform:uppercase;color:var(--faint);padding:6px 10px 3px}
.menu .has-sub>.menu{display:none;left:calc(100% - 4px);top:-5px;max-height:70vh;overflow-y:auto}
.menu .has-sub.open>.menu{display:block}
.menu.flip .has-sub>.menu{left:auto;right:calc(100% - 4px)}
.quickadd{position:absolute;width:300px;background:var(--surface);border:1px solid var(--line);border-radius:6px;
  box-shadow:var(--shadow);padding:6px;z-index:41}
.quickadd input{width:100%;background:var(--sunken);border:1px solid var(--line);color:var(--ink);border-radius:4px;padding:6px 8px;font:inherit;font-size:13px}
.quickadd input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.quickadd .res{max-height:300px;overflow-y:auto;margin-top:5px;display:flex;flex-direction:column;gap:1px}
.quickadd .res button[aria-selected="true"]{background:var(--accent-soft);border-color:var(--accent)}
.savedlist{display:flex;flex-direction:column;gap:5px}
.saved{display:grid;grid-template-columns:1fr auto;gap:3px 10px;align-items:center;border:1px solid var(--line);border-radius:5px;padding:8px 10px}
.saved.current{border-color:var(--accent)}
.saved b{font-weight:600}
.saved .meta{font-size:11.5px;color:var(--faint);font-family:"IBM Plex Mono",monospace}
.saved .acts{grid-row:1/3;grid-column:2;display:flex;gap:5px}
.btn.block{width:100%;display:flex;align-items:center;justify-content:center;gap:7px}
.btn.block svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2}
.banner{position:absolute;left:50%;transform:translateX(-50%);top:60px;
  max-width:min(600px,calc(100% - 24px));background:var(--surface);border:1px solid var(--accent);
  border-left-width:3px;border-radius:5px;padding:8px 12px;box-shadow:var(--shadow);
  font-size:12.5px;line-height:1.45;color:var(--muted);display:flex;gap:10px;align-items:flex-start;z-index:3}
.banner[hidden]{display:none}
.banner b{color:var(--ink);font-weight:600}
.banner button{border:none;background:transparent;color:var(--faint);cursor:pointer;font:inherit;
  font-size:16px;line-height:1;padding:0 0 0 4px;margin-left:auto}
.banner button:hover{color:var(--ink)}

.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font-size:13px;align-items:baseline}
.kv dt{color:var(--faint);font-size:12px}
.kv dd{margin:0;font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;word-break:break-word}
.field{display:flex;flex-direction:column;gap:3px}
.field input,.field select{background:var(--sunken);border:1px solid var(--line);color:var(--ink);
  border-radius:4px;padding:5px 7px;font:inherit;font-size:13px;width:100%}
.field input{font-family:"IBM Plex Mono",monospace}
.field input:focus-visible,.field select:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.empty{color:var(--faint);font-size:13px;line-height:1.5}
.placed-list{display:flex;flex-direction:column;gap:3px;max-height:200px;overflow-y:auto}
.placed{display:flex;align-items:center;gap:7px;padding:5px 7px;border-radius:4px;border:1px solid transparent;
  background:transparent;color:var(--ink);font:inherit;font-size:12.5px;cursor:pointer;text-align:left;width:100%}
.placed:hover{background:var(--sunken)}
.placed[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.placed .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.placed .co{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--faint)}
.wp{display:flex;align-items:center;gap:7px;font-size:12.5px;padding:3px 6px;border-radius:3px;background:var(--sunken)}
.wp .n{font-family:"IBM Plex Mono",monospace;font-weight:500}
.wp .x{margin-left:auto;border:none;background:transparent;color:var(--faint);cursor:pointer;font-size:15px;line-height:1;padding:0}
.wp .x:hover{color:var(--danger)}
.wp.bad{outline:1px solid var(--danger)}
.note{font-size:12px;border-radius:4px;padding:6px 8px;line-height:1.4}
.note.bad{background:color-mix(in srgb,var(--danger) 12%,transparent);color:var(--danger)}
.note.ok{background:color-mix(in srgb,var(--ok) 12%,transparent);color:var(--ok)}

.start{position:fixed;inset:0;display:grid;place-items:center;padding:20px;
  background:color-mix(in srgb,var(--ground) 84%,transparent);backdrop-filter:blur(3px);z-index:20}
.start[hidden]{display:none}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);
  padding:24px;max-width:660px;width:100%;max-height:100%;overflow-y:auto}
.card h1{font-family:"Barlow Condensed",sans-serif;font-weight:600;letter-spacing:.02em;
  font-size:30px;margin:0 0 4px;text-wrap:balance}
.card .sub{color:var(--muted);margin:0 0 18px;font-size:14px}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mode{border:1px solid var(--line);background:var(--sunken);border-radius:6px;padding:15px;text-align:left;
  cursor:pointer;color:var(--ink);font:inherit;display:flex;flex-direction:column;gap:6px}
.mode:hover,.mode[aria-pressed="true"]{border-color:var(--accent)}
.mode[aria-pressed="true"]{background:var(--accent-soft)}
.mode:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.mode b{font-family:"Barlow Condensed",sans-serif;font-size:17px;letter-spacing:.02em;font-weight:600}
.mode span{font-size:12.5px;color:var(--muted);line-height:1.45}
.lvgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:6px;margin-top:8px}
.lv{border:1px solid var(--line);background:transparent;border-radius:4px;padding:7px 8px;cursor:pointer;
  color:var(--ink);font:inherit;font-size:12.5px;text-align:left;line-height:1.3}
.lv:hover{border-color:var(--accent)}
.lv[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.lv b{display:block;font-family:"Barlow Condensed",sans-serif;font-size:14px;letter-spacing:.02em}
.lv span{color:var(--faint);font-size:11px;font-family:"IBM Plex Mono",monospace}
.startfoot{display:flex;gap:10px;align-items:center;margin-top:18px}
.resume{margin-top:16px;border-top:1px solid var(--line);padding-top:13px}
.resume-list{display:flex;flex-direction:column;gap:4px;margin-top:7px;max-height:150px;overflow-y:auto}
.rsm{display:flex;align-items:baseline;gap:9px;padding:7px 9px;border-radius:4px;border:1px solid var(--line);
  background:transparent;color:var(--ink);font:inherit;font-size:13px;cursor:pointer;text-align:left}
.rsm:hover{border-color:var(--accent)}
.rsm .when{margin-left:auto;font-size:11px;color:var(--faint)}

/* ---- mission library ---- */
.start{align-items:start;overflow-y:auto}
.lib{width:100%;max-width:1180px;margin:18px auto;background:var(--surface);border:1px solid var(--line);
  border-radius:8px;box-shadow:var(--shadow);padding:22px 24px}
.lib-head{display:flex;gap:16px;align-items:flex-start;justify-content:space-between;margin-bottom:6px}
.lib-head h1{font-family:"Barlow Condensed",sans-serif;font-weight:600;letter-spacing:.02em;font-size:30px;margin:0 0 4px}
.lib-head .sub{color:var(--muted);margin:0;font:400 13.5px/1.5 "IBM Plex Sans",sans-serif;letter-spacing:0;text-transform:none;max-width:70ch}
.lib-acts{display:flex;gap:8px;flex:none}
.shelf{margin-top:18px}
.shelf-head{display:flex;align-items:baseline;gap:10px;border-bottom:1px solid var(--line);padding-bottom:6px;margin-bottom:12px}
.shelf-head h2{font-family:"Barlow Condensed",sans-serif;font-weight:600;letter-spacing:.03em;font-size:19px;margin:0;text-transform:uppercase}
.shelf-head .count{font:12px "IBM Plex Mono",monospace;color:var(--faint)}
.shelf-head .hint{margin:0 0 0 6px}
.shelf-head .btn{margin-left:auto;padding:2px 10px;font-size:12.5px}
.shelf-empty{border:1px dashed var(--line);border-radius:6px;padding:18px;text-align:center}
.shelf-empty p{margin:0 0 6px}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.mcard{position:relative;border:1px solid var(--line);border-radius:6px;background:var(--sunken);overflow:hidden;
  display:flex;flex-direction:column}
.mcard:hover{border-color:var(--accent)}
.mcard.current{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.mc-open{all:unset;cursor:pointer;display:flex;flex-direction:column;flex:1}
.mc-open:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.mc-img{display:block;position:relative;aspect-ratio:168/124;background:var(--ground) center/cover no-repeat;
  border-bottom:1px solid var(--line)}
.mc-tag,.mc-slot,.mc-num{position:absolute;font:600 11px "IBM Plex Mono",monospace;padding:2px 6px;border-radius:3px;
  background:color-mix(in srgb,var(--surface) 85%,transparent);color:var(--ink)}
.mc-tag{left:6px;bottom:6px}.mc-slot{right:6px;top:6px;color:var(--accent)}.mc-num{left:6px;top:6px}
.mc-lock{position:absolute;right:6px;top:6px;width:20px;height:20px;border-radius:3px;display:grid;place-items:center;
  background:color-mix(in srgb,var(--surface) 85%,transparent)}
.mc-lock svg{width:12px;height:12px;fill:none;stroke:var(--muted);stroke-width:1.3}
.mc-txt{display:flex;flex-direction:column;gap:2px;padding:8px 10px 10px;font-size:12.5px;color:var(--muted);line-height:1.4}
.mc-txt b{font-family:"Barlow Condensed",sans-serif;font-size:16px;letter-spacing:.02em;color:var(--ink);font-weight:600}
.mc-txt b em{font-style:normal;color:var(--accent);font-size:12px}
.mc-meta{font:11px "IBM Plex Mono",monospace;color:var(--faint)}
.mc-st{font-size:11.5px;color:var(--muted)}.mc-st.ok{color:var(--ok)}
.mc-more{position:absolute;right:6px;bottom:8px;padding:0 8px;font-size:16px;line-height:1.3}
.mc-from{margin:0 10px 10px;padding:3px 8px;font-size:12px}
.gslots{list-style:none;margin:0;padding:0;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.gs{display:flex;align-items:center;gap:12px;padding:8px 10px;border-top:1px solid var(--line);background:var(--sunken)}
.gs:first-child{border-top:0}
.gs.current{box-shadow:inset 3px 0 0 var(--accent)}
.gs-n{font:600 13px "IBM Plex Mono",monospace;color:var(--accent);min-width:2.2em;text-align:right;flex:none}
.gs-t{display:flex;flex-direction:column;gap:1px;min-width:0;flex:1;font-size:12.5px;color:var(--muted);line-height:1.4}
.gs-t b{font-family:"Barlow Condensed",sans-serif;font-size:16px;font-weight:600;letter-spacing:.02em;color:var(--ink)}
.gs-t .ok{color:var(--ok)}
.gs-acts{display:flex;gap:6px;flex:none}
.lib .gs-acts .btn{padding:2px 10px;font-size:12.5px}
.gs-move{display:flex;gap:2px;flex:none;min-width:56px;justify-content:flex-end}
.lib .gs-move .btn{padding:0 8px;font-size:14px;line-height:1.6}
.note.warn{background:color-mix(in srgb,var(--warn) 12%,transparent);color:var(--warn)}
@media (max-width:640px){.gs{flex-wrap:wrap}.gs-acts{margin-left:calc(2.2em + 12px)}}
.sheet-card.wide{max-width:980px}
.seg{display:inline-flex;gap:0}.seg .btn{border-radius:0}.seg .btn:first-child{border-radius:4px 0 0 4px}
.seg .btn:last-child{border-radius:0 4px 4px 0;margin-left:-1px}
.seg .btn.on{background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}
.picks{max-height:52vh;overflow-y:auto;margin-top:4px;padding-right:4px}
.pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:6px}
.pk{all:unset;cursor:pointer;border:1px solid var(--line);border-radius:5px;overflow:hidden;background:var(--sunken);
  display:flex;flex-direction:column;font-size:12px;color:var(--muted)}
.pk:hover{border-color:var(--accent)}
.pk[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.pk:focus-visible{outline:2px solid var(--accent)}
.pk-img{display:block;aspect-ratio:168/124;background:var(--ground) center/cover no-repeat}
.pk b{padding:5px 7px 0;color:var(--ink);font-weight:600;font-size:12.5px}
.pk span:not(.pk-img){padding:0 7px 6px;font-size:11px}
.pk b:last-child{padding-bottom:6px}
.brand{all:unset;cursor:pointer;display:flex;align-items:baseline;gap:8px}
.brand:focus-visible{outline:2px solid var(--accent)}
.savechip.ok{color:var(--ok)}
.readonly #panel-inv .inv-secs{opacity:.45;pointer-events:none}
.readonly #insp input,.readonly #insp select,.readonly #insp button{pointer-events:none;opacity:.55}
.banner .btn{margin-left:8px;padding:1px 9px;font-size:12.5px}

/* ---- apply / settings sheet ---- */
.sheet{position:fixed;inset:0;display:grid;place-items:center;padding:20px;z-index:30;
  background:color-mix(in srgb,var(--ground) 80%,transparent);backdrop-filter:blur(3px)}
.sheet[hidden]{display:none}
.sheet-card{background:var(--surface);border:1px solid var(--line);border-radius:8px;
  box-shadow:var(--shadow);padding:18px;width:100%;max-width:620px;max-height:100%;overflow-y:auto}
.sheet-head{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.sheet-head .lbl{font-size:14px;color:var(--ink)}
.sheet-head .btn{margin-left:auto;padding:2px 9px;font-size:17px;line-height:1.2}
.applylog{font-family:"IBM Plex Mono",monospace;font-size:12px;line-height:1.55;
  background:var(--sunken);border:1px solid var(--line);border-radius:5px;padding:10px;
  max-height:340px;overflow:auto;white-space:pre-wrap;word-break:break-word;margin:0}
.applylog .bad{color:var(--danger)}
/* Apply's progress: the map computer's CONNECTING bar, with what is happening under it */
.apbar{margin:4px 0 12px}
.apbar .ap-stage{display:flex;align-items:baseline;gap:10px;font:600 10.5px "IBM Plex Mono",monospace;letter-spacing:.16em;
  color:#7fe08a;text-transform:uppercase;margin:0 0 5px 1px}
.apbar .ap-stage b{font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.apbar .ap-stage em{font-style:normal;letter-spacing:.06em;color:var(--muted)}
.apbar .ap-track{height:26px;border:1px solid #4fd062;background:rgba(3,18,6,.72);box-shadow:0 0 14px rgba(80,255,110,.22);position:relative;overflow:hidden}
.apbar .ap-fill{height:100%;width:0;background:linear-gradient(90deg,#1b8a31,#3ed85b);box-shadow:0 0 10px rgba(80,255,110,.45);transition:width .45s ease}
.apbar .ap-track::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 22px,rgba(3,18,6,.55) 22px 24px)}
.apbar.run .ap-track::before{content:"";position:absolute;top:0;bottom:0;width:60px;left:-60px;z-index:1;
  background:linear-gradient(90deg,transparent,rgba(210,255,215,.35),transparent);animation:apscan 1.3s linear infinite}
@keyframes apscan{to{left:100%}}
@media (prefers-reduced-motion:reduce){.apbar.run .ap-track::before{animation:none;display:none}}
.apbar .ap-detail{font:11.5px "IBM Plex Mono",monospace;color:var(--muted);margin:6px 1px 0;min-height:1.4em;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.apbar.fail .ap-track{border-color:var(--danger);box-shadow:none}
.apbar.fail .ap-fill{background:var(--danger);box-shadow:none}
.apbar.fail .ap-stage{color:var(--danger)}
details.aplog summary{cursor:pointer;font-size:12px;color:var(--muted);margin:0 0 6px}
.ap-logbar{display:flex;justify-content:flex-end;margin-top:6px}
.ap-logbar .btn{padding:3px 10px;font-size:12px}
.ap-done{font-size:13px;line-height:1.5;margin:0 0 10px}
.applylog .good{color:var(--ok)}
.cfgrow{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:end;margin-bottom:12px}
.stat{display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--muted);margin:3px 0}
.stat b{width:9px;height:9px;border-radius:50%;flex:none;background:var(--ok)}
.stat b.no{background:var(--danger)}
/* ---------- buttons in dialogs and the library: the map computer's own keys ---------- */
.sheet .btn,.lib .btn{font-family:"Barlow Condensed","IBM Plex Sans",sans-serif;font-weight:600;font-size:14px;
  letter-spacing:.07em;text-transform:uppercase;padding:8px 16px;border-radius:3px;position:relative;
  background:linear-gradient(180deg,rgba(141,255,154,.08),rgba(141,255,154,.01));border:1px solid var(--line);
  color:var(--ink);transition:border-color .15s,color .15s,box-shadow .15s,transform .05s,background .15s}
.sheet .btn::before,.lib .btn::before{content:"";position:absolute;inset:-1px;border-radius:3px;pointer-events:none;
  background:linear-gradient(currentColor,currentColor) left top/9px 1px no-repeat,
             linear-gradient(currentColor,currentColor) left top/1px 9px no-repeat,
             linear-gradient(currentColor,currentColor) right bottom/9px 1px no-repeat,
             linear-gradient(currentColor,currentColor) right bottom/1px 9px no-repeat;
  opacity:.35;transition:opacity .15s}
.sheet .btn:hover,.lib .btn:hover{border-color:var(--player);color:var(--player);
  box-shadow:0 0 14px rgba(141,255,154,.2),inset 0 0 14px rgba(141,255,154,.07)}
.sheet .btn:hover::before,.lib .btn:hover::before{opacity:1}
.sheet .btn:active,.lib .btn:active{transform:translateY(1px)}
.sheet .btn.primary,.lib .btn.primary{background:linear-gradient(180deg,#ffe38e,#ffc933);border-color:#ffd24a;
  color:#1d1600;box-shadow:0 0 18px rgba(255,210,74,.22)}
.sheet .btn.primary:hover,.lib .btn.primary:hover{color:#1d1600;filter:none;box-shadow:0 0 26px rgba(255,210,74,.5)}
.sheet .btn.primary::before,.lib .btn.primary::before{opacity:.5}
.sheet .btn[disabled]{opacity:.45;cursor:default;box-shadow:none}
.sheet .sheet-head .btn{font-family:inherit;letter-spacing:0;text-transform:none;padding:2px 9px;font-size:17px}
.sheet .sheet-head .btn::before{display:none}
.lib .btn.mc-more{position:absolute;font-family:inherit;letter-spacing:0;text-transform:none;padding:0 8px;font-size:16px;line-height:1.3;
  background:transparent;border-color:transparent;box-shadow:none}
.lib .btn.mc-more::before{display:none}
.lib .btn.mc-more:hover{border-color:var(--line);box-shadow:none}

/* ---------- the setup: connecting a game ---------- */
.su-head{display:flex;align-items:center;gap:16px;margin:0 0 16px}
.su-radar{width:58px;height:58px;flex:none;border-radius:50%;border:1px solid var(--line);position:relative;overflow:hidden;
  background:radial-gradient(circle,rgba(141,255,154,.14) 0 3px,transparent 4px),
             repeating-radial-gradient(circle,transparent 0 9px,rgba(141,255,154,.13) 9px 10px),
             linear-gradient(rgba(141,255,154,.13),rgba(141,255,154,.13)) center/1px 100% no-repeat,
             linear-gradient(rgba(141,255,154,.13),rgba(141,255,154,.13)) center/100% 1px no-repeat,var(--sunken)}
.su-radar::before{content:"";position:absolute;inset:0;border-radius:50%;
  background:conic-gradient(from 0deg,rgba(141,255,154,.6),rgba(141,255,154,.0) 75deg,transparent 360deg);
  animation:su-sweep 2.2s linear infinite}
.su-radar::after{content:"";position:absolute;left:68%;top:30%;width:6px;height:6px;border-radius:50%;
  background:var(--accent);box-shadow:0 0 8px var(--accent);animation:su-blip 2.2s ease-out infinite}
.su-radar.done{border-color:var(--ok);box-shadow:0 0 14px rgba(95,212,111,.35)}
.su-radar.done::before{animation:none;background:radial-gradient(circle,rgba(95,212,111,.35),transparent 70%)}
.su-radar.done::after{animation:none;opacity:1;left:calc(50% - 3px);top:calc(50% - 3px);background:var(--ok);box-shadow:0 0 10px var(--ok)}
.su-radar.fail{border-color:var(--danger)}
.su-radar.fail::before{animation:none;background:radial-gradient(circle,rgba(255,107,90,.3),transparent 70%)}
.su-radar.fail::after{animation:none;background:var(--danger);box-shadow:0 0 10px var(--danger)}
@keyframes su-sweep{to{transform:rotate(360deg)}}
@keyframes su-blip{0%,55%{opacity:0}62%{opacity:1}100%{opacity:.1}}
.su-title{font-family:"Barlow Condensed",sans-serif;font-weight:600;font-size:24px;line-height:1.1;letter-spacing:.1em;
  text-transform:uppercase;color:var(--ink);position:relative;display:inline-block}
.su-title.glitch{animation:su-flicker 4s infinite;text-shadow:0 0 10px rgba(141,255,154,.35)}
.su-title.glitch::before,.su-title.glitch::after{content:attr(data-text);position:absolute;left:0;top:0;width:100%;
  overflow:hidden;clip-path:inset(0 0 100% 0)}
.su-title.glitch::before{color:#6fdcec;animation:su-glitch-a 2.9s infinite steps(1)}
.su-title.glitch::after{color:#ff5546;animation:su-glitch-b 3.7s infinite steps(1)}
@keyframes su-glitch-a{0%,90%,100%{transform:none;clip-path:inset(0 0 100% 0)}
  91%{transform:translate(-3px,1px);clip-path:inset(15% 0 60% 0)}94%{transform:translate(2px,-1px);clip-path:inset(62% 0 8% 0)}
  96%{transform:translate(-1px,0);clip-path:inset(40% 0 42% 0)}}
@keyframes su-glitch-b{0%,86%,100%{transform:none;clip-path:inset(0 0 100% 0)}
  87%{transform:translate(3px,0);clip-path:inset(45% 0 30% 0)}89%{transform:translate(-2px,1px);clip-path:inset(5% 0 78% 0)}}
@keyframes su-flicker{0%,100%{opacity:1}95%{opacity:.95}96%{opacity:.55}97%{opacity:1}98.5%{opacity:.8}}
.su-sub{font:12px "IBM Plex Mono",monospace;color:var(--muted);margin-top:4px;word-break:break-all}
.su-prog{position:relative;height:16px;border:1px solid var(--line);border-radius:3px;background:var(--sunken);overflow:hidden}
.su-prog i{position:absolute;left:0;top:0;bottom:0;width:0;transition:width .7s cubic-bezier(.2,.7,.2,1);
  background:repeating-linear-gradient(135deg,rgba(0,0,0,.2) 0 7px,transparent 7px 14px) 0 0/20px 20px,
             linear-gradient(90deg,#2f8f3f,#8dff9a);box-shadow:0 0 14px rgba(141,255,154,.55);
  animation:su-stripes .8s linear infinite}
.su-prog.done i{animation:none;background:linear-gradient(90deg,#3fae52,#8dff9a)}
.su-prog.fail i{background:var(--danger);animation:none}
.su-prog::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(90deg,transparent 0 9%,rgba(8,24,10,.55) 9% 10%)}
@keyframes su-stripes{to{background-position:20px 0,0 0}}
.su-meta{display:flex;justify-content:space-between;gap:10px;font:11.5px "IBM Plex Mono",monospace;color:var(--faint);margin:6px 0 14px}
.su-meta b{color:var(--player);font-weight:500}
.su-steps{list-style:none;margin:0;padding:0;display:grid;gap:2px;font-size:12.5px}
.su-steps li{display:flex;align-items:center;gap:10px;color:var(--faint);padding:4px 8px;border-radius:3px;
  border:1px solid transparent;transition:background .3s,color .3s}
.su-steps li .d{width:15px;height:15px;flex:none;border:1px solid var(--grid);border-radius:3px;display:grid;
  place-items:center;font-size:10px;line-height:1}
.su-steps li.done{color:var(--muted)}
.su-steps li.done .d{border-color:var(--ok);background:rgba(95,212,111,.18);color:var(--ok)}
.su-steps li.now{color:var(--ink);background:rgba(141,255,154,.07);border-color:rgba(141,255,154,.14)}
.su-steps li.now .d{border-color:var(--player);animation:su-pulse 1s ease-in-out infinite}
.su-steps li.now .d::after{content:"";width:5px;height:5px;border-radius:50%;background:var(--player)}
.su-steps li .x{margin-left:auto;font:11px "IBM Plex Mono",monospace;color:var(--faint)}
@keyframes su-pulse{50%{box-shadow:0 0 0 4px rgba(141,255,154,.14)}}
.su-tip{margin-top:14px;padding:9px 12px;border-left:2px solid var(--accent);background:var(--accent-soft);
  font-size:12.5px;color:var(--ink);min-height:38px;transition:opacity .45s}
.su-tip small{display:block;font:600 10.5px "Barlow Condensed",sans-serif;letter-spacing:.12em;text-transform:uppercase;
  color:var(--accent);margin-bottom:2px}
.su-list{display:grid;gap:8px;margin:0 0 6px}
.su-row{display:grid;grid-template-columns:16px 1fr;gap:8px;font-size:13px;color:var(--ink);align-items:start}
.su-row .dot{width:9px;height:9px;border-radius:50%;margin-top:5px;background:var(--ok);box-shadow:0 0 7px rgba(95,212,111,.7)}
.su-row .dot.info{background:var(--warn);box-shadow:0 0 7px rgba(255,177,59,.6)}
.su-row .dot.bad{background:var(--danger);box-shadow:0 0 7px rgba(255,107,90,.6)}
.su-row small{display:block;color:var(--faint);font-size:11.5px;margin-top:2px;line-height:1.4}
.su-row .mono{font-family:"IBM Plex Mono",monospace;font-size:12px}
.su-panel{border:1px solid var(--line);border-radius:4px;padding:10px 12px;margin:12px 0 0;background:rgba(0,0,0,.14)}
.su-actions{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;align-items:center;margin-top:16px}
.su-actions .grow{flex:1}
.su-foot{margin-top:12px;font-size:11.5px;color:var(--faint)}
.su-foot .mono{font-family:"IBM Plex Mono",monospace}
.su-found{display:grid;gap:6px;margin:6px 0 4px}
.su-found .f{display:flex;align-items:center;gap:12px;justify-content:space-between;padding:8px 10px;border:1px solid var(--line);
  border-radius:4px;background:rgba(0,0,0,.12)}
.su-found .f .mono{font-family:"IBM Plex Mono",monospace;font-size:12.5px;color:var(--ink)}
@media (prefers-reduced-motion:reduce){.su-radar::before,.su-radar::after,.su-title.glitch,.su-title.glitch::before,
  .su-title.glitch::after,.su-prog i,.su-steps li.now .d{animation:none}}

/* ---- side panels, chosen by tabs on the left wall ---- */
.tabs{flex:none;width:28px;display:flex;flex-direction:column;justify-content:center;gap:8px;
  background:var(--ground);border-right:1px solid var(--line)}
.tab{writing-mode:vertical-rl;transform:rotate(180deg);display:flex;align-items:center;gap:7px;
  border:1px solid var(--line);border-right:none;background:var(--surface);color:var(--muted);
  font:600 12px "Barlow Condensed",sans-serif;letter-spacing:.14em;text-transform:uppercase;
  padding:14px 5px;cursor:pointer;border-radius:0 5px 5px 0;margin-right:-1px}
.tab svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.8;transform:rotate(90deg)}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tab:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.panel{flex:none;width:var(--lw,272px);background:var(--surface);border-right:1px solid var(--line);
  display:flex;flex-direction:column;min-height:0;position:relative}
/* a panel's inner edge: drag it to make the panel wider or narrower */
.resizer{position:absolute;top:0;bottom:0;width:8px;cursor:col-resize;z-index:7;touch-action:none}
.resizer::after{content:"";position:absolute;top:0;bottom:0;left:3px;width:2px;background:transparent;transition:background .15s}
.resizer:hover::after,.resizer.on::after{background:var(--accent)}
.resizer.r{right:-4px}.resizer.l{left:-4px}.resizer.l0{left:0}
body.resizing{cursor:col-resize;user-select:none}
body.resizing canvas,body.resizing iframe{pointer-events:none}
/* structure categories: a row each; hovering one opens its list beside the panel */
.catrow{display:grid;grid-template-columns:28px 1fr 12px;gap:8px;align-items:center;width:100%;border:1px solid transparent;
  background:transparent;color:var(--ink);text-align:left;padding:4px 6px;border-radius:4px;cursor:pointer;font:13px "IBM Plex Sans",sans-serif}
.catrow:hover,.catrow[aria-expanded="true"]{background:var(--sunken);border-color:var(--line)}
.catrow[aria-expanded="true"]{border-color:var(--accent)}
.catrow .thumb{width:28px;height:28px;border-radius:3px;background:var(--sunken);display:grid;place-items:center;overflow:hidden}
.catrow .t{display:flex;flex-direction:column;line-height:1.2;min-width:0}
.catrow .t b{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.catrow .t span{font:10.5px "IBM Plex Mono",monospace;color:var(--faint)}
.catrow svg{width:10px;height:10px;fill:none;stroke:var(--muted);stroke-width:2;transform:rotate(-90deg)}
.invfly{position:fixed;z-index:25;width:310px;background:var(--surface);border:1px solid var(--line);border-left:2px solid var(--accent);
  border-radius:0 7px 7px 0;box-shadow:var(--shadow);display:flex;flex-direction:column}
.invfly[hidden]{display:none}
.fly-h{display:flex;align-items:center;gap:8px;padding:9px 10px 7px;border-bottom:1px solid var(--line)}
.fly-h b{font:600 14px "Barlow Condensed",sans-serif;letter-spacing:.06em;text-transform:uppercase;color:var(--ink);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fly-h .n{font:11px "IBM Plex Mono",monospace;color:var(--faint)}
.fly-h button{background:transparent;border:1px solid transparent;color:var(--muted);border-radius:4px;cursor:pointer;padding:1px 6px;font-size:12px}
.fly-h button:hover{color:var(--ink);border-color:var(--line)}
.fly-h button[aria-pressed="true"]{color:var(--accent);border-color:var(--accent)}
.fly-q{margin:7px 10px 4px;background:var(--sunken);border:1px solid var(--line);color:var(--ink);border-radius:4px;padding:5px 8px;font:12.5px "IBM Plex Sans",sans-serif}
.fly-b{flex:1;min-height:0;overflow-y:auto;padding:4px 6px 8px}
.fly-b .sub{margin:8px 5px 3px}
.panel[hidden]{display:none}
.panel-h{display:flex;align-items:center;gap:8px;padding:11px 12px 9px;border-bottom:1px solid var(--line)}
.panel-b{flex:1;min-height:0;overflow-y:auto;padding:10px}
.inv-search{padding:10px 10px 8px;border-bottom:1px solid var(--line)}
.inv-search input{width:100%;background:var(--sunken);border:1px solid var(--line);color:var(--ink);border-radius:4px;
  padding:5px 8px;font:inherit;font-size:12.5px}
.inv-search input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.inv-secs{flex:1;min-height:0;display:flex;flex-direction:column}
.isec{display:flex;flex-direction:column;min-height:0;border-bottom:1px solid var(--line)}
.isec[data-open="true"]{flex:1 1 0}
.isec[data-open="true"].big{flex-grow:1.8}
.isec .sec-h{padding:7px 10px}
.isec-b{flex:1;min-height:0;overflow-y:auto;padding:0 6px 8px}
.isec-b .sub{position:sticky;top:0;z-index:1;background:var(--surface);margin:0;padding:6px 5px 3px}
.isec-b .subh{display:flex;align-items:center;gap:6px;width:100%;border:none;border-radius:3px;cursor:pointer;text-align:left}
.subh svg{width:10px;height:10px;flex:none;fill:none;stroke:currentColor;stroke-width:2;transition:transform .15s}
.subh[aria-expanded="false"] svg{transform:rotate(-90deg)}
.subh .n{margin-left:auto;font:10px "IBM Plex Mono",monospace;letter-spacing:0;color:var(--faint)}
.subh:hover{color:var(--ink)}
.subh:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.navacts{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.navacts .btn{padding:2px 8px;font-size:12px}

/* ---- legend ---- */
.legendwrap{position:relative;pointer-events:auto}
.legendbtn{display:flex;align-items:center;gap:6px;height:38px;padding:0 11px;background:var(--surface);color:var(--ink);
  border:1px solid var(--line);border-radius:6px;box-shadow:var(--shadow);font:inherit;font-size:12.5px;cursor:pointer}
.legendbtn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round}
.legendbtn .n{font:10.5px "IBM Plex Mono",monospace;color:var(--faint);background:var(--sunken);border-radius:8px;padding:0 6px;line-height:16px}
.legendbtn .n:empty{display:none}
.legendbtn:hover,.legendbtn[aria-expanded="true"]{border-color:var(--accent)}
.legendbtn:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.legendpop{position:absolute;right:0;top:calc(100% + 6px);width:270px;max-height:min(70vh,560px);overflow-y:auto;
  background:var(--surface);border:1px solid var(--line);border-radius:6px;box-shadow:var(--shadow);padding:6px 10px 8px;z-index:8}
.legendpop[hidden]{display:none}
.lg-head{font:600 10.5px "Barlow Condensed",sans-serif;letter-spacing:.09em;text-transform:uppercase;color:var(--faint);margin:7px 0 2px}
.lg-row{display:flex;align-items:center;gap:9px;padding:2px 0;font-size:12px}
.lg-row b{font-weight:400;color:var(--ink);flex:1;min-width:0}
.lg-row .n{font:10.5px "IBM Plex Mono",monospace;color:var(--faint)}
.lg-row canvas{width:24px!important;object-fit:contain}

/* ---- the map computer's zoom transition, and its scanlines ---- */
.fx{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .1s;z-index:4}
.fx.on{opacity:1}
.fx canvas{position:absolute;inset:0;width:100%;height:100%}
.fx-bar{position:absolute;left:10%;right:10%;bottom:92px}
.fx-bar span{display:block;font:600 10px "IBM Plex Mono",monospace;letter-spacing:.18em;color:#7fe08a;margin:0 0 4px 1px}
.fx-bar div{height:26px;border:1px solid #4fd062;background:rgba(3,18,6,.72);box-shadow:0 0 14px rgba(80,255,110,.22)}
.fx-bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#1b8a31,#3ed85b);box-shadow:0 0 10px rgba(80,255,110,.45)}
.stage::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:1;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.09) 0 1px,transparent 1px 3px),
             radial-gradient(ellipse at center,transparent 62%,rgba(0,0,0,.32))}
.rightbar{margin-left:auto;display:flex;gap:8px;align-items:flex-start;pointer-events:none}
.rightbar>*{pointer-events:auto}

.lg-applied{display:flex;gap:8px;align-items:flex-start;margin:2px 0 8px;padding:7px 9px;border-radius:5px;background:var(--sunken);
  color:var(--muted);font-size:11.5px;line-height:1.45}
.lg-applied i{width:8px;height:8px;flex:none;border-radius:50%;background:var(--ok);margin-top:4px;box-shadow:0 0 6px var(--ok)}

/* ---- check list before Apply ---- */
.ck-sum{margin:0 0 6px;font-size:13px;color:var(--muted)}
.ck-sum .bad{color:var(--danger)}.ck-sum .good{color:var(--ok)}
.ck-h{margin:14px 0 4px}
.ck{display:grid;grid-template-columns:12px 1fr auto;gap:9px;align-items:start;padding:6px 2px;border-bottom:1px solid var(--line);font-size:13px}
.ck .ic{width:9px;height:9px;border-radius:50%;margin-top:5px}
.ck.error .ic{background:var(--danger);box-shadow:0 0 6px var(--danger)}
.ck.warn .ic{background:var(--warn)}
.ck.info .ic{background:var(--node)}
.ck .tx{display:flex;flex-direction:column;min-width:0}
.ck .tx b{font-weight:500}
.ck .meta{font:11px "IBM Plex Mono",monospace;color:var(--faint);word-break:break-word}
.ck .acts{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}
.ck .acts .btn{padding:1px 8px;font-size:12px;white-space:nowrap}
.ck-sumlist{margin:2px 0 8px;padding:0;list-style:none;display:grid;gap:3px}
.ck-sumlist li{display:flex;align-items:baseline;gap:8px;font-size:13px;padding-left:12px;position:relative}
.ck-sumlist li::before{content:"";position:absolute;left:0;top:6px;width:7px;height:7px;border-radius:50%;background:var(--ok)}
.ck-sumlist li.edited::before{background:var(--warn)}
.ck-sumlist li.removed::before{background:var(--danger)}
.ck-sumlist li.nav::before{background:var(--climb)}
.ck-sumlist li.obj::before{background:var(--accent)}
.ck-foot{display:flex;gap:8px;justify-content:flex-end;align-items:center;margin-top:16px}
.ck-foot .hint{margin-right:auto}
.btn[disabled]{opacity:.45;cursor:not-allowed;filter:none}

/* ---- sight lines ---- */
.sg-t{display:flex;gap:7px;align-items:center;margin:4px 0;color:var(--ink)}
.ob.ev .ob-h{cursor:pointer}
.ob.ev .ob-h b.ev-n{background:var(--electric);color:#1d0014}
.ev-chev{width:18px;height:18px;display:grid;place-items:center;color:var(--muted)}
.ev-chev svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;transition:transform .15s}
.ob.ev.open .ev-chev svg{transform:rotate(180deg)}
.ob.ev .ob-txt.ev-bad{color:var(--danger)}
.ob.ev select{width:calc(100% - 14px);margin-top:4px}
.sight-box{margin-top:10px;padding:8px 9px;border:1px solid var(--line);border-radius:5px;background:var(--sunken)}
.sight-f{display:grid;grid-template-columns:44px 1fr 86px;align-items:center;gap:8px;margin:5px 0;font-size:12px;color:var(--muted)}
.sight-f input[type=range]{width:100%;accent-color:var(--accent)}
.sight-f b{font:500 12px "IBM Plex Mono",monospace;color:var(--ink);text-align:right}
.sight-f b i{font-style:normal;color:var(--faint);font-size:10.5px}
.sight-box .btn{margin-top:4px;padding:2px 8px;font-size:11.5px}
.ob.ev input.ev-name{width:calc(100% - 14px);box-sizing:border-box}
.ob.ev>.sel{width:calc(100% - 14px);margin-top:7px}
.ob.ev .ev-do .sel{width:100%}
.ob.ev .ob-t .sel{width:auto;flex:1;min-width:0}
.ob.ev .ob-p{margin-left:7px}
.ob.ev .ev-do input[type=text]{box-sizing:border-box}
.ob.ev .ob-t{flex-wrap:wrap}
.ob.ev .ob-t select{width:auto;flex:1;margin:0}
.ev-l{margin-top:9px;font-size:10.5px}
.ev-do{margin-top:6px;padding:5px 7px 6px;border-left:2px solid var(--electric);background:var(--surface);border-radius:0 4px 4px 0}
.ev-do>*{margin-left:0!important;margin-right:0!important}
.ev-do select,.ev-do input[type=text]{width:100%!important}
.ev-do-h{display:flex;align-items:center;justify-content:space-between;font-size:12px;color:var(--ink)}
.ob.ev select.ev-add{margin-top:7px}
.sg-route{margin:4px 0 0;font-size:12px;color:var(--ink)}
.sg-route.bad{color:var(--danger)}
.ob-set{display:flex;align-items:center;gap:8px;margin-top:12px;padding:7px 8px;border:1px solid var(--line);border-radius:5px;background:var(--sunken)}
.ob-set span{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.3}
.ob-set i{font-style:normal;font-size:11px;color:var(--muted)}
.set-sec{margin:0 0 16px}.set-sec .lbl{margin-bottom:6px}
.set-row{display:flex;align-items:center;gap:8px;margin:6px 0;flex-wrap:wrap}
.set-row input[type=number]{width:64px}
.set-row input[type=range]{flex:1;min-width:140px;accent-color:var(--accent)}
.set-row .hint{margin:0}
.sg-stat{margin:6px 0;color:var(--muted);font-size:12px}
.sg-stat b{color:var(--accent);font-size:14px}.sg-stat .bad{color:var(--danger)}
.sg-h{margin:10px 0 3px}
.sg-row{display:flex;gap:8px}
.sg-f{display:flex;align-items:center;gap:5px;color:var(--muted);font-size:12px}
.sg-f input{width:58px;background:var(--sunken);border:1px solid var(--line);color:var(--ink);border-radius:4px;padding:3px 5px;font:12px "IBM Plex Mono",monospace}
.sg-f i{font-style:normal;color:var(--faint)}
#sg-tg .btn{padding:2px 9px;font-size:12px}

/* ---- shaping the ground ---- */
/* the Ground bar: the map's right edge, under the view buttons; its panel beside it */
.gbar{position:absolute;right:12px;top:108px;z-index:6;display:flex;flex-direction:column;gap:3px;
  padding:6px 5px 5px;background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow)}
.gbar:empty{display:none}
.gbar-t{font:600 9px "IBM Plex Mono",monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);text-align:center;margin:0 0 3px}
.gbar button{position:relative;width:54px;height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  border:1px solid transparent;border-radius:6px;background:transparent;color:var(--muted);cursor:pointer;font:500 10.5px "IBM Plex Sans",sans-serif;padding:0}
.gbar button svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.gbar button:hover:not(:disabled){color:var(--ink);background:var(--sunken);border-color:var(--line)}
.gbar button[aria-pressed=true]{color:var(--accent);border-color:var(--accent);background:var(--accent-soft)}
.gbar button:disabled{opacity:.38;cursor:not-allowed}
.gbar button .n{position:absolute;top:3px;right:4px;min-width:14px;height:14px;border-radius:7px;background:var(--accent);color:var(--accent-ink);
  font:700 9px/14px "IBM Plex Mono",monospace;font-style:normal;text-align:center;padding:0 3px}
.livepop{right:80px}
.mapcom-on #gbar{display:none}
.lv-run{display:flex;align-items:center;gap:6px;margin:4px 0;padding:4px 6px;border:1px solid var(--line);border-radius:5px;background:var(--sunken)}
.lv-run.on{border-color:#ffb13b}
.lv-run span{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.25;font-size:12px}
.lv-run i{font-style:normal;color:var(--muted);font-size:11px}
.gd-matpv{position:fixed;z-index:60;width:220px;padding:8px 8px 10px;background:var(--surface);border:1px solid var(--line);
  border-radius:8px;box-shadow:var(--shadow);pointer-events:none;display:flex;flex-direction:column;gap:2px}
.gd-matpv[hidden]{display:none}
.gd-mp-stage{display:block;width:100%;height:150px;border-radius:5px;background:var(--sunken)}
.gd-matpv b{margin-top:6px;font-size:13px;color:var(--ink)}
.gd-matpv i{font-style:normal;font-size:11px;color:var(--muted)}
.gd-mats{display:flex;flex-wrap:wrap;gap:4px;margin:4px 0 8px}
.gd-mat{display:flex;align-items:center;gap:6px;padding:3px 8px 3px 4px;border:1px solid var(--line);border-radius:4px;background:var(--sunken);
  color:var(--ink);font:inherit;font-size:12px;cursor:pointer}
.gd-mat i{width:16px;height:16px;border-radius:3px;border:1px solid rgba(0,0,0,.4)}
.gd-mat i.erase{background:repeating-linear-gradient(45deg,var(--surface) 0 3px,var(--danger) 3px 5px)}
.gd-mat.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.dr-list{margin:4px 0 0;padding-left:18px;font-size:12.5px;line-height:1.5;color:var(--ink)}
#dr-text{background:var(--sunken);color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:6px 8px;font:inherit;font-size:13px}
.ck-old{margin-top:10px}
.ck-old summary{cursor:pointer;color:var(--muted);font-size:12px}
.ck-old .ck{opacity:.7}
.mc-obj{margin:4px 0 6px;padding-left:20px;font-size:12px;line-height:1.45;color:var(--ink)}
.mc-obj li{margin:2px 0}
#groundpop{right:80px;top:108px;width:340px;max-height:calc(100% - 124px);overflow:hidden;padding:10px 12px 12px;display:flex;flex-direction:column}
#groundpop[hidden]{display:none}
.gd-budget{display:flex;align-items:center;gap:8px;margin:8px 0 2px;font-size:11.5px;color:var(--muted)}
.gd-budget i{flex:1;height:6px;border-radius:3px;background:var(--sunken);border:1px solid var(--line);overflow:hidden}
.gd-budget i b{display:block;height:100%;background:var(--ok)}
.gd-budget.near i b{background:var(--warn)}.gd-budget.over i b{background:var(--danger)}
.gd-budget em{font-style:normal;font:11px "IBM Plex Mono",monospace;color:var(--ink);min-width:3.5em;text-align:right}
.gd-budget.over em{color:var(--danger)}
#groundpop>.gd-head,#groundpop>.gd-new,#groundpop>.gd-lh,#groundpop>.gd-ingame{flex:none}
#groundpop>.gd-list{flex:1 1 auto;min-height:0;overflow-y:auto;padding-right:4px;align-content:start}
.gd-ingame{margin:8px 0 0;font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:6px}
.gd-ingame button{background:none;border:0;color:var(--accent);font:inherit;cursor:pointer;padding:0;text-decoration:underline}
.gd-head{display:flex;align-items:flex-start;gap:9px}
.gd-head>svg{width:26px;height:26px;flex:none;fill:none;stroke:var(--accent);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;margin-top:1px}
.gd-head .t{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.3}
.gd-head .t b{color:var(--ink);font-size:14px}
.gd-head .t i{font-style:normal;color:var(--muted);font-size:11.5px}
.gd-ib{width:28px;height:28px;flex:none;display:grid;place-items:center;padding:0;border:0;border-radius:6px;
  background:transparent;color:var(--muted);cursor:pointer}
.gd-ib svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.gd-ib:hover{color:var(--ink);background:var(--sunken)}
.gd-ib.on{color:var(--accent);background:var(--accent-soft)}
.gd-ib.danger:hover{color:var(--danger);background:color-mix(in srgb,var(--danger) 14%,transparent)}
.gd-ib:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.gd-new{margin:10px 0 0;padding:9px 10px;background:var(--sunken);border-radius:6px}
.gd-hint{margin:0;color:var(--muted);font-size:11.5px;line-height:1.45}
.gd-opts{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:8px}
.gd-opts .grp{display:flex;align-items:center;gap:2px}
.gd-opts .grp>span{color:var(--faint);font-size:11px;margin-right:4px}
.gd-seg{padding:3px 9px;border:1px solid var(--line);background:var(--sunken);color:var(--muted);font:12px "IBM Plex Sans",sans-serif;cursor:pointer;margin-left:-1px}
.gd-seg:first-of-type{border-radius:4px 0 0 4px}.gd-seg:last-child{border-radius:0 4px 4px 0}
.gd-seg:hover{color:var(--ink)}
.gd-seg.on{color:var(--accent);border-color:var(--accent);background:var(--accent-soft);position:relative}
.gd-seg:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.gd-f{display:flex;align-items:center;gap:5px;color:var(--muted);font-size:12px}
.gd-f input{width:58px;background:var(--surface);border:1px solid var(--line);color:var(--ink);border-radius:4px;padding:3px 5px;font:12px "IBM Plex Mono",monospace}
.gd-f input.wide{width:86px}
.gd-f i{font-style:normal;color:var(--faint)}
.gd-lh{display:flex;align-items:center;gap:6px;margin:14px 0 6px;font:600 10.5px "Barlow Condensed",sans-serif;letter-spacing:.09em;
  text-transform:uppercase;color:var(--faint)}
.gd-lh .n{font:600 10px "IBM Plex Mono",monospace;color:var(--muted);background:var(--sunken);border-radius:8px;padding:0 6px}
.gd-list{display:grid;gap:4px}
.gd-empty{margin:0;color:var(--faint);font-size:11.5px}
.gd-card{border:1px solid var(--line);border-radius:6px;background:var(--sunken)}
.gd-card:hover{border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
.gd-card.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 7%,var(--sunken))}
.gd-card.warn .gd-main b::after{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--warn);margin-left:7px;vertical-align:1px}
.gd-top{display:flex;align-items:center;gap:1px;padding:3px 4px 3px 3px}
.gd-main{flex:1;min-width:0;display:flex;align-items:center;gap:9px;border:0;background:transparent;color:var(--ink);cursor:pointer;
  padding:3px 4px;text-align:left;border-radius:4px}
.gd-main .mi{width:26px;height:26px;flex:none;display:grid;place-items:center;border-radius:6px;background:var(--surface)}
.gd-main .mi svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.gd-main .t{display:flex;flex-direction:column;min-width:0;line-height:1.3}
.gd-main .t b{font-weight:500;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gd-main .t i{font-style:normal;font:11px "IBM Plex Mono",monospace;color:var(--muted)}
.gd-edit{padding:4px 10px 10px 42px;display:grid;gap:8px}
.gd-edit .ln{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.gd-note{margin:0;padding:7px 9px;border-left:2px solid var(--ok);background:var(--surface);border-radius:0 4px 4px 0;
  color:var(--muted);font-size:11.5px;line-height:1.45}
.gd-note.warn{border-left-color:var(--warn);color:var(--ink)}

/* ---- objectives ---- */
.ob{border:1px solid var(--line);border-radius:6px;padding:0 0 7px;margin-bottom:7px;background:var(--sunken)}
.ob.bad{border-color:color-mix(in srgb,var(--danger) 60%,var(--line))}
.ob.picking{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.ob.dragging{opacity:.45}
.ob.over-top{box-shadow:0 -2px 0 var(--accent)}
.ob.over-bottom{box-shadow:0 2px 0 var(--accent)}
.ob>*{margin-left:7px;margin-right:7px}
.ob-h{display:flex;align-items:center;gap:6px;font-size:12.5px;padding:6px 0 0;cursor:grab;margin:0 7px}
.ob-h:active{cursor:grabbing}
.ob-h b{width:19px;height:19px;display:grid;place-items:center;background:var(--accent);color:var(--accent-ink);border-radius:3px;font:700 11px "IBM Plex Mono",monospace;flex:none}
.ob-h .ob-i{width:19px;height:19px;flex:none;display:grid;place-items:center;color:var(--accent)}
.ob-h .ob-i svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.ob-h span.ob-k{flex:1;min-width:0;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ob-h .ob-tag{flex:none;font:600 9px "IBM Plex Mono",monospace;letter-spacing:.07em;text-transform:uppercase;
  color:var(--muted);border:1px solid var(--line);border-radius:3px;padding:0 4px}
.ob-h .ob-grip{flex:none;color:var(--faint);letter-spacing:-1px;font-size:13px;cursor:grab}
.iconbtn{width:23px;height:23px;flex:none;display:grid;place-items:center;padding:0;border:1px solid transparent;border-radius:4px;
  background:transparent;color:var(--muted);cursor:pointer}
.iconbtn svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.iconbtn:hover{color:var(--accent);border-color:var(--accent)}
.iconbtn:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.iconbtn.on{color:var(--accent);border-color:var(--accent);background:var(--accent-soft)}
.iconbtn.danger:hover{color:var(--danger);border-color:var(--danger)}
.iconbtn:disabled{opacity:.35;cursor:default}
.ob-acts{display:flex;gap:2px;flex:none}
.ob input[type=text]{width:100%;margin-top:5px;background:var(--surface);border:1px solid var(--line);color:var(--ink);border-radius:4px;padding:4px 6px;font:inherit;font-size:12px}
.ob-t{display:flex;align-items:center;gap:6px;margin-top:5px;font-size:11.5px;color:var(--muted);flex-wrap:wrap}
.ob-t span{flex:1;min-width:0;font-family:"IBM Plex Mono",monospace;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ob-t span.bad,.ob-p{color:var(--danger)}
.ob-p{margin:4px 0 0;font-size:11.5px}
.ob-t .btn{padding:1px 8px;font-size:11.5px}
.ob-t input{width:44px;background:var(--surface);border:1px solid var(--line);color:var(--ink);border-radius:3px;padding:1px 4px;font:11px "IBM Plex Mono",monospace}
.ob-add{display:flex;flex-direction:column;gap:4px;max-height:232px;overflow-y:auto;padding-right:2px}
.ob-add .btn{display:flex;align-items:center;gap:9px;padding:6px 8px;font-size:12.5px;text-align:left;width:100%}
.ob-add .btn svg{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.ob-add .btn .t{display:flex;flex-direction:column;min-width:0;line-height:1.25}
.ob-add .btn .t b{font-weight:500}
.ob-add .btn .t i{font-style:normal;font-size:11px;color:var(--faint);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ob-add .btn:disabled{opacity:.45;cursor:default}
.ob-add .btn:disabled:hover{border-color:var(--line);color:var(--ink)}
.ob input[type=text]:disabled{color:var(--muted);cursor:default}
.ob-txt{margin:5px 7px 0;font-size:12px;line-height:1.4;color:var(--muted)}
.al-sum{margin:5px 7px 0;font-size:11.5px;color:var(--muted);line-height:1.4}
.al-grp{margin:7px 7px 0}
.al-grp .lbl{font-size:10.5px}
.al-chips{display:flex;flex-wrap:wrap;gap:1px;margin-top:2px}
.al-ic{width:38px;height:38px;display:grid;place-items:center;padding:0;border:none;border-radius:8px;
  background:transparent;cursor:pointer;opacity:.92}
.al-ic:hover{background:color-mix(in srgb,var(--ground) 72%,transparent);opacity:1}
.al-ic:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
/* what you can do with one part, on hovering it */
.al-bar{position:fixed;z-index:41;display:flex;gap:1px;padding:3px;border:1px solid var(--accent);border-radius:8px;
  background:var(--surface);box-shadow:var(--shadow)}
.al-bar button{width:28px;height:28px;display:grid;place-items:center;padding:0;border:none;border-radius:6px;
  background:transparent;color:var(--muted);cursor:pointer}
.al-bar button:hover{background:var(--accent-soft);color:var(--accent)}
.al-bar button.danger:hover{color:var(--danger);background:color-mix(in srgb,var(--danger) 14%,transparent)}
.al-bar svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.al-glyph{display:grid;place-items:center;line-height:0}
/* the tools at the top of the tab */
.sec-new{display:flex;align-items:center;gap:10px;width:100%;padding:9px 11px;text-align:left;
  border-color:color-mix(in srgb,var(--accent) 60%,var(--line));background:var(--accent-soft)}
.sec-new:hover{border-color:var(--accent)}
.sec-new.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.sec-new-i{flex:none;width:26px;height:26px;display:grid;place-items:center;border-radius:50%;background:var(--accent);color:var(--accent-ink)}
.sec-new-i svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.7}
.sec-new span{display:flex;flex-direction:column;min-width:0;line-height:1.3}
.sec-new b{font-size:13px;font-weight:600}
.sec-new i{font-style:normal;font-size:11px;color:var(--muted)}
.sec-tools{display:flex;flex-direction:column;gap:4px;margin-top:7px}
.sec-tool{display:flex;align-items:center;gap:10px;width:100%;padding:6px 8px;border:1px solid transparent;
  border-radius:6px;background:transparent;color:var(--ink);cursor:pointer;text-align:left}
.sec-tool .t{display:flex;flex-direction:column;min-width:0;line-height:1.25}
.sec-tool .t b{font:500 12.5px "IBM Plex Sans",sans-serif}
.sec-tool .t i{font-style:normal;font-size:10.5px;color:var(--faint);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sec-tool:hover{background:color-mix(in srgb,var(--ground) 72%,transparent)}
.sec-tool.on{border-color:var(--accent);background:var(--accent-soft)}
.sec-tool:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
/* the systems take what is left, and scroll on their own */
#panel-sec .panel-b{display:flex;flex-direction:column;min-height:0;overflow:hidden}
.sec-list{flex:1;min-height:0;overflow-y:auto;padding-right:2px}
.al-fold{width:16px;height:16px;flex:none;display:grid;place-items:center;padding:0;border:none;background:transparent;
  color:var(--muted);cursor:pointer}
.al-fold svg{width:10px;height:10px;fill:none;stroke:currentColor;stroke-width:2;transition:transform .15s}
.al-fold[aria-expanded="false"] svg{transform:rotate(-90deg)}
.al-fold:hover{color:var(--accent)}
.ob.alarm[data-open="false"] .al-sum,.ob.alarm[data-open="false"] .al-grp,.ob.alarm[data-open="false"] .al-add{display:none}
.ob.alarm[data-open="false"]{padding-bottom:6px}
.secmenu{position:fixed;z-index:40;min-width:186px;background:var(--surface);border:1px solid var(--accent);border-radius:7px;
  box-shadow:var(--shadow);padding:4px;display:flex;flex-direction:column;gap:1px}
.secmenu-h{font:600 11px "IBM Plex Mono",monospace;color:var(--faint);padding:4px 7px 5px;border-bottom:1px solid var(--line);
  margin-bottom:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.secmenu button{border:none;background:transparent;color:var(--ink);text-align:left;padding:5px 8px;border-radius:4px;
  font:12.5px "IBM Plex Sans",sans-serif;cursor:pointer}
.secmenu button:hover{background:var(--accent-soft);color:var(--accent)}
/* ---- one look for every tooltip and dropdown ---- */
.tip{position:fixed;z-index:60;max-width:280px;padding:6px 9px;border:1px solid var(--accent);border-radius:6px;
  background:var(--surface);color:var(--ink);box-shadow:var(--shadow);font:12px/1.45 "IBM Plex Sans",sans-serif;
  pointer-events:none;opacity:0;transform:translateY(-2px);transition:opacity .09s ease,transform .09s ease}
.tip.on{opacity:1;transform:none}
.tip b{display:block;font-weight:600;margin-bottom:2px}
.sel{position:relative;display:block;width:100%}
.sel>select{position:absolute;inset:0;opacity:0;pointer-events:none}
.sel-btn{display:flex;align-items:center;gap:7px;width:100%;padding:4px 7px;border:1px solid var(--line);border-radius:4px;
  background:var(--sunken);color:var(--ink);font:inherit;font-size:12.5px;text-align:left;cursor:pointer}
.sel-btn span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sel-btn svg{width:11px;height:11px;flex:none;fill:none;stroke:currentColor;stroke-width:2;transition:transform .12s}
.sel-btn:hover{border-color:var(--accent)}
.sel-btn:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.sel.open .sel-btn{border-color:var(--accent)}
.sel.open .sel-btn svg{transform:rotate(180deg)}
.sel-btn:disabled{opacity:.55;cursor:default}
.sel-pop{position:fixed;z-index:61;min-width:160px;max-height:260px;overflow-y:auto;padding:4px;
  background:var(--surface);border:1px solid var(--accent);border-radius:6px;box-shadow:var(--shadow)}
.sel-pop .grp{font:600 10px "IBM Plex Mono",monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);
  padding:6px 8px 3px}
.sel-pop button{display:flex;align-items:center;gap:7px;width:100%;border:none;background:transparent;color:var(--ink);
  text-align:left;padding:5px 8px;border-radius:4px;font:12.5px "IBM Plex Sans",sans-serif;cursor:pointer}
.sel-pop button:hover,.sel-pop button.mark{background:var(--accent-soft);color:var(--accent)}
.sel-pop button[aria-selected="true"]::after{content:"✓";margin-left:auto;font-size:11px}
.al-note{font-size:11.5px;color:var(--faint)}
.al-note.bad{color:var(--danger)}
.al-add{margin:9px 7px 0}
.al-add .btn{width:100%;padding:4px 8px;font-size:12px}
.ob.alarm .ob-h{cursor:pointer}

/* ---- groups ---- */


/* ---- live view ---- */
.livepop{position:absolute;right:12px;top:108px;width:292px;background:var(--surface);border:1px solid var(--line);
  border-radius:6px;box-shadow:var(--shadow);padding:8px 12px 12px;z-index:7;font-size:12.5px}
.livepop[hidden]{display:none}
.lv-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
.lv-h .btn{padding:0 8px;font-size:17px;line-height:1.3}
.lv-st{display:flex;align-items:center;gap:8px;margin:2px 0 4px}
.lv-st i{width:9px;height:9px;border-radius:50%;background:var(--faint);flex:none}
.lv-st.ok i{background:var(--ok);box-shadow:0 0 8px var(--ok)}
.lv-st.warn i{background:var(--warn)}
.lv-st.bad i{background:var(--danger)}
.lv-msg{margin:0 0 6px}
.lv-pos{margin:0 0 8px;font-size:12px;color:var(--ink)}
.lv-row{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:6px 0}
.lv-row label{display:flex;gap:5px;align-items:center;color:var(--muted)}
.lv-row input:not([type]){width:31%;background:var(--sunken);border:1px solid var(--line);color:var(--ink);border-radius:4px;padding:4px 6px;font-size:12px}
.lv-row .btn{margin-left:auto;padding:2px 9px;font-size:12px}
.lv-man{margin-top:8px}
.lv-man summary{cursor:pointer;color:var(--muted);font-size:12px}
.livepop .btn.block{margin-top:4px}

/* ---- 3D preview ---- */
.pv{margin:0 0 10px;border:1px solid var(--line);border-radius:6px;overflow:hidden;
  background:radial-gradient(ellipse at 50% 60%,#123a18,#07160a 75%)}
.pv-canvas{display:block;width:100%;height:176px;cursor:grab;touch-action:none}
.pv-canvas:active{cursor:grabbing}
.pv-cap{display:flex;justify-content:space-between;gap:8px;padding:4px 8px 5px;border-top:1px solid var(--line);
  font:10.5px "IBM Plex Mono",monospace;color:var(--faint)}
.hovercard{position:fixed;z-index:30;width:250px;background:var(--surface);border:1px solid var(--line);border-radius:7px;
  box-shadow:var(--shadow);overflow:hidden;pointer-events:none}
.hovercard[hidden]{display:none}
.hovercard .pv{margin:0;border:none;border-radius:0}
.hovercard .pv-canvas{height:180px}
.hovercard .hc-t{padding:6px 10px 8px;border-top:1px solid var(--line)}
.hovercard .hc-t b{display:block;font-size:13px;font-weight:600}
.hovercard .hc-t span{font:10.5px "IBM Plex Mono",monospace;color:var(--faint)}
.pv{position:relative}
.pv-x{position:absolute;top:6px;right:6px;z-index:1;width:26px;height:26px;display:grid;place-items:center;padding:0;
  border:1px solid var(--line);border-radius:5px;background:rgba(3,16,6,.72);color:var(--muted);cursor:pointer}
.pv-x:hover{color:var(--accent);border-color:var(--accent)}
.pv-x:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.pv-x svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
/* the big 3D preview */
.bigpv{position:fixed;inset:0;z-index:40;display:grid;place-items:center;padding:24px;
  background:color-mix(in srgb,var(--ground) 78%,transparent);backdrop-filter:blur(3px)}
.bigpv[hidden]{display:none}
.bigpv-card{width:min(1100px,100%);background:var(--surface);border:1px solid var(--line);border-radius:9px;box-shadow:var(--shadow);overflow:hidden}
.bigpv-head{display:flex;align-items:center;gap:12px;padding:10px 14px;border-bottom:1px solid var(--line)}
.bigpv-head b{font-size:14px;font-weight:600}
.bigpv-head span{font:11px "IBM Plex Mono",monospace;color:var(--faint)}
.bigpv-head .btn{margin-left:auto}
.bigpv .pv{margin:0;border:none;border-radius:0}
.bigpv .pv-canvas{height:min(68vh,720px)}
/* hovering the map */
.maphover{position:fixed;z-index:25;width:272px;background:var(--surface);border:1px solid var(--line);border-radius:8px;
  box-shadow:var(--shadow);overflow:hidden;pointer-events:none}
.maphover[hidden]{display:none}
.maphover .pv{margin:0;border:none;border-radius:0;border-bottom:1px solid var(--line)}
.maphover .pv-canvas{height:150px}
.mh-b{padding:8px 11px 10px}
.mh-h{display:flex;align-items:center;gap:7px;min-width:0}
