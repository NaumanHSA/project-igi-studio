.mh-h b{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ================= the look of the site: the map computer's keys and panels ================= */
/* text is for reading, not selecting: only what you type, the AI designer's chat,
   and the logs, which are there to be pasted into a bug report */
body{-webkit-user-select:none;user-select:none}
input,textarea,select,[contenteditable="true"],.ai-log,.ai-log *,.applylog,.applylog *{-webkit-user-select:text;user-select:text}
/* the top bar: the studio and the mission on the left, the view in the middle, the rest on the right */
/* The layers, bottom to top: the workspace (the map, its bars, the 3D view: all
   kept inside it), the top bar and its menus, then everything that pops up over
   both (hover cards 25-41, the Settings and other sheets 30, the category list
   55, tooltips 60, the right-click menu 70). */
.workspace{isolation:isolate}
.topbar{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:14px;padding:7px 14px;
  padding-top:calc(7px + env(safe-area-inset-top,0px));background:linear-gradient(180deg,#10301a,#0a2010);position:relative;z-index:10;
  border-bottom:1px solid var(--line);box-shadow:0 6px 18px rgba(0,0,0,.35)}
.topbar::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;pointer-events:none;opacity:.7;
  background:linear-gradient(90deg,transparent,rgba(141,255,154,.6),transparent)}
.tb-left,.tb-right{display:flex;align-items:center;gap:10px;min-width:0}
.tb-right{justify-content:flex-end}
.tb-mid{display:flex;justify-content:center}
.brand{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;padding:2px 8px 2px 2px;border-radius:3px;flex:none}
.brand:focus-visible{outline:2px solid var(--accent)}
.brand-logo{width:30px;height:30px;flex:none;filter:drop-shadow(0 0 8px rgba(141,255,154,.45))}
.brand-t{display:flex;flex-direction:column;line-height:1.05;min-width:0}
.brand-t b{font:600 18px "Barlow Condensed",sans-serif;letter-spacing:.12em;text-transform:uppercase;color:#eaffec;white-space:nowrap}
.brand-t b em{font-style:normal;color:var(--player)}
.brand-t span{font:500 10px "IBM Plex Mono",monospace;letter-spacing:.12em;color:var(--faint);text-transform:uppercase;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:210px}
.brand:hover .brand-t b{color:var(--player)}
.mission-name{background:rgba(3,11,4,.6);border-color:var(--line);border-radius:3px;height:32px;min-width:150px;flex:0 1 220px;
  font:500 14px "IBM Plex Sans",sans-serif;transition:border-color .15s,box-shadow .15s}
.mission-name:hover{border-color:#3b8a45}
.mission-name:focus-visible{outline:none;border-color:var(--player);box-shadow:0 0 0 2px rgba(141,255,154,.18)}
.tb-right .savechip{overflow:hidden;text-overflow:ellipsis;min-width:0}
#modechip{flex:0 1 auto}
/* the view: the map computer, or the level in 3D */
.viewswitch{display:inline-flex;padding:3px;gap:3px;background:rgba(3,11,4,.72);border:1px solid var(--line);border-radius:4px;
  box-shadow:inset 0 0 12px rgba(0,0,0,.45)}
.viewswitch button{all:unset;cursor:pointer;min-width:58px;text-align:center;padding:5px 16px;border-radius:2px;
  font:600 14px "Barlow Condensed",sans-serif;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);
  transition:color .15s,background .15s,box-shadow .15s}
.viewswitch button:hover{color:var(--player)}
.viewswitch button.on{color:#06140a;background:linear-gradient(180deg,#b3ffbc,#6fe07f);box-shadow:0 0 16px rgba(141,255,154,.42)}
.viewswitch button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
/* keys everywhere: crisp, a glow when the pointer is on them; gold for the one that matters */
.btn{border-radius:3px;transition:border-color .15s,color .15s,background .15s,box-shadow .15s,transform .05s}
.btn:hover{border-color:var(--player);color:var(--player);box-shadow:0 0 12px rgba(141,255,154,.16)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:linear-gradient(180deg,#ffe38e,#ffc933);border-color:#ffd24a;color:#1d1600;box-shadow:0 0 16px rgba(255,210,74,.22)}
.btn.primary:hover{color:#1d1600;filter:none;box-shadow:0 0 24px rgba(255,210,74,.5)}
.btn[disabled]{opacity:.45;cursor:default;box-shadow:none;transform:none}
a.btn{display:inline-flex;align-items:center;text-decoration:none}
/* the top bar's keys are the site's: condensed capitals, cut corners */
.topbar .btn{font:600 14px "Barlow Condensed","IBM Plex Sans",sans-serif;letter-spacing:.1em;text-transform:uppercase;padding:7px 14px;
  background:linear-gradient(180deg,rgba(141,255,154,.08),rgba(141,255,154,.01));
  clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px)}
.topbar .btn.primary{background:linear-gradient(180deg,#ffe38e,#ffc933);padding:7px 18px}
.topbar .menubtn svg{width:11px;height:11px}
/* menus: a lit panel, a gold mark on the item under the pointer */
.menu{background:linear-gradient(180deg,#0f2b13,#0a200e);border:1px solid var(--line);border-top:2px solid var(--player);border-radius:3px;
  box-shadow:0 18px 40px rgba(0,0,0,.55),0 0 26px rgba(141,255,154,.08);padding:5px}
.menu .mi{border-radius:2px;padding:7px 12px 7px 15px;transition:background .12s,color .12s}
.menu .mi:hover,.menu .mi:focus-visible{background:rgba(141,255,154,.09);color:var(--player)}
.menu .mi:hover::before,.menu .mi:focus-visible::before{content:"";position:absolute;left:4px;top:7px;bottom:7px;width:2px;
  background:var(--accent);box-shadow:0 0 6px rgba(255,210,74,.7)}
.menu .mi[disabled]:hover::before{display:none}
.menu .mi.danger:hover{color:var(--danger);background:rgba(255,107,90,.1)}
.menu .mh{color:var(--accent);letter-spacing:.14em;padding:8px 12px 4px}
.menu .sep{height:0;background:none;border-top:1px dashed var(--grid);margin:5px 6px}
/* a category's list beside the inventory: rows with room, and over the 3D view too */
.invfly{z-index:55}
.fly-b .item{padding:6px 8px;gap:10px;margin:0 0 2px;border-radius:3px}
.fly-b .item .thumb{width:34px;height:34px}
.fly-b .item .t{gap:2px}
.fly-b .item .t b{font-size:13px}
/* ---- settings: a list down the side ---- */
.sheet-card.settings{max-width:900px;padding:0;overflow:hidden;display:flex;flex-direction:column;height:min(660px,calc(100vh - 40px))}
.sheet-card.settings .sheet-head{padding:12px 18px;margin:0;border-bottom:1px solid var(--line);background:rgba(3,11,4,.35)}
.sheet-card.settings #sheet-body{flex:1;min-height:0}
.set-wrap{display:grid;grid-template-columns:196px minmax(0,1fr);height:100%}
.set-nav{display:flex;flex-direction:column;gap:3px;padding:12px 10px;border-right:1px solid var(--line);background:rgba(3,11,4,.35)}
.set-nav button{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:3px;position:relative;
  border:1px solid transparent;font:600 14px "Barlow Condensed",sans-serif;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}

.set-nav button:hover{color:var(--player);background:rgba(141,255,154,.05)}
.set-nav button.on{color:#eaffec;background:rgba(141,255,154,.09);border-color:var(--line)}
.set-nav button.on::before{content:"";position:absolute;left:-1px;top:7px;bottom:7px;width:3px;background:var(--accent);box-shadow:0 0 8px rgba(255,210,74,.6)}
.set-nav button:focus-visible{outline:2px solid var(--accent)}
.set-panes{min-width:0;overflow-y:auto;padding:18px 22px 20px}
.set-pane[hidden]{display:none}
.set-h{margin:0 0 6px;font:600 22px "Barlow Condensed",sans-serif;letter-spacing:.08em;text-transform:uppercase;color:#eaffec}
.set-lead{margin:0 0 16px;font-size:13px;line-height:1.55;color:var(--muted)}
.set-pane .field{margin:0 0 12px}
.set-pane .field .lbl{margin:0 0 3px}
.set-pane input:not([type=checkbox]):not([type=range]),.set-pane select{background:var(--sunken);border:1px solid var(--line);color:var(--ink);
  border-radius:3px;padding:7px 9px;font:13px "IBM Plex Sans",sans-serif;width:100%;min-width:0}
.set-pane input:focus-visible,.set-pane select:focus-visible{outline:none;border-color:var(--player);box-shadow:0 0 0 2px rgba(141,255,154,.18)}
.set-pane .hint{margin:-4px 0 12px;font-size:12px;line-height:1.5}
.set-path{display:flex;gap:8px}.set-path input{flex:1}
.set-row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.set-check{display:flex;gap:8px;align-items:center;margin:8px 0;font-size:13px;color:var(--ink);cursor:pointer}

/* Settings, About: the studio, then links, one a line, each with what it is */
.ab-hero{display:flex;gap:16px;align-items:center;padding:2px 0 16px;border-bottom:1px dashed var(--grid)}

// the yard is a dense cluster; scattered hillside props would otherwise shrink
// the part you actually edit into a corner
function contentBounds(all){
  if(!LEVEL||!LEVEL.objects.length)return {minX:0,maxX:1,minY:0,maxY:1};
  var pool=LEVEL.objects.filter(function(o){
    return all||o.type==="building"||o.type==="door"||o.type==="soldier"
        ||o.type==="player"||o.type==="pickup"||o.type==="terminal"});
  if(pool.length<4)pool=LEVEL.objects;
  pool=pool.concat(placements);
  var xs=pool.map(function(o){return o.x}).sort(function(a,b){return a-b}),
      ys=pool.map(function(o){return o.y}).sort(function(a,b){return a-b});
  // "yard" ignores the few far-off outliers (a distant HQ, a cutscene helipad)
  // that would otherwise shrink the part you edit into a corner
  var cut=all||xs.length<20?0:Math.floor(xs.length*0.04);
  return {minX:xs[cut],maxX:xs[xs.length-1-cut],minY:ys[cut],maxY:ys[ys.length-1-cut]};
}
// Where the mission is played: the level's things, or on an empty map (which
// has next to none) its walkways, with what the mission has placed.
function playBounds(){
  // An empty map has next to nothing on it, so what bounds it is where its
  // ground is: the height grid the studio extracted round where the level is
  // played. (Its walkways are no good for this: some graphs hold offsets from
  // a graph origin, so their raw coordinates run off the map.)
  if(MODE==="empty"&&TERR&&TERR.meta){
    var m=TERR.meta;
    return {minX:m.x0,maxX:m.x0+(m.w-1)*m.cell,minY:m.y0,maxY:m.y0+(m.h-1)*m.cell};
  }
  var b=contentBounds(false);
  if(LEVEL&&LEVEL.objects.length+placements.length<4&&GRAPHS){
    var xs=[],ys=[];
    for(var g in GRAPHS)nodesOf(g).forEach(function(n){xs.push(n.x);ys.push(n.y)});
    placements.forEach(function(p){xs.push(p.x);ys.push(p.y)});
    if(xs.length)b={minX:Math.min.apply(null,xs),maxX:Math.max.apply(null,xs),minY:Math.min.apply(null,ys),maxY:Math.max.apply(null,ys)};
  }
  return b;
}
function fit(all){
  if(!LEVEL)return;
  var b=contentBounds(all),pad=48;
  view.k=Math.min((W-pad*2)/Math.max(1,b.maxX-b.minX),(H-pad*2)/Math.max(1,b.maxY-b.minY));
  view.cx=(b.minX+b.maxX)/2;view.cy=(b.minY+b.maxY)/2;
  if(window.MapFX)MapFX.glitch(1);
  draw();
}
function zoomAt(f,sx,sy){
  var a=s2w(sx,sy),k0=view.k;view.k=Math.max(.05,Math.min(20,view.k*f));var b=s2w(sx,sy);
  view.cx+=a[0]-b[0];view.cy+=a[1]-b[1];
  if(window.MapFX&&view.k!==k0)MapFX.glitch(0.55);
  draw();
}

// how far from its position an object can reach, in metres (for culling)
function reachOf(o,s){
  var z=MODELS&&MODELS.sizes&&MODELS.sizes[o.model];
  if(!z||!z.w)return 3;
  return Math.hypot(z.w,z.d)/2+Math.hypot(z.cx||0,z.cy||0)+1;

function visible(o){
  if(o.own)return true;
  if(o.id!=null&&removals.indexOf(o.id)>=0)return false;   // removed by this mission
  if(isRemoved(o))return false;
  if(o.cutscene&&!layers.cutscene)return false;
  if(isWall(o))return false;             // drawn as a line by drawWalls
  // vehicles, cameras, switches and things that blow up count as props
  // the mission's own alarm kit shows and hides with the cameras

    :/^(vehicle|explodable|switch)$/.test(o.type)?"prop":o.type;

/* ---------------- security cameras ---------------- */
// The game's SCamera: a holder on a wall with the camera on it, tilted down a
// little, sweeping so many degrees right and left at a set speed with a pause at
// each end, seeing a cone so wide and so long. Every shipped camera uses the same
// models (313_01_1 holder, 313_02_1 camera, 313_03_1 destroyed). The heading
// follows the same rule as guards: gamma 0 looks north.
var CAM_MODELS={holder:"313_01_1",camera:"313_02_1",destroyed:"313_03_1"};
var CAM_KINDS=[
  {id:"SCAM_SWEEP",label:"Security camera, sweeping",cam:{pitch:-0.15,pan:0,right:45,left:45,speed:20,delay:3,fovV:90,fov:60,range:30,on:"1"}},
  {id:"SCAM_FIXED",label:"Security camera, fixed",cam:{pitch:-0.15,pan:0,right:0,left:0,speed:0,delay:0,fovV:90,fov:60,range:30,on:"1"}}
];
function camOf(o){return o.cam||{pitch:0,pan:0,right:0,left:0,speed:0,delay:0,fovV:90,fov:60,range:30}}
function camHeading(o){return (o.gamma||0)+(camOf(o).pan||0)+Math.PI/2}
// Where a camera goes when you click near (wx, wy): on the nearest wall or
// building edge within 4 m, facing away from it, near the top; otherwise on its
// own 3 m up. R turns it from there.
// Cameras hang high, buttons at hand height, sirens and lights high up: the
// same wall search, asked for a different height.
var MOUNT_AT={camera:{pref:4.5,min:2.2},switch:{pref:1.3,min:1.0},siren:{pref:4.5,min:2.5},alarmlight:{pref:4.0,min:2.2}};
function partMount(kind,wx,wy,turn){
  var want=MOUNT_AT[kind]||MOUNT_AT.camera,keep=MOUNT_PREF;
  MOUNT_PREF=want;
  try{return camMount(wx,wy,turn)}finally{MOUNT_PREF=keep}
}
var MOUNT_PREF=MOUNT_AT.camera;
function camMount(wx,wy,turn){
  var best=null;
  function offer(d,px,py,nx,ny,top,what){
    if(d>4||(best&&d>=best.d))return;
    best={d:d,x:px+nx*0.15,y:py+ny*0.15,nx:nx,ny:ny,top:top,what:what};
  }
  walls().forEach(function(sg){
    if(!wallShown(sg)||sg.kind==="climb"||sg.kind==="electric")return;
    var ax=sg.a[0],ay=sg.a[1],vx=sg.b[0]-ax,vy=sg.b[1]-ay,L=vx*vx+vy*vy;if(!L)return;
    var t=Math.max(0,Math.min(1,((wx-ax)*vx+(wy-ay)*vy)/L)),px=ax+vx*t,py=ay+vy*t,d=Math.hypot(wx-px,wy-py);
    var len=Math.sqrt(L),nx=-vy/len,ny=vx/len;
    if((wx-px)*nx+(wy-py)*ny<0){nx=-nx;ny=-ny}
    var z=MODELS.sizes[sg.o.model],h=z&&z.h?z.h:2.5;
    offer(d,px,py,nx,ny,sg.o.z+Math.max(MOUNT_PREF.min,Math.min(h-0.35,MOUNT_PREF.pref)),displayName(sg.o));
  });
  // buildings and big props: on a real wall of the model, not on its bounding
  // box - the radar building's base wall stands well inside the dome above it
  var mountable=function(q){
    // trees, lamps, poles and fittings are not something to bolt a camera to
    return !(window.PlanIcons&&/^(tree|bush|lamp|pole|computer|camera|switch)$/.test(PlanIcons.propIcon(q)||""));
  };
  var blds=(LEVEL?LEVEL.objects.filter(function(q){return (q.type==="building"||q.type==="prop")&&!q.cutscene&&!isWall(q)&&visibleForBuild(q)&&mountable(q)}):[])
    .concat(placements.filter(function(q){return q.type==="building"&&mountable(q)}));
  var mountGround=groundAt(wx,wy);
  blds.forEach(function(b){
    var sz=MODELS&&MODELS.sizes&&MODELS.sizes[b.model];
    if(!sz||!(sz.h>=2.5)||Math.hypot(b.x-wx,b.y-wy)>Math.hypot(sz.w,sz.d)/2+Math.hypot(sz.cx||0,sz.cy||0)+6)return;
    var faces=window.MeshSprites&&MeshSprites.ready()?MeshSprites.walls(b.model):null;
    var g=b.gamma||0,c=Math.cos(g),sn=Math.sin(g),dx=wx-b.x,dy=wy-b.y,mx=dx*c+dy*sn,my=-dx*sn+dy*c;
    if(faces&&faces.length){
      var gz=mountGround!=null?mountGround:b.z;
      faces.forEach(function(F){
        var top=b.z+F.z1,foot=b.z+F.z0;
        if(top<gz+2.2||foot>gz+6)return;            // out of reach, or a wall high in the air
        var vx=F.x2-F.x1,vy=F.y2-F.y1,L=vx*vx+vy*vy;if(!L)return;
        var t=Math.max(0,Math.min(1,((mx-F.x1)*vx+(my-F.y1)*vy)/L));
        var px=F.x1+vx*t,py=F.y1+vy*t,d=Math.hypot(mx-px,my-py);
        if(d>4)return;
        var ex=F.nx,ey=F.ny;
        if((mx-px)*ex+(my-py)*ey<0){ex=-ex;ey=-ey}    // face the side the cursor is on
        var z=Math.min(top-0.35,gz+MOUNT_PREF.pref);
        z=Math.max(z,Math.min(top-0.35,gz+MOUNT_PREF.min),foot+0.35);
        offer(d,b.x+px*c-py*sn,b.y+px*sn+py*c,ex*c-ey*sn,ex*sn+ey*c,z,displayName(b));
      });
      return;
    }
    // no mesh for this model: its collision footprint, as before
    if(!sz.body)return;
    sz.body.forEach(function(r){
      var x0=r[0],x1=r[0]+r[2],y0=r[1],y1=r[1]+r[3],px,py,ex,ey;
      var inside=mx>=x0&&mx<=x1&&my>=y0&&my<=y1;
      if(inside){
        var cand=[[mx-x0,x0,my,-1,0],[x1-mx,x1,my,1,0],[my-y0,mx,y0,0,-1],[y1-my,mx,y1,0,1]].sort(function(a,b2){return a[0]-b2[0]})[0];
        px=cand[1];py=cand[2];ex=cand[3];ey=cand[4];
      }else{
        px=Math.min(Math.max(mx,x0),x1);py=Math.min(Math.max(my,y0),y1);
        var dd=Math.hypot(mx-px,my-py)||1;ex=(mx-px)/dd;ey=(my-py)/dd;
      }
      var d2=inside?0:Math.hypot(mx-px,my-py);
      offer(d2,b.x+px*c-py*sn,b.y+px*sn+py*c,ex*c-ey*sn,ex*sn+ey*c,b.z+Math.min(sz.h,6)-0.5,displayName(b));
    });
  });
  turn=turn||0;
  if(best){
    return {x:best.x,y:best.y,z:best.top,gamma:+(Math.atan2(best.ny,best.nx)-Math.PI/2+turn).toFixed(5),on:best.what,turn:turn};
  }
  var gz=groundAt(wx,wy);
  return {x:wx,y:wy,z:(gz!=null?gz:0)+Math.min(3,MOUNT_PREF.pref),gamma:+turn.toFixed(5),on:null,turn:turn};
}

function hasLayout(o){return !!o&&(o.type==="building"||(o.type==="prop"&&!!templateFor(o.model)))}

    var flat=[],all=[];

      if(!inBody(b.o,q.x,q.y,0.3)||!withinHeight(b.o,q.z))return;

// What rests on something, or hangs on it, goes with it when it moves: a rifle

      var k=q.own?"u"+q.uid:"r"+(q.ref||q.id);

function applyHeights(j){

  });

    var e=edits[ref],o=objByRef(ref),z=(j.edits||{})[ref];
    if(!o||e.exact||z==null||Math.abs(z-o.z)<0.02)return;

  // build does it every time, so it is not a change of the plan's)

/* new navmesh nodes placed by this plan */
function planNode(ref){
  if(typeof ref!=="string"||ref.indexOf("n:")!==0)return null;
  var u=ref.slice(2);
  for(var i=0;i<navNodes.length;i++)if(navNodes[i].uid===u)return navNodes[i];
  return null;
}
// the generator adds plan nodes in order, so each one can also link to the
// plan nodes of the same graph placed before it
// Each answer is kept until the walkways change: an earlier node counts only if

// AI designer's climbing walkways, 2026-09-19, froze the page at 35 nodes).
var LINKC={v:"",map:null};

// walk to without passing through a wall or fence (graphs.py add_node, link_ok).
// The server tests pairs (api/links) on the level as the mission leaves it; the
// answers are kept for the buildings as they stand, and a pair not asked yet
// counts as open.
var LINKCUT={sig:"",map:{}};
function buildingSig(){
  return placements.filter(function(p){return p.type==="building"}).map(function(p){return p.model+"@"+p.x.toFixed(1)+","+p.y.toFixed(1)+","+(p.gamma||0).toFixed(2)}).join("|")+

function pairKey(a,b){
  var k1=a.x.toFixed(1)+","+a.y.toFixed(1)+","+a.z.toFixed(1),k2=b.x.toFixed(1)+","+b.y.toFixed(1)+","+b.z.toFixed(1);
  return k1<k2?k1+">"+k2:k2+">"+k1;

function linkCut(a,b){return LINKCUT.map[pairKey(a,b)]}
// ask the server about every link these new points could have; resolves once
// the answers are in (at once without the server)
function checkLinks(list){
  if(!SRV||!list.length)return Promise.resolve(false);
  var sig=buildingSig();
  if(LINKCUT.sig!==sig){LINKCUT={sig:sig,map:{}}}
  var pairs=[],keys=[],seen={};
  list.forEach(function(pn){
    var cands=nodesOf(pn.graph).concat(navNodes.filter(function(q){return q!==pn&&String(q.graph)===String(pn.graph)}));
    cands.forEach(function(n){
      if(Math.abs(n.z-pn.z)>SAME_FLOOR||Math.hypot(n.x-pn.x,n.y-pn.y,n.z-pn.z)>LINK_R)return;
      var k=pairKey(pn,n);if(seen[k]||k in LINKCUT.map)return;seen[k]=1;
      keys.push(k);pairs.push([pn.x,pn.y,pn.z,n.x,n.y,n.z]);
    });
  });
  if(!pairs.length)return Promise.resolve(true);
  var body=planContext();body.pairs=pairs;
  return fetch("api/links",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)})
    .then(function(r){return r.json()}).then(function(j){
      if(!j.ok||buildingSig()!==sig)return false;
      keys.forEach(function(k,i){LINKCUT.map[k]=j.cut[i]||null});
      nodeVer++;

    }).catch(function(){return false});

function nodeLinks(pn){
  var ver=navNodes.length+"|"+nodeVer+"|"+planVer;
  if(LINKC.v!==ver){LINKC.v=ver;LINKC.map=new Map()}
  if(LINKC.map.has(pn))return LINKC.map.get(pn);
  LINKC.map.set(pn,[]);                      // while it is being worked out
  var res=nodeLinksNow(pn);
  LINKC.map.set(pn,res);
  return res;
}
function nodeLinksNow(pn){
  var cands=nodesOf(pn.graph).map(function(n){return {x:n.x,y:n.y,z:n.z,id:n.id}});
  for(var i=0;i<navNodes.length&&navNodes[i]!==pn;i++){
    var q=navNodes[i];
    if(String(q.graph)===String(pn.graph)&&nodeLinks(q).length)cands.push({x:q.x,y:q.y,z:q.z,id:"n:"+q.uid});
  }
  var near=[];
  cands.forEach(function(n){
    var dz=Math.abs(n.z-pn.z),d=Math.hypot(n.x-pn.x,n.y-pn.y,n.z-pn.z);
    if(d<=LINK_R&&dz<=SAME_FLOOR&&!linkCut(pn,n))near.push([d,n]);
  });

// the graph a new node belongs to: whichever graph has the closest node on its floor
function nearestGraph(wx,wy,wz){
  var best=null,bd=1e18;
  for(var gid in (GRAPHS||{})){
    nodesOf(gid).forEach(function(n){
      if(Math.abs(n.z-wz)>SAME_FLOOR)return;
      var d=(n.x-wx)*(n.x-wx)+(n.y-wy)*(n.y-wy);
      if(d<bd){bd=d;best=gid}
    });
  }
  // the mission's own walkway points belong to a graph too (once they join it)
  navNodes.forEach(function(n){
    if(Math.abs(n.z-wz)>SAME_FLOOR)return;
    var d=(n.x-wx)*(n.x-wx)+(n.y-wy)*(n.y-wy);
    if(d<bd&&nodeLinks(n).length){bd=d;best=String(n.graph)}
  });

// keep a node on the floor it was on when it moves, if that floor exists there
function settleZ(o){

  lv.forEach(function(l){if(Math.abs(l.z-o.z)<=SAME_FLOOR&&(!best||Math.abs(l.z-o.z)<Math.abs(best.z-o.z)))best=l});
  if(best)o.z=best.z;

function rehome(pn){

/* ---------------- patrol walking ---------------- */

function shortestPath(G,a,b){

var trackCache={v:"",src:null,m:{}};
function patrolCmdsOf(o){

}

      if(!xy(String(c[1])))return;

// Your guards' routes always; shipped guards' when "patrol routes" is on or the

function drawPatrols(){

function ground(){
  // Built once at viewport size rather than as a repeating tile - any tile small
  // enough to be cheap is small enough for its seams to read as a grid, which is
  // what made the last version look like chequerboard.
  var key=W+"x"+H;
  if(groundCv&&groundKey===key)return groundCv;
  var c=document.createElement("canvas");c.width=W;c.height=H;
  var g=c.getContext("2d"),img=g.createImageData(W,H),d=img.data;
  // a few sine octaves at unrelated frequencies: cheap, and never repeats on screen
  var f=[[0.0121,0.0173,1.0],[0.0296,0.0241,0.55],[0.0637,0.0719,0.28],[0.1531,0.1327,0.13]];
  for(var y=0;y<H;y++){
    for(var x=0;x<W;x++){
      var v=0;
      for(var k=0;k<f.length;k++){
        v+=Math.sin(x*f[k][0]+y*f[k][1]*0.7)*Math.cos(y*f[k][1]-x*f[k][0]*0.4)*f[k][2];
      }

// is a plan point inside this object's real footprint?
function inFootprint(o,s,wx,wy){
  if(!s.fp||!s.fp.body)return false;
  var g=(typeof o.gamma==="number")?o.gamma:0;
  var dx=wx-o.x, dy=wy-o.y;
  // undo the object's rotation to compare in model space (the drawing rotates
  // model -> world by +gamma, so this rotates back by -gamma)

      var r=rs[i];

    }
    return false;
  }
  return hit(s.fp.body)||hit(s.fp.pad);

// win over a building shape they sit inside; comparing them by distance let a

/* ---------------- terrain ---------------- */
// The level's real ground. studio/extract/terrain.py samples the game's own terrain
// meshes and height maps every metre; here that grid is drawn as shaded relief
// with contour lines, read under the cursor, used as the height of anything
// placed, and asked whether a building can stand somewhere.
var TERR=null,terrLevel=null;
function loadTerrain(level){
  if(terrLevel===level&&TERR)return Promise.resolve(TERR);
  terrLevel=level;TERR=null;
  if(typeof DecompressionStream==="undefined")return Promise.resolve(null);
  return fetch("data/terrain/level"+level+".json?v="+DATAV).then(function(r){return r.ok?r.json():null}).then(function(meta){
    if(!meta)return null;
    return fetch("data/terrain/level"+level+".bin?v="+DATAV).then(function(r){return r.arrayBuffer()})
      .then(function(buf){return new Response(new Blob([buf]).stream().pipeThrough(new DecompressionStream("deflate"))).arrayBuffer()})
      .then(function(raw){
        if(terrLevel!==level)return null;
        var q=new Uint16Array(raw),h=new Float32Array(q.length);
        for(var i=0;i<q.length;i++)h[i]=q[i]===meta.nodata?NaN:meta.zmin+q[i]*meta.step;
        TERR={meta:meta,h:h,img:null,job:null,build:{},ground:null};
        loadGround(level,TERR);
        placeMemo={};
        return TERR;
      });
  }).catch(function(){return null});
}
// What the ground is made of (studio/extract/ground.py, from the level's own texture
// masks): a material per terrain cell and a grey tile of each material's texture.
// The relief is shaded with it, so fields, dirt tracks and rock read as they do
// on the map computer. Drawn once it arrives; the relief does without it.
var GROUND_REPEAT=16;     // metres one texture tile covers (a guess: the game's own scale is not decoded)
function loadGround(level,T){
  if(typeof DecompressionStream==="undefined")return;
  fetch("data/ground/level"+level+".json?v="+DATAV).then(function(r){return r.ok?r.json():null}).then(function(meta){
    if(!meta)return;
    return fetch("data/ground/level"+level+".bin?v="+DATAV).then(function(r){return r.arrayBuffer()})
      .then(function(buf){return new Response(new Blob([buf]).stream().pipeThrough(new DecompressionStream("deflate"))).arrayBuffer()})
      .then(function(raw){
        if(TERR!==T||meta.w!==T.meta.w||meta.h!==T.meta.h)return;
        function bytes(b64){
          if(!b64)return null;
          var bin=atob(b64),a=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);return a;
        }
        var tiles=meta.tiles.map(bytes);
        // each material's own texture in colour, for the 3D view's ground (data made before them has none)
        var ctiles=(meta.ctiles||[]).map(bytes);
        var used=0,sum=0;meta.cells.forEach(function(c,m){if(c&&tiles[m]){used+=c;sum+=c*meta.mean[m]}});
        T.ground={mat:new Uint8Array(raw),tiles:tiles,mean:meta.mean,rgb:meta.rgb||null,names:meta.names||null,avg:used?sum/used:0.5,tile:meta.tile,
          ctiles:ctiles.length?ctiles:null,ctile:meta.ctile||0};

      });

}
function terrainZ(x,y){
  if(!TERR)return null;

// the walkway point nearest a spot (on any graph), or null
// The walkway points near a spot are the ones at about its height: a level's
// tunnels and cellars run under its hills (Trainyard's 3 km down), and a point
// straight above one is no walkway for a guard on the grass. z is the spot's
// height; without it, the ground's there (no ground: any height).

    if(!nearHeight(n,ref))return;
    var d=(n.x-x)*(n.x-x)+(n.y-y)*(n.y-y);if(d<bd){bd=d;best={n:n,g:g,d:Math.sqrt(d)}}

/* ---------------- editing what the level already has ---------------- */
// Shipped objects are edited where they stand: the change is kept against the
// object's reference and applied to that very task when the mission is built,
// so its id - and everything in the level that names it - stays the same.
var edits={}, removeRefs=[];
// The mission's own textures: a picture of yours in the place of one of the
// level's, kept with the plan as PNG and written into the slot on Apply
// (studio/build/textures.py). Name is the texture's, as the model names it.
var MTEX=[];
function texOwn(name){return MTEX.filter(function(x){return x.name===name})[0]||null}
var EDIT_KEYS=["x","y","z","gamma","model","weapon","ai","team","patrol","patrolCmds","settle","interior","cam","alarmId","exact","lock","pick","openOn","sees","fov"];
function clone(v){return v===undefined?undefined:JSON.parse(JSON.stringify(v))}
function objByRef(ref){
  if(!LEVEL||!ref)return null;
  var first=null;
  for(var i=0;i<LEVEL.objects.length;i++){
    var o=LEVEL.objects[i];
    if(o.ref!==ref)continue;
    if(!first)first=o;
    if(!isRemoved(o))return o;      // edits land on the copy that stays
  }
  return first;
}
var loadingEdits=false;
function editShipped(o,fields){
  if(!o||o.own||!o.ref)return;
  if(!loadingEdits&&!canEdit())return;
  if(!o._orig){o._orig={};EDIT_KEYS.forEach(function(k){o._orig[k]=clone(o[k])})}
  if("patrol" in fields)
    fields.patrolCmds=(fields.patrol||[]).reduce(function(a,n){a.push([2,n],[1,200]);return a},[]);
  Object.keys(fields).forEach(function(k){o[k]=fields[k]});
  var e=edits[o.ref]||(edits[o.ref]={ref:o.ref,type:o.type,qtype:o.qtype,id:o.id,name:displayName(o)});
  Object.keys(fields).forEach(function(k){if(k!=="patrolCmds")e[k]=clone(fields[k])});
  if(o.type==="soldier")e.graph=String(o.graph);
}
function resetShipped(o){
  if(!o||!o._orig)return;
  EDIT_KEYS.forEach(function(k){o[k]=clone(o._orig[k])});
  delete o._orig;delete edits[o.ref];
}
// re-apply saved edits to freshly loaded level data
function applyEditsToLevel(){
  loadingEdits=true;
  try{
    Object.keys(edits).forEach(function(ref){
      var o=objByRef(ref),e=edits[ref];if(!o)return;
      var f={};EDIT_KEYS.forEach(function(k){if(k in e&&k!=="patrolCmds")f[k]=clone(e[k])});
      editShipped(o,f);
    });
  }finally{loadingEdits=false}
}
function isRemoved(o){
  if(!o||!o.ref||!LEVEL)return false;
  var k=0;
  for(var i=0;i<removeRefs.length;i++)if(removeRefs[i]===o.ref)k++;
  if(!k)return false;
  // the generator removes the first copy in the file each time; so do we
  var idx=0;
  for(var j=0;j<LEVEL.objects.length;j++){var p=LEVEL.objects[j];if(p===o)break;if(p.ref===o.ref)idx++}
  return idx<k;
}
// one way to change any object, yours or shipped
function setProp(o,fields){
  if(!canEdit())return;
  // a move takes what rests on it (and hangs on it) along
  var d=null,riders=[];
  if("x" in fields||"y" in fields||"z" in fields){
    d=[("x" in fields?fields.x:o.x)-o.x,("y" in fields?fields.y:o.y)-o.y,("z" in fields?fields.z:o.z)-o.z];
    if(Math.abs(d[0])>0.005||Math.abs(d[1])>0.005||Math.abs(d[2])>0.005)riders=ridersOf(o,true);
  }
  if(o.own){
    Object.keys(fields).forEach(function(k){o[k]=fields[k]});
    if(o.type==="soldier"&&"x" in fields&&!(o.patrol||[]).length)o.graph=guardGraph(o.x,o.y,o.z);
  }
  else editShipped(o,fields);
  if(riders.length)carry(riders,d[0],d[1],d[2]);
  syncDoorsOf(o);                       // its doors stay in its doorways
  touch();
}
// the player's start moves like anything else the level ships; a door does not
// (it slides to a stop position stored with it)
function canMove(o){return !!o&&(o.own||(!!o.ref&&o.type!=="door"))}

function optionList(items,current,groupKey){

    if(g)h+='<optgroup label="'+esc({weapons:"Weapons",explosives:"Explosives",items:"Items",ammo:"Ammo",soldiers:"Enemies",special:"Story characters & civilians"}[g]||g)+'">';
    groups[g].forEach(function(it){
      if(it.id===current)seen=true;
      h+='<option value="'+esc(it.id)+'"'+(it.id===current?" selected":"")+'>'+esc(it.label)+'</option>';
    });

function enemyInfo(ai){return (CATALOG&&CATALOG.enemies||[]).filter(function(x){return x.id===ai})[0]||null}
// What the game arms a soldier with. The catalogue keeps how the game uses
// each weapon, and no soldier who fights carries a knife, a flashbang, a mine
// or the dual Uzi - the only two knives it hands out are held by characters
// standing in a cutscene. Given one, a guard holds it like a rifle and can do
// nothing with it, so it is not offered. One already carrying one keeps it.
function armsForGuards(){
  var all=(CATALOG&&CATALOG.weapons)||[];
  var arms=all.filter(function(w){return (w.as||[]).indexOf("guard")>=0});
  return arms.length?arms:all.filter(function(w){return w.group!=="ammo"&&w.group!=="items"});

function guardFields(o){

  if(o.weapon&&!guardCanCarry(o.weapon)){        // one already holding a knife keeps it, and is told
    var w0=((CATALOG&&CATALOG.weapons)||[]).filter(function(w){return w.id===o.weapon})[0];
    arms.unshift({id:o.weapon,label:(w0?w0.label:o.weapon)+" · he can't use it",group:"weapons"});
  }
  var info=enemyInfo(o.ai),lm=levelModels();

    '<p class="hint" style="margin:3px 0 0">Who he shoots for. The game puts its own allies on your side, and keeps a third side for Ekk\'s fortress.</p></div>'+
    '<div style="display:grid;grid-template-columns:1fr 1fr;gap:7px">'+
    '<div class="field"><span class="lbl">Weapon</span><select id="i-wp">'+optionList(arms,o.weapon,"group")+'</select></div>'+

function pickupField(o){

// The selected model in 3D, turning slowly until you take hold of it. One
// viewer is kept and moved into each new inspector, so re-rendering the panel

var PREVIEW=null;
function sizeText(model){
  // characters and weapons: their model's own extent (a character's collision
  // sizes are per bone, not the figure)
  var b=window.MeshSprites&&MeshSprites.ready()&&MeshSprites.has(model)?MeshSprites.bounds(model):null;
  if(b&&MeshSprites.kind(model)==="character")return (b.maxz-b.minz).toFixed(2)+" m tall";
  var z=MODELS&&MODELS.sizes&&MODELS.sizes[model];
  if(z&&z.w&&!(b&&MeshSprites.kind(model)))return prettyW(z.w)+" × "+prettyW(z.d)+" × "+prettyW(z.h)+" m";
  if(!b)return "";
  var ext=[b.maxx-b.minx,b.maxy-b.miny,b.maxz-b.minz].sort(function(p,q){return q-p});
  return Math.round(ext[0]*100)+" × "+Math.round(ext[1]*100)+" × "+Math.round(ext[2]*100)+" cm";

// a camera shows the camera, not the bracket it hangs on; a pickup its weapon or item

function armedModel(model,weapon){

function previewModel(o){
  if(o.type==="camera"&&window.MeshSprites&&MeshSprites.has(CAM_MODELS.camera))return CAM_MODELS.camera;

function pickTexture(name,row){
  var inp=document.createElement("input");
  inp.type="file";inp.accept="image/png";inp.style.display="none";inp.className="tex-file";
  document.body.appendChild(inp);
  inp.addEventListener("change",function(){
    var f=inp.files&&inp.files[0];if(!f)return;
    if(f.size>8*1024*1024){toast("That picture is over 8 MB; make it smaller");return}
    var fr=new FileReader();
    fr.onload=function(){
      var url=String(fr.result||"");
      if(!/^data:image\/png/.test(url)){toast("The studio takes PNG pictures");return}

        if(img.width>2048||img.height>2048){toast("Up to 2048 x 2048; that one is "+img.width+" x "+img.height);return}
        var was=texOwn(name);

      };
      img.onerror=function(){toast("That PNG could not be read")};
      img.src=url;
    };

function bindTextureSection(el,o){

  function bindRows(){
    body.querySelectorAll(".tex-row [data-a]").forEach(function(b){

    if(o.weapon)rows.push(["weapon",weaponLabel(o.weapon)]);
    if(o.model)rows.push(["model",o.model]);
    rows.push(["graph",String(o.graph!=null?o.graph:graphOf(o))]);
    var pr=sightProfile(o);rows.push(["sees",pr.fov+"° · "+pr.range+" m (estimate)"]);
  }else if(o.type==="player"){
    tag="Player";tagClass="player";desc="Where the mission starts.";
  }else if(o.type==="pickup"){
    var id=o.own?o.pickupId:o.model;
    tag=o.own?"Yours":"Pickup";tagClass=o.own?"own":"item";
    desc=/^AMMO_/.test(id||"")?"Ammunition lying here for the player to take.":"Lying here for the player to pick up.";
    rows.push(["item",String(id||"").replace(/^(WEAPON|AMMO)_ID_/,"")]);
    if(o.count)rows.push(["count","×"+o.count]);
  }else if(o.type==="camera"){
    var cm=camOf(o),sweep=(cm.right||0)+(cm.left||0);
    tag=o.own?"Yours":"Camera";tagClass=o.own?"own":"enemy";
    desc="Security camera"+(sweep?", sweeping "+sweep+"° at "+(cm.speed||0)+"°/s with a "+(cm.delay||0)+" s pause at each end":", fixed")+
      (o.own?(o.alarm!==false?". Raises the alarm when it sees you.":". Only watches."):". Tied to the level's alarm.");
    rows.push(["view",(cm.fov||60)+"° wide · "+(cm.range||30)+" m"]);
    rows.push(["tilt",Math.round((cm.pitch||0)*180/Math.PI)+"°"]);
    if(up!=null)rows.push(["height",up.toFixed(1)+" m up"]);
    if(o.mount)rows.push(["on",o.mount]);
    if(cm.on&&cm.on!=="1")rows.push(["on while",cm.on]);
  }else{
    var pi=window.PlanIcons?PlanIcons.propIcon(o):null,st=styleFor(o);
    if(o.type==="building"){
      tag=o.own?"Yours":"Building";tagClass=o.own?"own":"";
      desc=hasLayout(o)?"You can go inside: its floors are mapped for guards and pickups.":"A structure.";
    }else if(o.type==="door"){tag="Door";desc="Slides open when the player comes near or uses it."}
    else if(o.type==="fence"){tag="Fence";desc=o.electric?"Electric while "+o.electric+".":"The player can climb it."}
    else if(o.type==="terminal"){tag="Terminal";desc="The player can hack it."}
    else if(o.type==="switch"){tag="Switch";desc="The player can use it."}
    else if(o.type==="explodable"){tag="Explosive";desc="Blows up when shot or set off."}
    else if(o.type==="vehicle"){tag="Vehicle";desc="Solid: you can't go inside."}
    else{
      tag=o.own?"Yours":pi&&/^(tank|apc|truck|car|helicopter|jet|locomotive|wagon|forklift|cablecar|samLauncher)$/.test(pi)?"Vehicle":"Prop";
      desc=st.pal==="solid"?"Solid: you can't go inside.":pi==="tree"||pi==="bush"?"Vegetation.":"";
    }
    if(o.own&&!tagClass)tagClass="own";
    if(catTitle)rows.push(["kind",catTitle]);
    if(sz&&sz.w)rows.push(["size",sizeText(o.model)]);
    if(o.model)rows.push(["model",(o.modelName&&o.modelName!==o.model?o.modelName+" · ":"")+o.model]);
    if(o.label&&o.label.title)rows.push(["label",o.label.title]);
  }
  if(!o.own&&o.qtype)rows.push(["task",o.qtype+(o.id>=0?" #"+o.id:"")]);
  if(o._orig)rows.push(["status","edited in this mission"]);
  return {tag:tag,tagClass:tagClass,desc:desc,rows:rows};
}

/* ---------------- alarm systems ---------------- */
// An alarm system is one AlarmControl task and everything that names it: the
// cameras and buttons in its trigger, the guards whose AI script carries its id,
// and the sirens, lights and guard generators that watch its isAlarm. There is
// no area in the data - the membership IS the area.
var ALARM_TYPES={camera:"camera",switch:"alarm button",siren:"siren",alarmlight:"alarm light"};
function ownSystems(){return placements.filter(function(p){return p.type==="alarmctl"})}
function alarmSystems(){
  var out=((LEVEL&&LEVEL.alarms)||[]).map(function(a,i){
    return {key:"lv:"+a.id, id:a.id, own:false, o:null, data:a, x:a.x, y:a.y, z:a.z,
            name:a.name||("Alarm system "+a.id)};
  });
  ownSystems().forEach(function(p){
    out.push({key:"own:"+p.uid, id:null, own:true, o:p, data:null, x:p.x, y:p.y, z:p.z, name:p.name||"Alarm system"});
  });
  return out;
}
function alarmByKey(k){var l=alarmSystems();for(var i=0;i<l.length;i++)if(l[i].key===k)return l[i];return null}
// the system a new part joins: the one it is told to, else the nearest
function nearestAlarm(x,y){
  var best=null,bd=1e9;
  alarmSystems().forEach(function(sys){
    var d=Math.hypot(sys.x-x,sys.y-y);
    if(d<bd){bd=d;best=sys}
  });
  return best;
}
function alarmOf(o){
  if(!o)return null;
  if(o.alarmId)return alarmByKey(o.alarmId);
  if(!o.own&&o.id!=null){
    var l=alarmSystems();
    for(var i=0;i<l.length;i++){
      var d=l[i].data;if(!d)continue;
      if(d.sources.cameras.indexOf(o.id)>=0||d.sources.switches.indexOf(o.id)>=0||d.guards.indexOf(o.id)>=0)return l[i];
    }
  }
  return null;
}
// everything on one system, the level's and the mission's together
function alarmParts(sys){
  var d=sys.data||{sources:{cameras:[],switches:[],guards:[],cameraControls:[]},guards:[],effects:{}};
  var lv=LEVEL?LEVEL.objects:[];
  function byIds(ids){return lv.filter(function(o){return o.id!=null&&ids.indexOf(o.id)>=0&&!isRemoved(o)&&removeRefs.indexOf(o.ref)<0})}
  var own=placements.filter(function(p){return p.alarmId===sys.key});
  return {
    cameras:byIds(d.sources.cameras).concat(own.filter(function(p){return p.type==="camera"&&p.alarm!==false})),
    switches:byIds(d.sources.switches).concat(own.filter(function(p){return p.type==="switch"})),
    guards:byIds(d.guards).concat(own.filter(function(p){return p.type==="soldier"&&!p.reinforce})),
    spotters:byIds(d.sources.guards||[]),
    sirens:own.filter(function(p){return p.type==="siren"}),
    lights:own.filter(function(p){return p.type==="alarmlight"}),
    reinforce:own.filter(function(p){return p.type==="soldier"&&p.reinforce}),
    shipped:{sirens:(d.effects||{}).sirens||0,lights:(d.effects||{}).lights||0,sounds:(d.effects||{}).sounds||0,
             doors:(d.effects||{}).doors||0,reinforce:((d.effects||{}).reinforcements||[]).length}
  };
}
function alarmSummary(sys){
  var p=alarmParts(sys),bits=[];
  var raise=p.cameras.length+p.switches.length+p.spotters.length;
  bits.push(raise?raise+" thing"+(raise===1?"":"s")+" can raise it":"nothing raises it yet");
  bits.push((p.guards.length||"no")+" guard"+(p.guards.length===1?"":"s")+" answer"+(p.guards.length===1?"s":""));
  var fx=[];
  if(p.sirens.length+p.shipped.sirens)fx.push((p.sirens.length+p.shipped.sirens)+" siren"+(p.sirens.length+p.shipped.sirens===1?"":"s"));
  if(p.lights.length+p.shipped.lights)fx.push((p.lights.length+p.shipped.lights)+" light"+(p.lights.length+p.shipped.lights===1?"":"s"));
  if(p.reinforce.length+p.shipped.reinforce)fx.push((p.reinforce.length+p.shipped.reinforce)+" reinforcement"+(p.reinforce.length+p.shipped.reinforce===1?"":"s"));
  if(fx.length)bits.push(fx.join(", "));
  return bits.join(" · ");
}

function partBar(anchor,o,sys){

  if(canEdit()&&(o.own||o.ref))

    b.addEventListener("click",function(e){
      e.stopPropagation();
      var act=b.getAttribute("data-b");

function fitMapbar(){
  var bar=document.querySelector(".mapbar"),rb=document.querySelector(".rightbar"),tg=$("toggles"),vb=$("viewbar");
  if(!bar||!rb||!tg||!vb||!bar.clientWidth)return;
  function over(){return tg.offsetWidth+8+rb.offsetWidth-bar.clientWidth}
  var keep=KEEPMORE;KEEPMORE=false;
  if(over()<=0){MOREOPEN=null;return}
  var menus=[];
  function fold(h,keep){
    var m=document.createElement("button");
    m.type="button";m.className="tg tgmore";m.setAttribute("aria-haspopup","true");
    m.setAttribute("data-tip","More tools");m.setAttribute("aria-label","More tools");

    h.appendChild(m);
    var out=[];
    while(over()>0){
      var kids=[].slice.call(h.children).filter(function(c){return c!==m});
      if(kids.length<=keep)break;
      var last=kids[kids.length-1];
      last.remove();
      out.unshift(last.classList.contains("tgsep")?"|":last);
    }
    while(out[0]==="|")out.shift();
    if(!out.length){m.remove();return false}
    // a separator left at the end of the bar goes too
    var tail=h.children[h.children.length-2];if(tail&&tail.classList.contains("tgsep"))tail.remove();
    menus.push({h:h,m:m,items:out});

  }
  if(!fold(tg,1))fold(vb,0);
  menus.forEach(function(x){
    var pop=document.createElement("div");pop.className="tgpop";pop.setAttribute("role","menu");
    x.items.forEach(function(b){
      if(b==="|"){pop.appendChild(Object.assign(document.createElement("div"),{className:"tgm-sep"}));return}

  });

function moveGroup(dx,dy,list){
  if(!canEdit())return;
  (list||groupList()).forEach(function(o){placeMember(o,o.x+dx,o.y+dy,null)});
  touch();
}
var groupSettleT=0;
function settleGroup(list){
  clearTimeout(groupSettleT);
  groupSettleT=setTimeout(function(){
    list.forEach(function(o){if(o.type!=="navnode")settle(o,false)});
  },250);
}
function rotateGroup(deg){
  var list=groupList();if(list.length<2||!canEdit())return false;
  lastChangeAt=0;
  var c=groupCentre(list),a=deg*Math.PI/180,cs=Math.cos(a),sn=Math.sin(a);
  list.forEach(function(o){
    var dx=o.x-c.x,dy=o.y-c.y;
    placeMember(o,c.x+dx*cs-dy*sn,c.y+dx*sn+dy*cs,o.type==="navnode"?null:(o.gamma||0)+a);
  });
  touch();settleGroup(list);renderSide();renderNavSection();draw();
  return true;
}
function deleteGroup(){
  var list=groupList();if(list.length<2||!canEdit())return false;
  lastChangeAt=0;
  var gone=new Set(list),refs={};
  list.forEach(function(o){
    if(o.type==="navnode")refs["n:"+o.uid]=1;
    else if(!o.own&&o.ref&&removeRefs.indexOf(o.ref)<0)removeRefs.push(o.ref);
  });
  navNodes=navNodes.filter(function(p){return !gone.has(p)});
  placements=placements.filter(function(p){return !gone.has(p)});
  placements.forEach(function(p){if(p.patrol)p.patrol=p.patrol.filter(function(n){return !refs[n]})});
  multi=[];sel=null;patrolMode=false;
  touch();renderSide();renderNavSection();draw();
  toast(list.length+" removed. Ctrl+Z brings them back");
  return true;
}
function dropGroup(){
  var list=groupList().filter(function(o){return o.type!=="navnode"});
  if(!list.length||!canEdit())return false;
  list.forEach(function(o){
    if(!o.own)editShipped(o,{settle:true});
    else if(SRV)settle(o,false);
    else{var gz=groundAt(o.x,o.y);if(gz!=null)o.z=+gz.toFixed(3)}
  });
  touch();renderSide();draw();
  toast(list.length+" set down on the ground");
  return true;
}

// ---- the portable form of a group
function groupData(list){
  list=list||groupList();
  if(!list.length)return null;
  var c=groupCentre(list),items=[],nodes=[];
  list.forEach(function(o){
    if(o.type==="navnode"){nodes.push({old:o.uid,graph:o.graph,dx:o.x-c.x,dy:o.y-c.y,z:o.z});return}
    var p;
    if(o.own){p=JSON.parse(JSON.stringify(o));p.old=o.uid;delete p.uid;delete p._gq}
    else if(o.type==="soldier")p={type:"soldier",kind:"soldier",ai:o.ai,model:o.model,weapon:o.weapon,
      name:displayName(o),graph:o.graph!=null?String(o.graph):null,patrol:(o.patrol||[]).filter(function(n){return typeof n==="number"})};
    else if(o.type==="pickup")p={type:"pickup",kind:"pickup",pickupId:o.model,name:displayName(o)};
    else if(o.model)p={type:"building",kind:"object",model:o.model,name:displayName(o)};
    else return;
    p.own=true;p.dx=o.x-c.x;p.dy=o.y-c.y;p.z=o.z;p.gamma=o.gamma||0;
    delete p.x;delete p.y;
    items.push(p);
  });
  return {v:1,level:LV,base:BASE_LEVEL,z:list.reduce(function(a,o){return a+o.z},0)/list.length,items:items,nodes:nodes};
}
function groupSummary(d){
  var n={};d.items.forEach(function(p){var k=p.type==="soldier"?"guard":p.type==="pickup"?"pickup":"object";n[k]=(n[k]||0)+1});
  if(d.nodes.length)n.node=d.nodes.length;
  return Object.keys(n).map(function(k){return n[k]+" "+k+(n[k]===1?"":"s")}).join(", ");
}
// Put a group down with its centre at (x, y), turned by gamma. New ids; patrol
// stops that point at copied nodes or buildings follow them; stops at the
// level's own nodes survive only on the same level.
function pasteData(d,x,y,gamma){
  if(!d||!canEdit())return [];
  lastChangeAt=0;
  gamma=gamma||0;
  var cs=Math.cos(gamma),sn=Math.sin(gamma),map={},out=[],sameLevel=d.level===LV;
  var dz=0;
  var gz=groundAt(x,y);if(gz!=null&&d.z!=null&&!sameLevel)dz=gz-d.z;
  d.nodes.forEach(function(n){
    var u=uid();map["n:"+n.old]="n:"+u;
    var o={uid:u,own:true,type:"navnode",x:x+n.dx*cs-n.dy*sn,y:y+n.dx*sn+n.dy*cs,z:n.z+dz,graph:n.graph};
    settleZ(o);rehome(o);
    navNodes.push(o);out.push(o);
  });
  d.items.forEach(function(p){if(p.old)map["t:"+p.old]="t:"+(p._new=uid())});
  var dropped=0;
  d.items.forEach(function(p){
    var o=JSON.parse(JSON.stringify(p));
    o.uid=p._new||uid();delete o.old;delete o._new;delete o.dx;delete o.dy;
    o.x=+(x+p.dx*cs-p.dy*sn).toFixed(3);o.y=+(y+p.dx*sn+p.dy*cs).toFixed(3);o.z=(p.z||0)+dz;
    o.gamma=+(((p.gamma||0)+gamma)%(Math.PI*2)).toFixed(5);
    if(o.type==="soldier"){
      var before=(o.patrol||[]).length;
      o.patrol=(o.patrol||[]).map(function(n){
        if(typeof n==="string"){
          var j=n.lastIndexOf(":"),head=n.indexOf("t:")===0?n.slice(0,j):n;
          if(map[head])return n.indexOf("t:")===0?map[head]+n.slice(j):map[head];
          return null;
        }
        return sameLevel?n:null;
      }).filter(function(n){return n!=null});
      dropped+=before-o.patrol.length;
      if(!sameLevel||!o.patrol.length)o.graph=guardGraph(o.x,o.y,o.z);
      if(!o.patrol.length)delete o.patrolCmds;
    }
    placements.push(o);out.push(o);
  });
  d.items.forEach(function(p){delete p._new});
  multi=out.length>1?out.slice():[];
  sel=out[out.length-1]||null;
  touch();renderSide();renderNavSection();draw();
  out.forEach(function(o){if(o.type!=="navnode")settle(o,false)});
  if(dropped)toast(dropped+" patrol stop"+(dropped===1?"":"s")+" pointed at this level's own nodes elsewhere and were left out");
  return out;
}
var CLIP_KEY="studio:clipboard";
function copyGroup(){
  var d=groupData();if(!d){toast("Select something to copy");return false}
  try{localStorage.setItem(CLIP_KEY,JSON.stringify(d))}catch(e){toast("This browser won't keep a copy");return false}
  toast("Copied "+groupSummary(d)+". Ctrl+V pastes at the cursor, in any mission");
  return true;
}
function pasteClipboard(){
  var d=null;try{d=JSON.parse(localStorage.getItem(CLIP_KEY)||"null")}catch(e){}
  if(!d||!d.items){toast("Nothing copied yet");return false}
  if(!canEdit())return false;
  var at=mouse.inside?{x:mouse.wx,y:mouse.wy}:{x:view.cx,y:view.cy};
  var out=pasteData(d,at.x,at.y,0);
  if(out.length)toast("Pasted "+groupSummary(d));
  return true;
}
function duplicateGroup(){
  var list=groupList();if(list.length<2||!canEdit())return false;
  var d=groupData(list),c=groupCentre(list);
  pasteData(d,c.x+3,c.y-3,0);
  return true;
}

var GROUPS=[];
var GroupStore={
  list:function(){
    if(SRV)return fetch("api/groups").then(function(r){return r.json()}).then(function(j){return j.groups||[]});
    try{return Promise.resolve(JSON.parse(localStorage.getItem("studio:groups")||"[]"))}catch(e){return Promise.resolve([])}
  },
  save:function(g){
    if(SRV)return fetch("api/groups",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(g)})
      .then(function(r){return r.json()}).then(function(j){if(!j.ok)throw new Error(j.error||"not saved");return j.group});
    g.id=slug(g.name)+"-"+Math.random().toString(36).slice(2,7);
    var all=GROUPS.concat([g]);localStorage.setItem("studio:groups",JSON.stringify(all));return Promise.resolve(g);
  },
  remove:function(id){
    if(SRV)return fetch("api/groups/"+encodeURIComponent(id),{method:"DELETE"}).then(function(r){return r.json()});
    localStorage.setItem("studio:groups",JSON.stringify(GROUPS.filter(function(g){return g.id!==id})));return Promise.resolve({ok:true});
  }
};
function loadGroups(){
  return GroupStore.list().then(function(list){GROUPS=list||[];buildPalette()}).catch(function(){});
}

// a little map of the group: its members where they stand
function groupThumb(d,px){
  px=px||26;
  var c=document.createElement("canvas"),dpr=Math.min(window.devicePixelRatio||1,2);
  c.width=px*dpr;c.height=px*dpr;c.style.width=px+"px";c.style.height=px+"px";c.style.flex="none";
  var g=c.getContext("2d");g.setTransform(dpr,0,0,dpr,0,0);
  var pts=d.items.map(function(p){var z=MODELS&&MODELS.sizes&&MODELS.sizes[p.model];return {x:p.dx,y:p.dy,r:p.type==="building"&&z&&z.w?Math.max(z.w,z.d)/2:0.8,t:p.type}})
    .concat(d.nodes.map(function(n){return {x:n.dx,y:n.dy,r:0.5,t:"node"}}));
  var span=2;pts.forEach(function(p){span=Math.max(span,Math.abs(p.x)+p.r,Math.abs(p.y)+p.r)});

// The game reads height maps over its terrain mesh: one per 64 m cube, a sample
// every half metre, each able to move the ground by up to 4 m either way. The
// Ground bar (right edge of the map) shapes it anywhere: areas to level, raise,
// lower, smooth or ramp, and a brush to paint it freehand. The build does the
// same sums (studio/build/flatten.py), so what the plan shows is what the game gets:
// areas apply in order, each on the ground the ones before it left, then the
// brush; the ground under the level's own buildings is kept; and what stands on
// the shaped ground - crates, trees, guards, pickups, the start, the navmesh -
// moves up or down with it.

// ---- the noise the edges wander by: the build's own (flatten.py _hash/gnoise)
function ghash(ix,iy,seed){
  var h=(Math.imul(ix,374761393)+Math.imul(iy,668265263)+Math.imul(seed,144665))>>>0;
  h=Math.imul(h^(h>>>13),1274126177)>>>0;
  return ((h^(h>>>16))&0xffff)/65535;
}
function gnoise(x,y,seed){
  var total=0,oct=[[1/9,0.65],[1/3.5,0.35]];
  for(var q=0;q<2;q++){
    var fx=x*oct[q][0],fy=y*oct[q][0],ix=Math.floor(fx),iy=Math.floor(fy),tx=fx-ix,ty=fy-iy;
    tx=tx*tx*(3-2*tx);ty=ty*ty*(3-2*ty);
    var v=(ghash(ix,iy,seed)*(1-tx)+ghash(ix+1,iy,seed)*tx)*(1-ty)+(ghash(ix,iy+1,seed)*(1-tx)+ghash(ix+1,iy+1,seed)*tx)*ty;
    total+=oct[q][1]*(v*2-1);
  }
  return total;
}
function seedOf(u){var h=7;u=String(u||"");for(var i=0;i<u.length;i++)h=(h*31+u.charCodeAt(i))&0xffff;return h}
function smoother(t){return t*t*t*(t*(t*6-15)+10)}

// ---- an area's shape (rotated by its angle, as the build's pads are)
function areaLocal(a,x,y){
  var g=a.angle||0,c=Math.cos(g),s=Math.sin(g),dx=x-a.x,dy=y-a.y;
  return [dx*c+dy*s,-dx*s+dy*c];
}
function areaDist(a,x,y){
  var l=areaLocal(a,x,y);
  if(a.round&&a.mode!=="ramp"){
    var rx=Math.max(0.25,a.w/2),ry=Math.max(0.25,a.h/2),d=Math.hypot(l[0]/rx,l[1]/ry);
    return d<=1?0:(d-1)*Math.min(rx,ry);
  }
  return Math.hypot(Math.max(0,Math.abs(l[0])-a.w/2),Math.max(0,Math.abs(l[1])-a.h/2));
}
function inArea(a,x,y,pad){return areaDist(a,x,y)<=(pad||0)}
function areaAt(wx,wy){
  var pad=Math.max(1,6/view.k);
  for(var i=groundEdits.length-1;i>=0;i--)if(inArea(groundEdits[i],wx,wy,pad))return groundEdits[i];
  return null;
}

function sculptDab(x,y){

function drawGround(){
  var open=groundOpen();
  if(!open&&!GDRAW&&!(layers.groundtex&&hasPaint()))return;   // shaped ground shows only while its panel is open
  ctx.save();
  var shownBrush=open&&(GMODE.mode==="brush"||GSEL==="brush"||GHOVER==="brush");
  // painted ground: while painting, or with the ground textures shown
  var pc=(open&&(GMODE.mode==="paint"||GSEL==="paint"||GHOVER==="paint"))||layers.groundtex?paintCanvas():null;
  if(pc){
    var ptl=w2s(pc.bb[0],pc.bb[3]);
    ctx.globalAlpha=open?0.8:0.6;ctx.imageSmoothingEnabled=false;
    ctx.drawImage(pc,ptl[0],ptl[1],pc.width*view.k,pc.height*view.k);
    ctx.globalAlpha=1;ctx.imageSmoothingEnabled=true;
  }
  var sc=shownBrush||GSEL==="sculpt"||GHOVER==="sculpt"?sculptCanvas():null;
  if(sc){
    var stl=w2s(sc.bb[0]-SCULPT_M/2,sc.bb[3]+SCULPT_M/2);
    ctx.globalAlpha=open?0.6:0.3;ctx.imageSmoothingEnabled=true;
    ctx.drawImage(sc,stl[0],stl[1],sc.width*SCULPT_M*view.k,sc.height*SCULPT_M*view.k);
    ctx.globalAlpha=1;
  }
  var bc=shownBrush?brushCanvas():null;
  if(bc){
    var tl=w2s(bc.bb[0],bc.bb[3]);
    ctx.globalAlpha=open?0.75:0.35;ctx.imageSmoothingEnabled=true;
    ctx.drawImage(bc,tl[0],tl[1],bc.width*view.k,bc.height*view.k);
    ctx.globalAlpha=1;
  }
  groundEdits.forEach(function(a){
    if(a.uid!==GSEL&&a.uid!==GHOVER)return;       // the one picked in the panel, or under the pointer there
    var on=a.uid===GSEL,col=GM_COL[a.mode]||GM_COL.level,st=GSTRAIN[a.uid]||{};
    var p=w2s(a.x,a.y),rw=a.w/2*view.k,rh=a.h/2*view.k,bl=(a.blend||0)*view.k;
    ctx.save();ctx.translate(p[0],p[1]);ctx.rotate(-(a.angle||0));
    // the edge it eases over, faint
    if(on&&bl>3){
      ctx.setLineDash([2,5]);ctx.lineWidth=1;ctx.strokeStyle="rgba("+col+",.35)";ctx.beginPath();
      if(a.round&&a.mode!=="ramp")ctx.ellipse(0,0,rw+bl,rh+bl,0,0,6.2832);else ctx.roundRect(-rw-bl,-rh-bl,2*(rw+bl),2*(rh+bl),bl);
      ctx.stroke();
    }
    ctx.setLineDash(on?[]:[6,4]);ctx.lineWidth=on?2:1.2;
    ctx.strokeStyle="rgba("+col+","+(on?".95":".6")+")";ctx.fillStyle="rgba("+col+",.10)";
    ctx.beginPath();
    if(a.round&&a.mode!=="ramp")ctx.ellipse(0,0,rw,rh,0,0,6.2832);else ctx.rect(-rw,-rh,rw*2,rh*2);
    ctx.fill();ctx.stroke();ctx.setLineDash([]);
    if(a.mode==="ramp"&&rw>8){
      // up the slope
      var up=a.z1>=a.z0?1:-1;
      ctx.strokeStyle="rgba("+col+",.9)";ctx.lineWidth=1.6;ctx.beginPath();
      ctx.moveTo(-rw*0.8*up,0);ctx.lineTo(rw*0.8*up,0);
      ctx.moveTo(rw*0.8*up-7*up,-5);ctx.lineTo(rw*0.8*up,0);ctx.lineTo(rw*0.8*up-7*up,5);ctx.stroke();
    }
    ctx.restore();
    if(view.k>0.6){
      var t=areaText(a);
      ctx.font='600 11px "IBM Plex Sans",sans-serif';
      var w=ctx.measureText(t).width,ty=p[1]-Math.max(rw,rh)-12;
      ctx.fillStyle="rgba(4,18,6,.85)";ctx.strokeStyle="rgba("+col+",.7)";ctx.lineWidth=1;
      ctx.beginPath();ctx.roundRect(p[0]-w/2-6,ty-13,w+12,18,4);ctx.fill();ctx.stroke();
      ctx.fillStyle="rgb("+col+")";ctx.textAlign="center";ctx.fillText(t,p[0],ty);ctx.textAlign="start";
    }
  });
  if(GDRAW){
    var a2=w2s(GDRAW.x0,GDRAW.y0),b2=w2s(GDRAW.x1,GDRAW.y1),col2=GM_COL[GMODE.mode]||GM_COL.level;
    ctx.strokeStyle="rgb("+col2+")";ctx.setLineDash([5,4]);ctx.lineWidth=1.5;ctx.fillStyle="rgba("+col2+",.12)";
    ctx.beginPath();
    if(GMODE.mode==="ramp"){
      var ang=Math.atan2(b2[1]-a2[1],b2[0]-a2[0]),hw=(GMODE.rampWidth||6)/2*view.k,nx=-Math.sin(ang)*hw,ny=Math.cos(ang)*hw;
      ctx.moveTo(a2[0]+nx,a2[1]+ny);ctx.lineTo(b2[0]+nx,b2[1]+ny);ctx.lineTo(b2[0]-nx,b2[1]-ny);ctx.lineTo(a2[0]-nx,a2[1]-ny);ctx.closePath();
      ctx.fill();ctx.stroke();ctx.setLineDash([]);
      ctx.beginPath();ctx.moveTo(a2[0],a2[1]);ctx.lineTo(b2[0],b2[1]);ctx.stroke();
      var z0=terrainZ(GDRAW.x0,GDRAW.y0),z1=terrainZ(GDRAW.x1,GDRAW.y1);
      var m2=Math.hypot(GDRAW.x1-GDRAW.x0,GDRAW.y1-GDRAW.y0).toFixed(0)+" m"+(z0!=null&&z1!=null?" · "+(z1-z0>=0?"+":"")+(z1-z0).toFixed(1)+" m":"");
    }else{
      if(GMODE.round)ctx.ellipse((a2[0]+b2[0])/2,(a2[1]+b2[1])/2,Math.abs(b2[0]-a2[0])/2,Math.abs(b2[1]-a2[1])/2,0,0,6.2832);
      else ctx.rect(Math.min(a2[0],b2[0]),Math.min(a2[1],b2[1]),Math.abs(b2[0]-a2[0]),Math.abs(b2[1]-a2[1]));
      ctx.fill();ctx.stroke();ctx.setLineDash([]);
      var m2=Math.abs(GDRAW.x1-GDRAW.x0).toFixed(0)+" × "+Math.abs(GDRAW.y1-GDRAW.y0).toFixed(0)+" m";
    }
    ctx.fillStyle=css("--ink");ctx.font='600 11px "IBM Plex Sans",sans-serif';
    ctx.fillText(m2,b2[0]+8,b2[1]+4);
  }
  if(open&&GMODE.mode==="brush"&&mouse.inside){
    var bop=GMODE.brush.op,bp=w2s(mouse.wx,mouse.wy),br=(GMODE.brush.size||5)*view.k,
      bcol=bop==="lower"||bop==="valley"||bop==="crater"?"110,200,255":bop==="erase"?"255,120,110":bop==="smooth"||bop==="flatten"?"205,165,255":"140,255,150";
    ctx.strokeStyle="rgba("+bcol+",.95)";ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(bp[0],bp[1],br,0,6.2832);ctx.stroke();

  }
  ctx.restore();
}

function pickGroundTool(m){

// view3d.js - an ES module on three.js - draws the real geometry around one
// item and hands back where it was put. This side gives it the item, what stands
// within the radius, the ground, and the meshes.
var V3D={radius:60,key:null,spot:null,at:null,ver:-1,raf:0};
// The close-up follows the plan: a turn or a move in the panel, undo, what a
// moved crate carried along. Once per change, right after it.
function sync3d(){
  V3D.ver=planVer;
  if(!window.View3D||!View3D.isOpen()||(!V3D.key&&!V3D.spot))return;
  clearTimeout(V3D.raf);
  V3D.raf=setTimeout(function(){
    if(!View3D.isOpen())return;
    var R=reach3d(V3D.radius),c=V3D.at;
    if(V3D.spot){View3D.update({objects:sceneAround(c||V3D.spot,R,true),nav:nav3d(c||V3D.spot,R)});return}
    var q=byKey3d(V3D.key);
    if(!q){keep3dSpot();return}               // taken out (or undone): stay where it stood
    V3D.lastAt={x:q.x,y:q.y,z:q.z};
    View3D.update({target:spec3d(q),objects:c?scene3d(c,q):sceneAround(q,R),nav:nav3d(c||q,R,q)});
  },0);
}
// How far round the close-up things are drawn: as far as its ground reaches
// (terrain3d), less a little, so what the fog lets you see is there
function reach3d(R){return 0.9*Math.min(160,Math.max(R*2.5,R+40))}
// what stands round a spot, and the item the close-up is on wherever it is
function scene3d(at,q){
  var out=sceneAround(at,reach3d(V3D.radius),true);
  if(q){var k=key3d(q);if(!out.some(function(s){return s.key===k}))out.push(spec3d(q))}
  return out;
}
// the close-up gathered again round its camera as it goes (View3D explore):
// what is near, the walkways and, when it asks, the ground
function explore3d(x,y,z,ground){
  var at={type:"spot",x:x,y:y,z:z},q=V3D.key?byKey3d(V3D.key):null;
  V3D.at=at;
  var out={objects:scene3d(at,q),nav:nav3d(at,reach3d(V3D.radius),q)};
  if(ground)out.terrain=terrain3d(at,V3D.radius);
  return out;
}

function model3d(o){

// the game's three angles (alpha about x, beta about y, gamma about z) and which
// of them the editor's heading turns. A weapon lying on its side carries its
// heading in alpha (apply_plan.py pickup_pose); what the level added to alpha is
// kept apart so a turn in 3D comes back as the editor's own heading.
// A weapon on its side carries its heading in alpha, and a larger alpha swings
// it clockwise: alpha is minus the heading (sign -1), so every heading in the
// studio turns the same way, anticlockwise (apply_plan.pickup_pose, CCW_LYING).

// the ground round it, as the map has it (with the mission's own shaping), out

function terrain3d(o,R){

  if(o.type==="camera")return {fov:camOf(o).fov||60,range:camOf(o).range||30,eye:-0.25,kind:"camera"};
  // one of yours with his own sight (sightFields) sees what his script says
  if(/SNIPER/.test(o.ai||""))return {fov:o.fov||SIGHT.sniperFov,range:o.sees||SIGHT.sniperRange,eye:1.7,kind:"sniper"};
  return {fov:o.fov||SIGHT.guardFov,range:o.sees||SIGHT.guardRange,eye:1.7,kind:"guard"};
}
// facing (radians from +x) of a guard or camera standing still
function facingOf(o){return o.type==="camera"?camHeading(o):(o.gamma||0)+Math.PI/2}
// built surfaces lower than this are floors (aprons, runways, platforms); higher ones block
var FLOOR_MAX=1.2;
// Cast the view from (ox, oy) with the eye at eyeZ. mark(k) is called for each
// grid cell seen (k = row * w + column), possibly more than once.
function viewshed(ox,oy,eyeZ,heading,fov,range,mark){
  var m=TERR.meta,w=m.w,h=m.h,cell=m.cell,H=TERR.h,G=obstacleGrid(),top=G.top,ids=G.id;
  var ci=Math.round((ox-m.x0)/cell),cj=Math.round((oy-m.y0)/cell);
  if(ci<0||cj<0||ci>=w||cj>=h)return;
  var own=ids[cj*w+ci];               // the building he stands in or on doesn't hide the view
  var half=fov*Math.PI/360,dA=Math.min(0.5,Math.max(0.2,40/range))*Math.PI/180;
  var target=SIGHT.target,step=cell*0.5;
  for(var a=heading-half;a<=heading+half+1e-9;a+=dA){
    var dx=Math.cos(a),dy=Math.sin(a),horizon=-Infinity;
    for(var d=step;d<=range;d+=step){
      var x=ox+dx*d,y=oy+dy*d,i=Math.round((x-m.x0)/cell),j=Math.round((y-m.y0)/cell);
      if(i<0||j<0||i>=w||j>=h)break;
      var k=j*w+i,g=H[k];
      if(g!==g)break;                 // off the terrain
      var solid=ids[k]>=0&&ids[k]!==own?top[k]:-Infinity;
      if(solid>g+FLOOR_MAX){
        // a roof or wall: nobody stands here to be seen, but it blocks behind it
        var sb=(solid-eyeZ)/d;if(sb>horizon)horizon=sb;
        continue;
      }
      // an apron, runway or low platform is where you would stand
      var floor=solid>g?solid:g;
      var st=(floor+target-eyeZ)/d;
      if(st>=horizon)mark(k);
      var sg=(floor-eyeZ)/d;if(sg>horizon)horizon=sg;
    }

}
// the cone of the selected guard or camera, drawn fresh every frame so it
// follows a patrolling guard
var SIGHT_CV=null,LAST_HEADING=new WeakMap();
function sightOrigin(o){
  var gp=guardPos(o);
  if(gp){
    // standing at a stop he keeps looking the way he walked
    if(gp.moving)LAST_HEADING.set(o,gp.h);
    var hd=gp.moving?gp.h:(LAST_HEADING.has(o)?LAST_HEADING.get(o):facingOf(o));
    var tz=terrainZ(gp.x,gp.y);
    return {x:gp.x,y:gp.y,z:tz!=null?tz:o.z,heading:hd};
  }
  return {x:o.x,y:o.y,z:o.z,heading:facingOf(o)};
}
function drawSightCone(){
  if(!layers.sight||!TERR||!sel||(sel.type!=="soldier"&&sel.type!=="camera")||multi.length>1)return;
  if(!window.MeshSprites||!MeshSprites.ready())return;
  var pr=sightProfile(sel),org=sightOrigin(sel),m=TERR.meta,R=Math.ceil(pr.range/m.cell)+1,S=2*R+1;
  var ci=Math.round((org.x-m.x0)/m.cell),cj=Math.round((org.y-m.y0)/m.cell);
  if(!SIGHT_CV||SIGHT_CV.width!==S){SIGHT_CV=document.createElement("canvas");SIGHT_CV.width=S;SIGHT_CV.height=S}
  var g=SIGHT_CV.getContext("2d"),img=g.createImageData(S,S),D=img.data,w=m.w;
  var eye=(org.z!=null?org.z:0)+pr.eye;
  viewshed(org.x,org.y,eye,org.heading,pr.fov,pr.range,function(k){
    var i=k%w-ci+R,j=cj+R-Math.floor(k/w);
    if(i<0||j<0||i>=S||j>=S)return;
    var p=(j*S+i)*4;D[p]=255;D[p+1]=214;D[p+2]=74;D[p+3]=92;
  });
  g.putImageData(img,0,0);
  var tl=w2s(m.x0+(ci-R-0.5)*m.cell,m.y0+(cj+R+0.5)*m.cell),sz=S*m.cell*view.k;
  ctx.save();
  ctx.imageSmoothingEnabled=true;
  ctx.drawImage(SIGHT_CV,tl[0],tl[1],sz,sz);
  // the edges of the field of view
  var p0=w2s(org.x,org.y),half=pr.fov*Math.PI/360,r=pr.range*view.k;
  ctx.strokeStyle="rgba(255,214,74,.75)";ctx.lineWidth=1;ctx.setLineDash([6,4]);
  ctx.beginPath();
  ctx.moveTo(p0[0],p0[1]);ctx.lineTo(p0[0]+Math.cos(org.heading-half)*r,p0[1]-Math.sin(org.heading-half)*r);
  ctx.moveTo(p0[0],p0[1]);ctx.lineTo(p0[0]+Math.cos(org.heading+half)*r,p0[1]-Math.sin(org.heading+half)*r);
  ctx.arc(p0[0],p0[1],r,-(org.heading+half),-(org.heading-half));

// ---- coverage: every guard and camera, and the walkable ground nobody sees
var COVER={key:"",job:null,count:null,img:null,stats:null};
function coverageKey(){
  var sig=0;
  watchers().forEach(function(o){sig=(sig*31+Math.round(o.x*7+o.y*13+(o.gamma||0)*101)+(o.patrol||[]).length+(o.sees||0)*3+(o.fov||0)*5)%2147483647});
  return sightKey()+"|"+sig+"|"+JSON.stringify(SIGHT)+"|"+nodeVer;
}
function watchers(){
  return allObjects().filter(function(o){return (o.type==="soldier"&&!o.cutscene&&(o.team==null||o.team!==0))||o.type==="camera"});
}
function walkableMask(){
  var m=TERR.meta,w=m.w,h=m.h,mask=new Uint8Array(w*h),rad=Math.round(4/m.cell);
  Object.keys(GRAPHS||{}).forEach(function(gid){
    nodesOf(gid).forEach(function(n){
      var ci=Math.round((n.x-m.x0)/m.cell),cj=Math.round((n.y-m.y0)/m.cell);
      var g=TERR.h[cj*w+ci];
      if(g==null||g!==g||Math.abs(n.z-g)>FLOOR_MAX+0.5)return;     // floors up in buildings don't count
      for(var j=Math.max(0,cj-rad);j<=Math.min(h-1,cj+rad);j++)
        for(var i=Math.max(0,ci-rad);i<=Math.min(w-1,ci+rad);i++)
          if((i-ci)*(i-ci)+(j-cj)*(j-cj)<=rad*rad)mask[j*w+i]=1;
    });
  });
  var G=obstacleGrid();
  for(var k=0;k<mask.length;k++)if(mask[k]&&G.top[k]>TERR.h[k]+FLOOR_MAX)mask[k]=0;
  return mask;
}
function computeCoverage(){
  if(!TERR||!MeshSprites.ready())return;
  var key=coverageKey();
  if(COVER.key===key)return;
  // wait until the editing stops; the old picture stays up meanwhile
  var m=TERR.meta,count=new Uint8Array(m.w*m.h),list=watchers(),idx=0,job={};
  clearTimeout(COVER.t);
  COVER={key:key,job:job,count:count,img:COVER.img,stats:COVER.stats,done:0,total:list.length,
         t:setTimeout(function(){chunk()},COVER.img?400:0)};
  function one(o){
    var pr=sightProfile(o),seen=new Uint8Array(count.length),poses=[];
    if(o.type==="soldier"&&SIGHT.routes&&isWalker(o)){
      var tr=trackFor(o),T=tr.cycleT,lastH=facingOf(o);
      for(var t=0;t<T;t+=Math.max(3,T/14)){
        var p=trackPos(tr,tr.introT+t);if(!p)continue;
        if(p.moving)lastH=p.h;
        var tz=terrainZ(p.x,p.y);
        poses.push({x:p.x,y:p.y,z:tz!=null?tz:o.z,heading:p.moving?p.h:lastH});
      }
    }
    if(o.type==="camera"){
      // a sweeping camera watches its whole arc over time
      var cm=camOf(o),r0=-(cm.right||0),r1=cm.left||0,n=Math.max(1,Math.ceil((r1-r0)/Math.max(10,(cm.fov||60)*0.6)));
      for(var st=0;st<=n;st++)poses.push({x:o.x,y:o.y,z:o.z,heading:facingOf(o)+(r0+(r1-r0)*st/n)*Math.PI/180});
    }
    if(!poses.length)poses.push({x:o.x,y:o.y,z:o.z,heading:facingOf(o)});
    poses.forEach(function(ps){
      viewshed(ps.x,ps.y,(ps.z||0)+pr.eye,ps.heading,pr.fov,pr.range,function(k){seen[k]=1});
    });
    for(var k=0;k<seen.length;k++)if(seen[k]&&count[k]<255)count[k]++;
  }
  function chunk(){
    if(COVER.job!==job)return;
    var t0=performance.now();
    while(idx<list.length&&performance.now()-t0<30){one(list[idx]);idx++}
    COVER.done=idx;
    if(idx<list.length){setTimeout(chunk,0);renderSightPanel();return}
    // picture: seen once pale, more often brighter; walkable ground nobody sees in red
    var mask=walkableMask(),w=m.w,h=m.h,cv=document.createElement("canvas");cv.width=w;cv.height=h;
    var g=cv.getContext("2d"),img=g.createImageData(w,h),D=img.data,walk=0,seenWalk=0;
    for(var j=0;j<h;j++)for(var i=0;i<w;i++){
      var k=j*w+i,c=count[k],p=((h-1-j)*w+i)*4;
      if(mask[k]){walk++;if(c)seenWalk++}
      if(c){D[p]=255;D[p+1]=246;D[p+2]=170;D[p+3]=Math.min(120,26+c*22)}
      else if(mask[k]){var stripe=((i+(h-1-j))%5)<2;D[p]=255;D[p+1]=46;D[p+2]=46;D[p+3]=stripe?190:70}
    }
    g.putImageData(img,0,0);
    COVER.img=cv;COVER.job=null;
    COVER.stats={watchers:list.length,walk:walk,seen:seenWalk};
    renderSightPanel();buildLegend();draw();
  }
}
function drawCoverage(){
  if(!layers.coverage||!TERR)return;
  computeCoverage();
  if(!COVER.img)return;
  var r=terrainRect();
  ctx.save();ctx.imageSmoothingEnabled=false;ctx.drawImage(COVER.img,r[0],r[1],r[2],r[3]);ctx.restore();
}

/* ---------------- routes ---------------- */
// Can the player get to each objective on foot from the start, and how quietly?
// A walk grid on the terrain's own cells: not steeper than 40 degrees, nothing
// built over it higher than a step (the sight lines' obstacle grid: buildings,
// masonry walls), no wire or electric fence across it (a climbable one and a
// gate are ways through, and so is a building, slowly: its doors are not known).
// From the start, the least-seen way to each objective
// (Dijkstra, 8 neighbours; a cell watched by guards or cameras costs up to 16
// times more). An objective inside a building: the route ends at its walls, the
// grid does not know the doors. An estimate, like the sight lines.
var ROUTES={key:"",list:null,on:false,ms:0};
function playerObj(){return LEVEL?LEVEL.objects.filter(function(o){return o.type==="player"})[0]||null:null}
function routeTargets(){
  // where a target stands, not where a patrolling guard has walked to right now
  return objectives.map(function(ob,i){
    var o=ob.kind!=="reach"&&ob.kind!=="level"?objTarget(ob):null,w=o&&o.x!=null?{x:o.x,y:o.y}:objWhere(ob);
    return w?{i:i,x:w.x,y:w.y,ob:ob}:null;
  }).filter(Boolean);
}
function routesKey(){
  var p=playerObj();
  return sightKey()+"|"+(COVER.img&&!COVER.job?COVER.key:"-")+"|"+(p?p.x.toFixed(1)+","+p.y.toFixed(1):"")+"|"+
    routeTargets().map(function(t){return t.x.toFixed(1)+","+t.y.toFixed(1)}).join(";");
}
function walkGrid(x0,x1,y0,y1){
  var m=TERR.meta,w=m.w,H=TERR.h,G=obstacleGrid(),cell=m.cell,rise=Math.tan(40*Math.PI/180)*cell;
  var ok=new Uint8Array(m.w*m.h),B=blockers(),way={},house={};
  // a door or a gate is a way through, not a wall; a building has doors the
  // grid does not know, so it is a way through too, a slow one (2)
  B.forEach(function(o,oi){if(o.type==="door"||wallKind(o)==="gate")way[oi]=1;else if(o.type==="building")house[oi]=1});
  for(var j=Math.max(1,y0);j<Math.min(m.h-1,y1);j++)for(var i=Math.max(1,x0);i<Math.min(w-1,x1);i++){
    var k=j*w+i,g=H[k],under=G.top[k]>g+FLOOR_MAX;
    if(!(g===g)||(under&&!way[G.id[k]]&&!house[G.id[k]]))continue;
    var a=H[k-1],b=H[k+1],c=H[k-w],d=H[k+w];
    if(!(a===a&&b===b&&c===c&&d===d))continue;
    if(!under&&(Math.abs(a-g)>rise||Math.abs(b-g)>rise||Math.abs(c-g)>rise||Math.abs(d-g)>rise))continue;
    ok[k]=under&&house[G.id[k]]?2:1;
  }
  walls().forEach(function(sg){
    if(sg.kind!=="fence"&&sg.kind!=="electric")return;
    if(isRemoved(sg.o))return;
    var len=Math.hypot(sg.b[0]-sg.a[0],sg.b[1]-sg.a[1]),n=Math.max(1,Math.ceil(len/(cell*0.4)));
    for(var s=0;s<=n;s++){
      var x=sg.a[0]+(sg.b[0]-sg.a[0])*s/n,y=sg.a[1]+(sg.b[1]-sg.a[1])*s/n;
      var ci=Math.round((x-m.x0)/cell),cj=Math.round((y-m.y0)/cell);
      for(var dj=-1;dj<=0;dj++)for(var di=-1;di<=0;di++){
        var ii=ci+di,jj=cj+dj;if(ii>=0&&jj>=0&&ii<w&&jj<m.h)ok[jj*w+ii]=0;
      }
    }
  });
  return ok;
}
// the passable cell nearest a point, within r cells
function nearCell(ok,x,y,r){
  var m=TERR.meta,ci=Math.round((x-m.x0)/m.cell),cj=Math.round((y-m.y0)/m.cell),best=-1,bd=1e9;
  for(var j=cj-r;j<=cj+r;j++)for(var i=ci-r;i<=ci+r;i++){
    if(i<0||j<0||i>=m.w||j>=m.h)continue;
    var k=j*m.w+i,d=(i-ci)*(i-ci)+(j-cj)*(j-cj);
    if(ok[k]&&d<bd){bd=d;best=k}
  }
  return {k:best,d:Math.sqrt(bd)*m.cell};
}
function findRoutes(){
  if(!TERR||!LEVEL)return null;
  var p=playerObj(),T=routeTargets();
  if(!p||!T.length)return ROUTES.list=[];
  var key=routesKey();
  if(ROUTES.key===key&&ROUTES.list)return ROUTES.list;
  var t0=performance.now(),m=TERR.meta,w=m.w,cell=m.cell;
  // only the part of the map between the start and the objectives, and 150 m round it
  var xs=[p.x].concat(T.map(function(t){return t.x})),ys=[p.y].concat(T.map(function(t){return t.y}));
  var pad=150/cell,x0=Math.floor((Math.min.apply(null,xs)-m.x0)/cell-pad),x1=Math.ceil((Math.max.apply(null,xs)-m.x0)/cell+pad);
  var y0=Math.floor((Math.min.apply(null,ys)-m.y0)/cell-pad),y1=Math.ceil((Math.max.apply(null,ys)-m.y0)/cell+pad);
  var ok=walkGrid(x0,x1,y0,y1),seen=COVER.img&&!COVER.job&&COVER.count&&COVER.count.length===ok.length?COVER.count:null;
  var s=nearCell(ok,p.x,p.y,Math.round(6/cell));
  if(s.k<0){ROUTES.key=key;return ROUTES.list=T.map(function(t){return {i:t.i,ob:t.ob,reach:false,why:"the start is not on walkable ground"}})}

  dist.fill(Infinity);prev.fill(-1);dist[s.k]=0;
  // a binary heap of cells by cost so far
  var heap=[s.k];
  function push(k){heap.push(k);var i=heap.length-1;while(i>0){var q=(i-1)>>1;if(dist[heap[q]]<=dist[k])break;heap[i]=heap[q];i=q}heap[i]=k}
  function pop(){var top=heap[0],last=heap.pop();if(heap.length){var i=0,L=heap.length;for(;;){var a=2*i+1,b=a+1,c=i;
    if(a<L&&dist[heap[a]]<dist[last])c=a;if(b<L&&dist[heap[b]]<(c===i?dist[last]:dist[heap[c]]))c=b;if(c===i)break;heap[i]=heap[c];i=c}heap[i]=last}return top}
  var goals={},left=0;
  var G2=T.map(function(t){var g=nearCell(ok,t.x,t.y,Math.round(30/cell));if(g.k>=0&&!goals[g.k]){goals[g.k]=1;left++}return g});
  var DI=[-1,1,-w,w,-w-1,-w+1,w-1,w+1],DC=[1,1,1,1,1.4142,1.4142,1.4142,1.4142];
  while(heap.length&&left){
    var k=pop();if(done[k])continue;done[k]=1;
    if(goals[k]){goals[k]=0;left--}
    var ki=k%w,base=dist[k];
    for(var d=0;d<8;d++){
      var q=k+DI[d],qi=q%w;
      if(q<0||q>=n||!ok[q]||done[q]||Math.abs(qi-ki)>1)continue;
      var c=seen?seen[q]:0,nd=base+DC[d]*cell*(1+5*Math.min(c,3))*(ok[q]===2?8:1);
      if(nd<dist[q]){dist[q]=nd;prev[q]=k;push(q)}
    }
  }
  var list=T.map(function(t,idx){
    var g=G2[idx],o={i:t.i,ob:t.ob,x:t.x,y:t.y};
    if(g.k<0){o.reach=false;o.why="nowhere to walk within 30 m of it";return o}
    if(!done[g.k]){o.reach=false;o.why="no way there on foot: a fence, a wall or steep ground is in the way";return o}
    var path=[],len=0,seenLen=0,k2=g.k,thru=false;
    while(k2>=0){path.push(k2);if(ok[k2]===2)thru=true;var pk=prev[k2];
      if(pk>=0){var st=Math.hypot((k2%w)-(pk%w),Math.floor(k2/w)-Math.floor(pk/w))*cell;len+=st;if(seen&&seen[k2])seenLen+=st}
      k2=pk}
    o.reach=true;o.path=path.reverse();o.len=len;o.seen=seen?seenLen:null;o.inside=g.d>2*cell;o.thru=thru;
    return o;
  });
  ROUTES.key=key;ROUTES.list=list;ROUTES.ms=Math.round(performance.now()-t0);
  return list;
}
function routeScore(list){

/* ---------------- doors ---------------- */
// A door of the level can be locked until something happens, have a lock the

var DOOR_LOCKS=[["","As the level"],["always","Always locked"],["switch","Until a switch is pressed","Click a switch",EV_WHEN_TEST("switch")],
  ["terminal","Until a terminal is hacked","Click a terminal",EV_WHEN_TEST("hacked")],["item","Until an item is picked up","Click a weapon or item",EV_WHEN_TEST("picked")],
  ["guard","Until a guard dies","Click a guard",EV_WHEN_TEST("dead")],["event","Until an event happens"]];

function doorLock(o){return (o&&o.lock)||{}}
function doorLocked(o){return !!(o&&((o.lock&&o.lock.kind)||o.pick||o.openOn))}
function doorKey(o){var t=doorLock(o).target;if(!t)return null;return t.uid?placements.filter(function(p){return p.uid===t.uid})[0]||null:t.ref?objByRef(t.ref):null}

  var L=doorLock(o),d=DOOR_LOCKS.filter(function(x){return x[0]===L.kind})[0];
  if(L.kind==="event")return events.some(function(v){return v.uid===L.event})?null:"no event picked";
  if(d&&d[3]){var k=doorKey(o);return !k?"nothing picked":(d[3](k)?null:"that can't unlock it")}
  if(o.openOn&&!events.some(function(v){return v.uid===o.openOn}))return "the event that opens it is gone";
  return null;

function doorSection(o){
  if(!lockable(o))return "";
  var L=doorLock(o),ro=!canEditQuiet(),d=DOOR_LOCKS.filter(function(x){return x[0]===(L.kind||"")})[0]||DOOR_LOCKS[0],pr=doorProblem(o),k=doorKey(o);
  var h='<div class="lbl" style="margin-top:12px">Lock</div>'+
    '<div class="field" style="margin-top:5px"><span class="lbl">Locked</span><select id="dr-lock"'+(ro?' disabled':'')+'>'+
    DOOR_LOCKS.map(function(x){return '<option value="'+x[0]+'"'+(x[0]===(L.kind||"")?' selected':'')+'>'+esc(x[1])+'</option>'}).join("")+'</select></div>';
  if(d[3])h+='<div class="ob-t" style="margin-top:5px"><span class="'+(pr&&!k?'bad':'')+'">'+esc(k?displayName(k):"not picked")+'</span>'+
    '<button class="btn'+(DOORPICK===o?' on':'')+'" id="dr-pick"'+(ro?' disabled':'')+'>'+(DOORPICK===o?'Click it on the map':'Pick')+'</button></div>';

    '<input type="number" id="dr-pk" min="0" max="60" step="1" value="'+(o.pick||0)+'"'+(ro?' disabled':'')+'></div>'+
    '<div class="field" style="margin-top:7px"><span class="lbl">Opens by itself</span><select id="dr-open"'+(ro?' disabled':'')+'><option value="">As the level</option>'+
    events.map(function(v,i){return '<option value="'+esc(v.uid)+'"'+(o.openOn===v.uid?' selected':'')+'>When event '+(i+1)+' happens: '+esc(eventLabel(v))+'</option>'}).join("")+'</select></div>'+
    (pr?'<div class="note bad" style="margin-top:7px">'+esc(pr)+'</div>':'');

function bindDoorSection(o){
  if(!$("dr-lock"))return;

/* ---------------- events ---------------- */
var EV_WHEN=[
  ["area","The player reaches an area","Click where the area is",null],

  ["dead","A guard dies","Click a guard",function(o){return o.type==="soldier"&&!o.cutscene&&(o.own||o.id>=0)}],
  ["hacked","A terminal is hacked","Click a terminal",function(o){return !o.own&&o.qtype==="Terminal"&&o.id>=0}],
  ["picked","An item is picked up","Click a weapon or item",function(o){return o.type==="pickup"&&(o.own?!/^AMMO_/.test(o.pickupId||""):/^(GunPickup|GenericPickup)$/.test(o.qtype||"")&&o.id>=0)}],
  ["destroyed","Something is blown up","Click a vehicle, camera or explosive",function(o){return (o.own&&o.type==="camera")||(!o.own&&o.id>=0&&/^(ExplodeObject|Car|Generator|SCamera|Radio|Terminal|Heli)$/.test(o.qtype||""))}],
  ["seen","A camera sees the player","Click a camera",function(o){return o.type==="camera"&&(o.own||o.id>=0)}],

// glyph for what it waits on, and a line under it for the ones with nothing to click

  seen:"camera",alarm:"siren",time:"clock",after:"after"};

var EV_DO=[["message","Show a message"],["alarm","Raise an alarm"],["guards","Send in guards"],["doors","Open doors"],["fail","The mission fails"]];

function evWhen(k){return EV_WHEN.filter(function(x){return x[0]===k})[0]||EV_WHEN[0]}

  var t=(v.when||{}).target;if(!t)return null;

  var w=v.when||{},k=evWhen(w.kind);

  if(P.what==="doors"){
