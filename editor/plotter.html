/* ---------------- easy and hard versions of a mission ---------------- */
// Copies of the open mission in the library, made harder or easier by rules:
// easy: a third fewer of your guards, everyone sees 20% less, cameras 25%
// less far, 50% more time, the alarm does not fail it, a medipack by the start;
// hard: one more guard for every two of yours (on walkways near them), sight
// 25% further, cameras 25% further, 25% less time, the alarm fails it, half
// your medipacks gone. Guards that objectives or events name are kept.
function versionPlan(kind){
  var p=JSON.parse(JSON.stringify(planOf())),notes=[];
  if(kind==="normal")return {plan:p,notes:["as it is"]};
  var easy=kind==="easy",keep={};
  (p.objectives||[]).forEach(function(ob){if(ob.target&&ob.target.uid)keep[ob.target.uid]=1});
  (p.events||[]).forEach(function(v){var t=v.when&&v.when.target;if(t&&t.uid)keep[t.uid]=1});
  var guards=p.placements.filter(function(q){return q.type==="soldier"&&!q.arriveOn});
  function base(q){return /SNIPER/.test(q.ai||"")?SIGHT.sniperRange:SIGHT.guardRange}
  var fs=easy?0.8:1.25,cf=easy?0.75:1.25;
  if(easy){
    var drop=guards.filter(function(q,i){return i%3===2&&!keep[q.uid]}),gone={};
    drop.forEach(function(q){gone[q.uid]=1});
    p.placements=p.placements.filter(function(q){return !gone[q.uid]});
    if(drop.length)notes.push(drop.length+" of your guards fewer");
  }else{
    var taken=guards.slice(),added=0;
    guards.forEach(function(q,i){
      if(i%2)return;
      var sp=draftSpots(q.x,q.y,1,taken,q.z)[0];if(!sp)return;
      var n={uid:uid(),type:"soldier",kind:"soldier",ai:q.ai,model:q.model,weapon:q.weapon,name:q.name,graph:guardGraph(sp.x,sp.y,sp.z),
        patrol:[],x:+sp.x.toFixed(3),y:+sp.y.toFixed(3),z:+sp.z.toFixed(3),gamma:q.gamma};
      p.placements.push(n);taken.push(n);added++;
    });
    if(added)notes.push(added+" more guards by yours");
  }
  p.placements.forEach(function(q){
    if(q.type==="soldier"){q.sees=Math.max(10,Math.min(200,Math.round((q.sees||base(q))*fs)))}
    if(q.type==="camera"&&q.cam){q.cam.range=Math.max(5,Math.min(80,Math.round((q.cam.range||30)*cf)))}
  });
  // the level's own guards see less or further too (their scripts get the new sight)
  var byRef={};(p.edits||[]).forEach(function(e){byRef[e.ref]=e});
  (LEVEL?LEVEL.objects:[]).forEach(function(o){
    if(o.type!=="soldier"||o.cutscene||isRemoved(o)||!o.ref||(p.removals||[]).indexOf(o.id)>=0)return;
    var e=byRef[o.ref];
    if(!e){e={ref:o.ref,type:"soldier",qtype:o.qtype,id:o.id,name:displayName(o),graph:String(o.graph)};p.edits.push(e);byRef[o.ref]=e}
    e.sees=Math.max(10,Math.min(200,Math.round((e.sees||o.sees||base(o))*fs)));
  });
  notes.push("guards see "+(easy?"20% less":"25% further")+", cameras "+(easy?"25% less":"25% further"));
  var st=p.settings||{};
  if(st.timeLimit){st.timeLimit=Math.max(60,Math.round(st.timeLimit*(easy?1.5:0.75)));notes.push("time limit "+clock(st.timeLimit))}
  p.settings=st;
  var hadObj=(p.objectives||[]).length>0;
  p.failOnAlarm=easy?false:hadObj;
  if(hadObj)notes.push(easy?"the alarm does not fail it":"the alarm fails it");
  if(easy){
    var pl=playerObj(),pe=pl&&(p.edits||[]).filter(function(e){return e.ref===pl.ref})[0],px=pe&&pe.x!=null?pe.x:pl&&pl.x,py=pe&&pe.y!=null?pe.y:pl&&pl.y;
    if(pl){var gz=groundAt(px+2,py+1);p.placements.push({uid:uid(),type:"pickup",kind:"pickup",pickupId:"WEAPON_ID_MEDIPACK",name:weaponLabel("WEAPON_ID_MEDIPACK"),
      x:+(px+2).toFixed(3),y:+(py+1).toFixed(3),z:gz!=null?+gz.toFixed(3):pl.z,gamma:0,count:null});notes.push("a medipack by the start")}
  }else{
    var meds=p.placements.filter(function(q){return q.type==="pickup"&&q.pickupId==="WEAPON_ID_MEDIPACK"}),mg={};
    meds.forEach(function(q,i){if(i%2===0)mg[q.uid]=1});
    if(Object.keys(mg).length){p.placements=p.placements.filter(function(q){return !mg[q.uid]});notes.push("half your medipacks gone")}
  }
  return {plan:p,notes:notes};
}
function makeVersions(kinds){
  if(!M||READONLY||!Store||Store.local)return Promise.reject(new Error("Versions need a mission of your own and the studio server"));
  var name=MISSION,desc=M.description||"",baseDef=M.base;
  return kinds.reduce(function(pr,k){return pr.then(function(acc){
    var v=versionPlan(k);

      return Store.save(m.id,{plan:v.plan}).then(function(){acc.push({difficulty:k,id:m.id,name:m.name,changes:v.notes});return acc});
    });
  })},Promise.resolve([]));
}

/* ---------------- the AI designer's designs ---------------- */
// What the AI designer makes up for the inventory: a structure of parts the
// game has (a guard post, a sniper nest, a checkpoint, a weapons cache), or a
// character (a type with its own model, weapon and sight). Each is a group's
// data, so it places, turns and is kept like a saved group; the user looks at
// it in 3D and adds it to the inventory, or places it straight away. New
// weapon types or new 3D models are not possible: the game defines its
// weapons for every mission at once, and models come from its files.
function designParts(d){
  return ((d&&d.items)||[]).map(function(p){
    var m=p.type==="soldier"?armedModel(p.model,p.weapon):p.type==="pickup"?(window.MeshSprites&&MeshSprites.pickupModel(p.pickupId)):p.model;
    return {model:m,x:p.dx||0,y:p.dy||0,z:p.z||0,g:p.gamma||0};
  }).filter(function(p){return p.model});
}
function designMesh(key,d){
  if(!window.MeshSprites||!MeshSprites.ready()||!d)return null;
  return MeshSprites.composite(key,designParts(d));
}
// how much ground it covers, [across x, across y] in metres
function designSize(d){
  var mnx=1e9,mny=1e9,mxx=-1e9,mxy=-1e9;
  (d.items||[]).forEach(function(p){
    var z=p.type==="building"&&MODELS&&MODELS.sizes&&MODELS.sizes[p.model],hw=z&&z.w?z.w/2:0.5,hd=z&&z.w?z.d/2:0.5;
    var cx=z?(z.cx||0):0,cy=z?(z.cy||0):0,g=p.gamma||0,c=Math.cos(g),s2=Math.sin(g);
    [[-hw,-hd],[hw,-hd],[hw,hd],[-hw,hd]].forEach(function(k){
      var x=p.dx+(cx+k[0])*c-(cy+k[1])*s2,y=p.dy+(cx+k[0])*s2+(cy+k[1])*c;
      mnx=Math.min(mnx,x);mxx=Math.max(mxx,x);mny=Math.min(mny,y);mxy=Math.max(mxy,y);

/* ---------------- walkways where there are none, and what a guard sees ---------------- */
// The nearest walkway point on the floor a height is on: the level's nodes and
// your own that are linked. {n:{x,y,z}, g:graph, d:metres} or null.
// the nearest walkway point on the floor at height z; with surface, the
// nearest one standing on the terrain (not in a building, a tunnel or a cellar)
function onSurface(n){var t=terrainZ(n.x,n.y);return t!=null&&Math.abs(n.z-t)<=5}
function nearestWalk(x,y,z,surface){
  var best=null,bd=1e18;
  Object.keys(GRAPHS||{}).forEach(function(g){nodesOf(g).forEach(function(n){
    if(z!=null&&Math.abs(n.z-z)>SAME_FLOOR)return;
    if(surface&&!onSurface(n))return;
    var d=(n.x-x)*(n.x-x)+(n.y-y)*(n.y-y);if(d<bd){bd=d;best={n:n,g:g}}
  })});
  navNodes.forEach(function(n){
    if(z!=null&&Math.abs(n.z-z)>SAME_FLOOR)return;
    if(surface&&!onSurface(n))return;
    var d=(n.x-x)*(n.x-x)+(n.y-y)*(n.y-y);if(d<bd&&nodeLinks(n).length){bd=d;best={n:n,g:n.graph}}
  });
  if(best)best.d=Math.sqrt(bd);

// a way on foot between two points over open ground (the routes' walk grid,
// buildings as walls), as points; null when there is none within 60 m round
function walkPath(a,b){

  var x0=Math.floor((Math.min(a.x,b.x)-m.x0)/cell-pad),x1=Math.ceil((Math.max(a.x,b.x)-m.x0)/cell+pad);
  var y0=Math.floor((Math.min(a.y,b.y)-m.y0)/cell-pad),y1=Math.ceil((Math.max(a.y,b.y)-m.y0)/cell+pad);

    if(l<L&&dist[heap[l]]<dist[last])c=l;if(r<L&&dist[heap[r]]<(c===i?dist[last]:dist[heap[c]]))c=r;if(c===i)break;heap[i]=heap[c];i=c}heap[i]=last}return top}

  while(heap.length){

// like resample, but steps shorten on steep ground so that each rises or
// falls by less than a walkway link allows (2.5 m; 2 m kept)
function resampleClimb(path,sp){

  for(var i=1;i<fine.length;i++){
    var q=fine[i],z=groundAt(q[0],q[1]),d=Math.hypot(q[0]-last[0],q[1]-last[1]);
    if(z!=null&&lz!=null&&Math.abs(z-lz)>2){out.push(prev);last=prev;lz=groundAt(prev[0],prev[1]);d=Math.hypot(q[0]-last[0],q[1]-last[1])}

// points every sp metres along a line of points, the last one included

  var out=[path[0]],carry=0;
  for(var i=1;i<path.length;i++){
    var a=path[i-1],b=path[i],L=Math.hypot(b[0]-a[0],b[1]-a[1]),t=sp-carry;
    while(t<=L){out.push([a[0]+(b[0]-a[0])*t/L,a[1]+(b[1]-a[1])*t/L]);t+=sp}
    carry=L-(t-sp);

    var tr=trackFor(o),T=tr.cycleT,lastH=facingOf(o);
    for(var t=0;t<T;t+=Math.max(3,T/14)){

  // What is physically wrong with a design: parts floating or sunk, the same
  // part twice, a part far from the rest, a guard or pickup inside a wall.
  // A part's box is its model's (models.json: w, d, h, the box's centre cx, cy
  // from the origin, its bottom z0), turned by the part's gamma
  // anticlockwise, model y north, as the map draws it.
  function designFlaws(items){
    var out=[],parts=[];
    items.forEach(function(it,i){
      if(it.type!=="building")return;
      var s=MODELS.sizes[it.model];if(!s)return;
      var g=it.gamma||0,c=Math.cos(g),n=Math.sin(g),cx=s.cx||0,cy=s.cy||0;
      var ox=it.dx+cx*c-cy*n,oy=it.dy+cx*n+cy*c,hx=(Math.abs(s.w*c)+Math.abs(s.d*n))/2,hy=(Math.abs(s.w*n)+Math.abs(s.d*c))/2;
      var z0=(it.z||0)+(s.z0||0);

    });
    function meets(a,b,m){return a.x0-m<b.x1&&b.x0-m<a.x1&&a.y0-m<b.y1&&b.y0-m<a.y1}
    function gap(a,b){return Math.hypot(Math.max(0,a.x0-b.x1,b.x0-a.x1),Math.max(0,a.y0-b.y1,b.y0-a.y1))}

    function nm(p){return "part "+p.n+" ("+p.name+")"}
    parts.forEach(function(p){
      if(p.z0>0.35){
        var on=parts.some(function(q){return q!==p&&meets(p,q,0.05)&&p.z0>=q.z0-0.3&&p.z0<=q.z1+0.5});
        if(!on){
          var under=parts.filter(function(q){return q!==p&&meets(p,q,0.05)}).map(function(q){return q.z1}).sort(function(a,b){return b-a})[0];
          out.push(nm(p)+" floats: its bottom is "+r1(p.z0)+" m up with nothing under it. "+(under!=null?"The part below tops out at "+r1(under)+" m.":"Set its dz to 0 or stand it on another part."));
        }
      }
      if(p.z1<0.3)out.push(nm(p)+" is sunk: its top is at "+r1(p.z1)+" m, under the ground.");
      else if(p.z0<-0.8)out.push(nm(p)+" sinks "+r1(-p.z0)+" m into the ground.");
    });
    for(var i=0;i<parts.length;i++)for(var j=i+1;j<parts.length;j++){
      var a=parts[i],b=parts[j];

        out.push(nm(a)+" and "+nm(b)+" are the same part in the same place.");
    }
    if(parts.length>=3)parts.forEach(function(p){
      var near=Math.min.apply(null,parts.filter(function(q){return q!==p}).map(function(q){return gap(p,q)}));
      if(near>10)out.push(nm(p)+" stands "+Math.round(near)+" m from the rest.");
    });
    items.forEach(function(it){
      if(it.type!=="soldier"&&it.type!=="pickup")return;
      var z=it.z||0,what=it.type==="soldier"?(it.name||"a guard"):(it.name||"a pickup");
      parts.forEach(function(p){
        // inside a wall, a fence, a crate: a thin part, or a low solid one, at his height
        var solid=Math.min(p.w,p.d)<1.6||p.z1-p.z0<2.6;
        if(solid&&z>=p.z0-0.3&&z<p.z1-0.2&&inside(p,it.dx,it.dy,it.type==="soldier"?0.3:0.05))
          out.push(what+" at "+r1(it.dx)+", "+r1(it.dy)+" is inside "+nm(p)+": move "+(it.type==="soldier"?"him":"it")+" clear of it, or up onto it (dz "+r1(p.z1)+").");
      });
    });
    return out.slice(0,12);
  }

        if(!r.reach){o.reach=false;o.why=r.why;return o}
        o.reach=true;o.length_m=Math.round(r.len);o.watched_m=r.seen!=null?Math.round(r.seen):null;

          else if(cur){if(cur.n*m.cell>=6)st.push(cur);cur=null}
        });

          .map(function(x){return {id:idOf(x.wt),name:displayName(x.wt),type:x.wt.type==="camera"?"camera":(x.wt.ai||"guard"),sees_m_of_it:Math.round(x.m),at:[r1(x.wt.x),r1(x.wt.y)]}});

  // Each tool has a kind, and each agent of the AI designer (editor/ai.js) the

  var KIND={add_walkways:"ground",remove_walkways:"ground",shape_ground:"ground",remove_ground_area:"ground",sculpt_terrain:"ground",

  var BY={};T.forEach(function(t){BY[t.name]=t;t.kind=KIND[t.name]||(t.look?"look":t.design?"design":"build")});
  // what an agent may use: a list of kinds, or the old modes ("build" is all)
  function kindsOf(a){return Array.isArray(a)?a:a==="build"?["look","design","build","ground","texts","library"]:["look","design"]}
  function allowed(t,a){var ks=kindsOf(a);return ks.indexOf(t.kind)>=0||(t.look&&ks.indexOf("look")>=0)}
  return {

  };

/* ---------------- panels you can widen ---------------- */
// Drag a side panel's inner edge to make it wider or narrower; double-click
// it for the usual width. The width is a CSS variable (--lw for the panels on
// the left, --rw for Selection, --aw for the AI designer), kept per browser.
function resizable(el,edge,prop,min,max){
  if(!el||el.querySelector(":scope > .resizer"))return;
  var root=document.documentElement,key="plotter:w"+prop,saved=0;
  try{saved=+localStorage.getItem(key)||0}catch(e){}
  if(saved)root.style.setProperty(prop,Math.max(min,Math.min(max,saved))+"px");
  var h=document.createElement("div");h.className="resizer "+edge;
  h.setAttribute("role","separator");h.setAttribute("aria-orientation","vertical");h.setAttribute("aria-label","Resize the panel");
  h.title="Drag to resize\nDouble-click for the usual width";
  el.appendChild(h);
  var tm=0;
  function kick(){if(!tm)tm=setTimeout(function(){tm=0;window.dispatchEvent(new Event("resize"))},16)}
  h.addEventListener("pointerdown",function(e){
    if(e.button!==0)return;
    e.preventDefault();
    var x0=e.clientX,w0=el.getBoundingClientRect().width;
    try{h.setPointerCapture(e.pointerId)}catch(err){}
    h.classList.add("on");document.body.classList.add("resizing");
    function mv(ev){var d=ev.clientX-x0;root.style.setProperty(prop,Math.round(Math.max(min,Math.min(max,edge==="r"?w0+d:w0-d)))+"px");kick()}
    function up(){
      h.removeEventListener("pointermove",mv);h.removeEventListener("pointerup",up);h.removeEventListener("pointercancel",up);
      h.classList.remove("on");document.body.classList.remove("resizing");
      try{localStorage.setItem(key,String(Math.round(el.getBoundingClientRect().width)))}catch(err){}
      window.dispatchEvent(new Event("resize"));
    }
    h.addEventListener("pointermove",mv);h.addEventListener("pointerup",up);h.addEventListener("pointercancel",up);
  });
  h.addEventListener("dblclick",function(){
    root.style.removeProperty(prop);try{localStorage.removeItem(key)}catch(err){}
    window.dispatchEvent(new Event("resize"));
  });
}
